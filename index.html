ُعَاءَ حِينَئِذٍ لاَ يُرَدُّ","source":"At-Tirmidhi, Abu Dawud, Ahmed. See Irwaa Al-Ghalil 1/262","sourceUrl":"https://sunnah.com/hisn:26"},{"id":"hisn-27","title":"ذكر من حصن المسلم (27)","category":"At the start of the prayer (after takbeer)","categoryEnglish":"دعاء الاستفتاح","text":"اللّهُـمَّ باعِـدْ بَيـني وَبَيْنَ خَطـايايَ كَما باعَدْتَ بَيْنَ المَشْرِقِ وَالمَغْرِبْ ، اللّهُـمَّ نَقِّنـي مِنْ خَطايايَ كَمـا يُـنَقَّى الثَّـوْبُ الأَبْيَضُ مِنَ الدَّنَسْ ، اللّهُـمَّ اغْسِلْنـي مِنْ خَطايـايَ بِالثَّلـجِ وَالمـاءِ وَالْبَرَدْ.","source":"Al-Bukhari 1/181, Muslim 1/419.","sourceUrl":"https://sunnah.com/hisn:27"},{"id":"hisn-28","title":"ذكر من حصن المسلم (28)","category":"At the start of the prayer (after takbeer)","categoryEnglish":"دعاء الاستفتاح","text":"سُبْـحانَكَ اللّهُـمَّ وَبِحَمْـدِكَ وَتَبارَكَ اسْمُـكَ وَتَعـالى جَـدُّكَ وَلا إِلهَ غَيْرُك","source":"Abu Dawud, Ibn Majah, An-Nasa'i, At-Tirmidhi. See Al-Albani, Sahih At-Tirmidhi 1/77 and Sahih Ibn Majah 1/135.","sourceUrl":"https://sunnah.com/hisn:28"},{"id":"hisn-29","title":"ذكر من حصن المسلم (29)","category":"At the start of the prayer (after takbeer)","categoryEnglish":"دعاء الاستفتاح","text":"وَجَّهـتُ وَجْهِـيَ لِلَّذي فَطَرَ السَّمـواتِ وَالأَرْضَ حَنـيفَاً وَمـا أَنا مِنَ المشْرِكين ، إِنَّ صَلاتـي ، وَنُسُكي ، وَمَحْـيايَ ، وَمَماتـي للهِ رَبِّ العالَمين ، لا شَريـكَ لَهُ وَبِذلكَ أُمِرْتُ وَأَنا مِنَ المسْلِـمين. اللّهُـمَّ أَنْتَ المَلِكُ لا إِلهَ إِلاّ أَنْت، أَنْتَ رَبِّـي وَأَنـا عَبْـدُك ، ظَلَمْـتُ نَفْسـي وَاعْـتَرَفْتُ بِذَنْبـي فَاغْفِرْ لي ذُنوبي جَميعاً إِنَّـه لا يَغْـفِرُ الذُّنـوبَ إلاّ أَنْت. وَاهْدِنـي لأَحْسَنِ الأَخْلاقِ لا يَهْـدي لأَحْسَـنِها إِلاّ أَنْـت ، وَاصْـرِف عَـنّْي سَيِّئَهـا، لا يَصْرِفُ عَـنّْي سَيِّئَهـا إِلاّ أَنْـت، لَبَّـيْكَ وَسَعْـدَيْك، وَالخَـيْرُ كُلُّـهُ بِيَـدَيْـك، وَالشَّرُّ لَيْـسَ إِلَـيْك ، أَنا بِكَ وَإِلَيْـك ، تَبـارَكْتَ وَتَعـالَيتَ أَسْتَغْـفِرُكَ وَأَتوبُ إِلَـيك","source":"Muslim 1/534","sourceUrl":"https://sunnah.com/hisn:29"},{"id":"hisn-30","title":"ذكر من حصن المسلم (30)","category":"At the start of the prayer (after takbeer)","categoryEnglish":"دعاء الاستفتاح","text":"اللّهُـمَّ رَبَّ جِـبْرائيل ، وَميكـائيل ، وَإِسْـرافيل، فاطِـرَ السَّمواتِ وَالأَرْض ، عالـِمَ الغَيْـبِ وَالشَّهـادَةِ أَنْـتَ تَحْـكمُ بَيْـنَ عِبـادِكَ فيـما كانوا فيهِ يَخْتَلِفـون. اهدِنـي لِمـا اخْتُـلِفَ فيـهِ مِنَ الْحَـقِّ بِإِذْنِك ، إِنَّـكَ تَهْـدي مَنْ تَشـاءُ إِلى صِراطٍ مُسْتَقـيم","source":"Muslim 1/534","sourceUrl":"https://sunnah.com/hisn:30"},{"id":"hisn-31","title":"ذكر من حصن المسلم (31)","category":"At the start of the prayer (after takbeer)","categoryEnglish":"دعاء الاستفتاح","text":"اللهُ أَكْبَـرُ كَبـيرا ، اللهُ أَكْبَـرُ كَبـيرا ، اللهُ أَكْبَـرُ كَبـيرا ، وَالْحَـمْدُ للهِ كَثـيرا ، وَالْحَـمْدُ للهِ كَثـيرا ، وَالْحَـمْدُ للهِ كَثـيرا ، وَسُبْـحانَ اللهِ بكْـرَةً وَأَصيـلا. ( ثَلاثاً ) أَعـوذُ بِاللهِ مِنَ الشَّـيْطانِ مِنْ نَفْخِـهِ وَنَفْـثِهِ وَهَمْـزِه","source":"Abu Dawud 1/203, Ibn Majah 1/265, ai Ahmad 4/85. Muslim recorded a similar Hadil 1/420.","sourceUrl":"https://sunnah.com/hisn:31"},{"id":"hisn-32","title":"ذكر من حصن المسلم (32)","category":"At the start of the prayer (after takbeer)","categoryEnglish":"دعاء الاستفتاح","text":"اللّهُـمَّ لَكَ الْحَمْدُ أَنْتَ نـورُ السَّمـواتِ وَالأَرْضِ وَمَنْ فيـهِن ،\nوَلَكَ الْحَمْدُ أَنْتَ قَـيِّمُ السَّـمواتِ وَالأَرْضِ وَمَنْ فيـهِن ، [وَلَكَ الْحَمْدُ أَنْتَ رَبُّ السَّـمواتِ وَالأَرْضِ وَمَنْ فيـهِن] [وَلَكَ الْحَمْدُ لَكَ مُلْـكُ السَّـمواتِ وَالأَرْضِ وَمَنْ فيـهِن] [وَلَكَ الْحَمْدُ أَنْتَ مَلِـكُ السَّـمواتِ وَالأَرْضِ ]\n[أَنْتَ الْحَـقّ وَوَعْـدُكَ الْحَـق ،\nوَقَوْلُـكَ الْحَـق ، وَلِقـاؤُكَ الْحَـق ، وَالْجَـنَّةُحَـق ، وَالنّـارُ حَـق ، وَالنَّبِـيّونَ حَـق ، وَمـحَمَّدٌ حَـق ،\n[اللّهُـمَّ لَكَ أَسْلَمت ، وَعَلَـيْكَ تَوَكَّلْـت ، وَبِكَ آمَنْـت ، وَإِلَـيْكَ أَنَبْـت ، وَبِـكَ خاصَمْت ، وَإِلَـيْكَ حاكَمْـت .\nفاغْفِـرْ لي مـا قَدَّمْتُ ، وَما أَخَّـرْت ، وَما أَسْـرَرْت ، وَما أَعْلَـنْت ] [أَنْتَ المُقَـدِّمُ وَأَنْتَ المُـؤَخِّر ، لا إِاـهَ إِلاّ أَنْـت] [أَنْـتَ إِلـهي لا إِاـهَ إِلاّ أَنْـت","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 3/3 , 11/ 116, 13/371, 423, 465. See also Muslim for a shorter account, 1/532.","sourceUrl":"https://sunnah.com/hisn:32"},{"id":"hisn-33","title":"ذكر من حصن المسلم (33)","category":"While bowing in prayer","categoryEnglish":"دعاء الركوع","text":"سُبْـحانَ رَبِّـيَ الْعَظـيم (ثلاث مرات)","source":"Abu Dawud, Ibn Majah, An-Nasa'i, At-Tirmidhi, and Ahmad. See Al-Albani's Sahih At-Tirmidhi 1/83.","sourceUrl":"https://sunnah.com/hisn:33"},{"id":"hisn-34","title":"ذكر من حصن المسلم (34)","category":"While bowing in prayer","categoryEnglish":"دعاء الركوع","text":"سُبْـحانَكَ اللّهُـمَّ رَبَّـنا وَبِحَـمْدِك ، اللّهُـمَّ اغْفِـرْ لي","source":"Al-Bukhari 1/99, Muslim 1/350.","sourceUrl":"https://sunnah.com/hisn:34"},{"id":"hisn-35","title":"ذكر من حصن المسلم (35)","category":"While bowing in prayer","categoryEnglish":"دعاء الركوع","text":"سُبـّوحٌ قُـدّْوس ، رَبُّ الملائِكَـةِ وَالـرُّوح","source":"Muslim 1/353, Abu Dawud 1/230.","sourceUrl":"https://sunnah.com/hisn:35"},{"id":"hisn-36","title":"ذكر من حصن المسلم (36)","category":"While bowing in prayer","categoryEnglish":"دعاء الركوع","text":"اللّهُـمَّ لَكَ رَكَـعْتُ وَبِكَ آمَـنْت، ولَكَ أَسْلَـمْت ، خَشَـعَ لَكَ سَمْـعي، وَبَصَـري ، وَمُخِّـي، وَعَظْمـي، وَعَصَـبي ، وَما استَقَـلَّ بِهِ قَدَمي","source":"Muslim 1/534, Abu Dawud, An-Nasa'i and At- Tirmidhi.","sourceUrl":"https://sunnah.com/hisn:36"},{"id":"hisn-37","title":"ذكر من حصن المسلم (37)","category":"While bowing in prayer","categoryEnglish":"دعاء الركوع","text":"سُبْـحانَ ذي الْجَبَـروت، والمَلَـكوت، وَالكِبْـرِياء، وَالْعَظَـمَةِ","source":"Abu Dawud 1/230, An-Nasa'i and Ahmad. Its chain of narration is good (Hasan).","sourceUrl":"https://sunnah.com/hisn:37"},{"id":"hisn-38","title":"ذكر من حصن المسلم (38)","category":"Upon rising from the bowing position","categoryEnglish":"دعاء الرفع من الركوع","text":"سَمِـعَ اللهُ لِمَـنْ حَمِـدَه","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 2/282.","sourceUrl":"https://sunnah.com/hisn:38"},{"id":"hisn-39","title":"ذكر من حصن المسلم (39)","category":"Upon rising from the bowing position","categoryEnglish":"دعاء الرفع من الركوع","text":"رَبَّنـا وَلَكَ الحَمْـدُ حَمْـداً كَثـيراً طَيِّـباً مُـبارَكاً فيه","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 2/284.","sourceUrl":"https://sunnah.com/hisn:39"},{"id":"hisn-40","title":"ذكر من حصن المسلم (40)","category":"Upon rising from the bowing position","categoryEnglish":"دعاء الرفع من الركوع","text":"مِلْءَ السَّمـواتِ وَمِلْءَ الأَرْض، وَما بَيْـنَهُمـا ، وَمِلْءَ ما شِئْـتَ مِنْ شَيءٍ بَعْـد . أَهـلَ الثَّـناءِ وَالمَجـد ، أََحَـقُّ ما قالَ العَبْـد ، وَكُلُّـنا لَكَ عَـبد . اللّهُـمَّ لا مانِعَ لِما أَعْطَـيْت ، وَلا مُعْطِـيَ لِما مَنَـعْت ، وَلا يَنْفَـعُ ذا الجَـدِّ مِنْـكَ الجَـد","source":"Muslim 1/346.","sourceUrl":"https://sunnah.com/hisn:40"},{"id":"hisn-41","title":"ذكر من حصن المسلم (41)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"سُبْـحانَ رَبِّـيَ الأَعْلـى. (ثلاث مرات)","source":"Abu Dawud, Ibn Majah, An-Nasa'i, At-Tirmidhi, and Ahmad. See also Al-Albani, Sahih At-Tirmidhi 1/83.","sourceUrl":"https://sunnah.com/hisn:41"},{"id":"hisn-42","title":"ذكر من حصن المسلم (42)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"سُبْـحانَكَ اللّهُـمَّ رَبَّـنا وَبِحَـمْدِكَ ، اللّهُـمَّ اغْفِرْ لي","source":"Al-Bukhari and Muslim, see invocation no. 34 above.","sourceUrl":"https://sunnah.com/hisn:42"},{"id":"hisn-43","title":"ذكر من حصن المسلم (43)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"سُبـّوحٌ قُـدّوس، رَبُّ الملائِكَـةِ وَالـرُّوح","source":"Muslim 1/533, see invocation no. 35 above.","sourceUrl":"https://sunnah.com/hisn:43"},{"id":"hisn-44","title":"ذكر من حصن المسلم (44)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"اللّهُـمَّ لَكَ سَـجَدْتُ وَبِـكَ آمَنْـت ، وَلَكَ أَسْلَـمْت ، سَجَـدَ وَجْهـي للَّـذي خَلَقَـهُ وَصَـوَّرَهُ وَشَقَّ سَمْـعَـهُ وَبَصَـرَه ، تَبـارَكَ اللهُ أَحْسـنُ الخـالِقيـن","source":"Muslim 1/534 and others.","sourceUrl":"https://sunnah.com/hisn:44"},{"id":"hisn-45","title":"ذكر من حصن المسلم (45)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"سُبْـحانَ ذي الْجَبَـروت، والمَلَكـوت، والكِبْـرِياء، وَالعَظَمَـةِ.","source":"Abu Dawud 1/230, An-Nasa'i, Ahmad. See also Al-Albani, Sahih Abu Dawud 1/166, see invocation no. 37 above.","sourceUrl":"https://sunnah.com/hisn:45"},{"id":"hisn-46","title":"ذكر من حصن المسلم (46)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"اللّهُـمَّ اغْفِـرْ لي ذَنْـبي كُلَّـه ، دِقَّـهُ وَجِلَّـه ، وَأَوَّلَـهُ وَآخِـرَه ، وَعَلانِيَّتَـهُ وَسِـرَّه","source":"Muslim 1/350.","sourceUrl":"https://sunnah.com/hisn:46"},{"id":"hisn-47","title":"ذكر من حصن المسلم (47)","category":"While prostrating","categoryEnglish":"دعاء السجود","text":"اللّهُـمَّ إِنِّـي أَعـوذُ بِرِضـاكَ مِنْ سَخَطِـك ، وَبِمعـافاتِـكَ مِنْ عُقوبَـتِك ، وَأَعـوذُ بِكَ مِنْـك ، لا أُحْصـي ثَنـاءً عَلَـيْك ، أَنْـتَ كَمـا أَثْنَـيْتَ عَلـى نَفْسـِك\nدعاء الجلسة بين السجدتين","source":"Muslim 1/352.","sourceUrl":"https://sunnah.com/hisn:47"},{"id":"hisn-48","title":"ذكر من حصن المسلم (48)","category":"Between the two prostrations","categoryEnglish":"دعاء الجلسة بين السجدتين","text":"رَبِّ اغْفِـرْ لي ، رَبِّ اغْفِـرْ لي","source":"Abu Dawud 1/231. See also Al-Albani, Sahihibn Mdjah 1/148.","sourceUrl":"https://sunnah.com/hisn:48"},{"id":"hisn-49","title":"ذكر من حصن المسلم (49)","category":"Between the two prostrations","categoryEnglish":"دعاء الجلسة بين السجدتين","text":"اللّهُـمَّ اغْفِـرْ لي ، وَارْحَمْـني ، وَاهْدِنـي ، وَاجْبُرْنـي ، وَعافِنـي وَارْزُقْنـي وَارْفَعْـني","source":"Abu Dawud, Ibn Majah, At-Tirmidhi. See also Al-Albani, Sahih At-Tirmidhi 1/90 and Sahih Ibn Majah 1/148.","sourceUrl":"https://sunnah.com/hisn:49"},{"id":"hisn-50","title":"ذكر من حصن المسلم (50)","category":"When prostrating due to recitation of the Quran","categoryEnglish":"دعاء سجود التلاوة","text":"سَجَـدَ وَجْهـي للَّـذي خَلَقَـهُ وَشَقَّ سَمْـعَـهُ وَبَصَـرَهُ بِحَـوْلِـهِ وَقُـوَّتِهِ ﴿فتَبـارَكَ اللهُ أَحْسَـنُ الخـالِقيـن﴾.","source":"At-Tirmidhi 2/474, Ahmad 6/30, and Al-Hakim","sourceUrl":"https://sunnah.com/hisn:50"},{"id":"hisn-51","title":"ذكر من حصن المسلم (51)","category":"When prostrating due to recitation of the Quran","categoryEnglish":"دعاء سجود التلاوة","text":"اللّهُـمَّ اكْتُـبْ لي بِهـا عِنْـدَكَ أَجْـراً ، وَضَـعْ عَنِّـي بِهـا وِزْراً ، وَاجْعَـلها لي عِنْـدَكَ ذُخْـراً ، وَتَقَبَّـلها مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.","source":"At-Tirmidhi 2/473, and Al-Hakim who graded it authentic and Ath-Thahabi agreed 1/219.","sourceUrl":"https://sunnah.com/hisn:51"},{"id":"hisn-52","title":"ذكر من حصن المسلم (52)","category":"The Tashahhud","categoryEnglish":"التشهد","text":"التَّحِيّـاتُ للهِ وَالصَّلَـواتُ والطَّيِّـبات ، السَّلامُ عَلَيـكَ أَيُّهـا النَّبِـيُّ وَرَحْمَـةُ اللهِ وَبَرَكـاتُه ، السَّلامُ عَلَيْـناوَعَلـى عِبـادِ للهِ الصَّـالِحـين . أَشْـهَدُ أَنْ لا إِلـهَ إِلاّ الله ، وَأَشْـهَدُ أَنَّ مُحَمّـداً عَبْـدُهُ وَرَسـولُه\nالصلاة على النبي ﷺ بعد التشهد","source":"Al-Bukhari, Muslim 1/301. See also Al-Asqalani, Fathul-Bal 1/13","sourceUrl":"https://sunnah.com/hisn:52"},{"id":"hisn-53","title":"ذكر من حصن المسلم (53)","category":"Prayers upon the Prophet ﷺ after the tashahhud","categoryEnglish":"الصلاة على النبي ﷺ بعد التشهد","text":"اللّهُـمَّ صَلِّ عَلـى مُحمَّـد، وَعَلـى آلِ مُحمَّد، كَمـا صَلَّيـتَ عَلـى إبْراهـيمَ وَعَلـى آلِ إبْراهـيم، إِنَّكَ حَمـيدٌ مَجـيد ، اللّهُـمَّ بارِكْ عَلـى مُحمَّـد، وَعَلـى آلِ مُحمَّـد، كَمـا بارِكْتَ عَلـى إبْراهـيمَ وَعَلـى آلِ إبْراهيم، إِنَّكَ حَمـيدٌ مَجـيد","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 6/408.","sourceUrl":"https://sunnah.com/hisn:53"},{"id":"hisn-54","title":"ذكر من حصن المسلم (54)","category":"Prayers upon the Prophet ﷺ after the tashahhud","categoryEnglish":"الصلاة على النبي ﷺ بعد التشهد","text":"اللّهُـمَّ صَلِّ عَلـى مُحمَّـدٍ وَعَلـى أَزْواجِـهِ وَذُرِّيَّـتِه، كَمـا صَلَّيْـتَ عَلـى آلِ إبْراهـيم . وَبارِكْ عَلـى مُحمَّـدٍ وَعَلـى أَزْواجِـهِ وَذُرِّيَّـتِه، كَمـا بارِكْتَ عَلـى آلِ إبْراهـيم . إِنَّكَ حَمـيدٌ مَجـيد\nالدعاء بعد التشهد الأخير وقبل السلام","source":"Al-Bukhari, from Al-Asqalani, Fathul-Bari 6/ 407, Muslim 1/306.","sourceUrl":"https://sunnah.com/hisn:54"},{"id":"hisn-55","title":"ذكر من حصن المسلم (55)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَعـوذُ بِكَ مِـنْ عَذابِ القَـبْر، وَمِـنْ عَذابِ جَهَـنَّم، وَمِـنْ فِتْـنَةِ المَحْـيا وَالمَمـات، وَمِـنْ شَـرِّ فِتْـنَةِ المَسيحِ الدَّجّال","source":"Al-Bukhari 2/102, Muslim 1/412, and this is Muslim's wording.","sourceUrl":"https://sunnah.com/hisn:55"},{"id":"hisn-56","title":"ذكر من حصن المسلم (56)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَعـوذُ بِكَ مِـنْ عَذابِ القَـبْر ، وَأَعـوذُ بِكَ مِـنْ فِتْـنَةِ المَسيحِ الدَّجّـال ، أَعـوذُ بِكَ مِـنْ فِتْـنَةِ المَحْـيا وَالمَمـات . اللّهُـمَّ إِنِّـي أَعـوذُ بِكَ مِنَ المَأْثَـمِ وَالمَغْـرَم","source":"Al-Bukhari 1/202, Muslim 1/412.","sourceUrl":"https://sunnah.com/hisn:56"},{"id":"hisn-57","title":"ذكر من حصن المسلم (57)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي ظَلَـمْتُ نَفْسـي ظُلْمـاً كَثـيراً وَلا يَغْـفِرُ الذُّنـوبَ إِلاّ أَنْت، فَاغْـفِر لي مَغْـفِرَةً مِنْ عِنْـدِك وَارْحَمْـني، إِنَّكَ أَنْتَ الغَـفورُ الرَّحـيم","source":"Al-Bukhari 8/168, Muslim 4/2078.","sourceUrl":"https://sunnah.com/hisn:57"},{"id":"hisn-58","title":"ذكر من حصن المسلم (58)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ اغْـفِرْ لي ما قَدَّمْـتُ وَما أَخَّرْت ، وَما أَسْـرَرْتُ وَما أَعْلَـنْت ، وَما أَسْـرَفْت ، وَما أَنْتَ أَعْـلَمُ بِهِ مِنِّي . أَنْتَ المُقَـدِّمُ، وَأَنْتَ المُـؤَخِّـرُ لا إِلهَ إِلاّ أَنْـت","source":"Muslim 1/534.","sourceUrl":"https://sunnah.com/hisn:58"},{"id":"hisn-59","title":"ذكر من حصن المسلم (59)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ أَعِـنِّي عَلـى ذِكْـرِكَ وَشُكْـرِك ، وَحُسْـنِ عِبـادَتِـك","source":"Abu Dawud 2/86, An-Nasa'i 3/53. See also Al-Albani Sahih Abu Dawud 1 /284.","sourceUrl":"https://sunnah.com/hisn:59"},{"id":"hisn-60","title":"ذكر من حصن المسلم (60)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَعوذُ بِكَ مِنَ البُخْـل، وَأَعوذُ بِكَ مِنَ الجُـبْن، وَأَعوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلى أَرْذَلِ الـعُمُر، وَأََعوذُ بِكَ مِنْ فِتْنَـةِ الدُّنْـيا وَعَـذابِ القَـبْر","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 6/35","sourceUrl":"https://sunnah.com/hisn:60"},{"id":"hisn-61","title":"ذكر من حصن المسلم (61)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَسْأَلُـكَ الجَـنَّةَ وأََعوذُ بِـكَ مِـنَ الـنّار","source":"Abu Dawud. See also Al-Albani, Sahih Ibn Majah 2/328.","sourceUrl":"https://sunnah.com/hisn:61"},{"id":"hisn-62","title":"ذكر من حصن المسلم (62)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ بِعِلْـمِكَ الغَـيْبِ وَقُـدْرَتِـكَ عَلـى الْخَلقِ أَحْـيِني ما عَلِـمْتَ الحـياةَ خَـيْراً لـي، وَتَوَفَّـني إِذا عَلِـمْتَ الوَفـاةَ خَـيْراً لـي، اللّهُـمَّ إِنِّـي أَسْـأَلُـكَ خَشْيَتَـكَ في الغَـيْبِ وَالشَّهـادَةِ، وَأَسْـأَلُـكَ كَلِمَـةَ الحَـقِّ في الرِّضـا وَالغَضَـب، وَأَسْـأَلُـكَ القَصْدَ في الغِنـى وَالفَقْـر، أَسْـأَلُـكَ نَعـيماً لا يَنْفَـد، وَأَسْـأَلُـكَ قُـرَّةَ عَيْـنٍ لا تَنْـقَطِعْ وَأَسْـأَلُـكَ الرِّضـا بَعْـدَ القَضـاء، وَأَسْـأَلُـكَ بًـرْدَ الْعَـيْشِ بَعْـدَ الْمَـوْت، وَأَسْـأَلُـكَ لَـذَّةَ النَّظَـرِ إِلـى وَجْـهِكَ وَالشَّـوْقَ إِلـى لِقـائِـك، في غَـيرِ ضَـرّاءَ مُضِـرَّة، وَلا فِتْـنَةٍ مُضـلَّة، اللّهُـمَّ زَيِّـنّا بِزينَـةِ الإيـمان، وَاجْـعَلنا هُـداةً مُهْـتَدين","source":"An-Nasa'i 3/54, 55, Ahmad 4/364. See also Al-Albani, Sahih An-Nasa'i 1/281.","sourceUrl":"https://sunnah.com/hisn:62"},{"id":"hisn-63","title":"ذكر من حصن المسلم (63)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَسْأَلُـكَ يا اللهُ بِأَنَّـكَ الواحِـدُ الأَحَـد الصَّـمَدُ الَّـذي لَـمْ يَلِـدْ وَلَمْ يولَدْ، وَلَمْ يَكـنْ لَهُ كُـفُواً أَحَـد ، أَنْ تَغْـفِرْ لي ذُنـوبي إِنَّـكَ أَنْـتَ الغَفـورُ الرَّحِّـيم","source":"An-Nasa'i 3/52, Ahmad 4/338. See also Al-Albani, Sahih An-Nasa'i 1/280 and Sifat Salatun-Nabi, pg. 204.","sourceUrl":"https://sunnah.com/hisn:63"},{"id":"hisn-64","title":"ذكر من حصن المسلم (64)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَسْأَلُـكَ بِأَنَّ لَكَ الْحَـمْدُ لا إِلـهَ إِلاّ أَنْـتَ وَحْـدَكَ لا شَـريكَ لَـكَ المَنّـانُ يا بَديـعَ السَّمواتِ وَالأَرْضِ يا ذا الجَلالِ وَالإِكْـرام يا حَـيُّ يا قَـيّومُ إِنِّـي أَسْأَلُـكَ الجَـنَّةَ وَأَعـوذُ بِـكَ مِنَ الـنّار","source":"Abu Dawud, An-Nasa'i, Ibn Majah, At-Tirmidhi. See also Al-Albani, Sahih Ibn Majah 2/329.","sourceUrl":"https://sunnah.com/hisn:64"},{"id":"hisn-65","title":"ذكر من حصن المسلم (65)","category":"After the last tashahhud and before salam","categoryEnglish":"الدعاء بعد التشهد الأخير وقبل السلام","text":"اللّهُـمَّ إِنِّـي أَسْأَلُـكَ بِأَنَّـي أَشْـهَدُ أَنَّـكَ أنْـتَ اللهُ لا إِلـهَ إِلاّ أَنْـت الأَحَـدُ الصَّـمَدُ الَّـذي لَـمْ يَلِـدْ وَلَمْ يولَـدْ وَلَمْ يَكـنْ لَهُ كُـفُواً أَحَـد\nالأذكار بعد السلام من الصلاة","source":"Abu Dawud 2/62, Ibn Majah 2/1267, At-Tirmidhi 5/515, Ahmad 5/360. See also Al-Albani, Sahih Ibn Majah 2/329 and Sahih At-Tirmidhi 3/163.","sourceUrl":"https://sunnah.com/hisn:65"},{"id":"hisn-66","title":"ذكر من حصن المسلم (66)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"أَسْـتَغْفِرُ الله (ثَلاثاً) اللّهُـمَّ أَنْـتَ السَّلامُ وَمِـنْكَ السَّلام تَبارَكْتَ يا ذا الجَـلالِ وَالإِكْـرام","source":"Muslim 1/414.","sourceUrl":"https://sunnah.com/hisn:66"},{"id":"hisn-67","title":"ذكر من حصن المسلم (67)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"لا إلهَ إلاّ اللّهُ وحدَهُ لا شريكَ لهُ لهُ المُـلْكُ ولهُ الحَمْد وهوَ على كلّ شَيءٍ قَدير اللّهُـمَّ لا مانِعَ لِما أَعْطَـيْت وَلا مُعْطِـيَ لِما مَنَـعْت وَلا يَنْفَـعُ ذا الجَـدِّ مِنْـكَ الجَـد","source":"Al-Bukhari 1/255, Muslim 1/414.","sourceUrl":"https://sunnah.com/hisn:67"},{"id":"hisn-68","title":"ذكر من حصن المسلم (68)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"لا إلهَ إلاّ اللّه وحدَهُ لا شريكَ لهُ لهُ الملكُ ولهُ الحَمد وهوَ على كلّ شيءٍ قدير لا حَـوْلَ وَلا قـوَّةَ إِلاّ بِاللهِ لا إلهَ إلاّ اللّـه وَلا نَعْـبُـدُ إِلاّ إيّـاه لَهُ النِّعْـمَةُ وَلَهُ الفَضْل وَلَهُ الثَّـناءُ الحَـسَن لا إلهَ إلاّ اللّهُ مخْلِصـينَ لَـهُ الدِّينَ وَلَوْ كَـرِهَ الكـافِرون","source":"Muslim 1/415.","sourceUrl":"https://sunnah.com/hisn:68"},{"id":"hisn-69","title":"ذكر من حصن المسلم (69)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"سُـبْحانَ اللهِ والحَمْـدُ لله واللهُ أكْـبَر (ثلاثاً وثلاثين) لا إلهَ إلاّ اللّهُ وَحْـدَهُ لا شريكَ لهُ لهُ الملكُ ولهُ الحَمْد وهُوَ على كُلّ شَيءٍ قَـدير","source":"Muslim 1/418, Whoever says this after every prayer will be forgiven his sins even though they be as the foam of the sea.","sourceUrl":"https://sunnah.com/hisn:69"},{"id":"hisn-70","title":"ذكر من حصن المسلم (70)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ هُوَ اللَّهُ أَحَدٌ\\* اللَّهُ الصَّمَدُ\\* لَمْ يَلِدْ وَلَمْ يُولَدْ\\* وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ} بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ\\* مِن شَرِّ مَا خَلَقَ\\* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ\\* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ\\* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ} بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ النَّاسِ\\* مَلِكِ النَّاسِ\\* إِلَهِ النَّاسِ\\* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ\\* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ\\* مِنَ الْجِنَّةِ وَالنَّاسِ} بَعْدَ كُلِّ صَلاَةٍ.","source":"Abu Dawud 2/86, An-Nasa'i 3/68. See also Al-Albani, Sahih At-Tirmidhi 2/8.","sourceUrl":"https://sunnah.com/hisn:70"},{"id":"hisn-71","title":"ذكر من حصن المسلم (71)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"﴿اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾ عقب كل صلاة","source":"An-Nasa'i, 'Amalul-Yawm wal-Laylah (Hadith no. 100), also Ibn As-Sunni (no. 121). See also Al-Albani, Sahihul-Jami' As-Saghir 5/339 and Silsilatul-Ahadith As-Sahihah 2/697 (no. 972).","sourceUrl":"https://sunnah.com/hisn:71"},{"id":"hisn-72","title":"ذكر من حصن المسلم (72)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ (عَشْرَ مَرّاتٍ بَعْدَ صَلاةِ الْمَغْرِبِ وَالصُّبْحِ)","source":"At-Tirmidhi 5/515, Ahmad 4/227. See its checking in Ibn Al-Qayyim Al-Jawziyyah's Zddul-Ma'ad 1/300.","sourceUrl":"https://sunnah.com/hisn:72"},{"id":"hisn-73","title":"ذكر من حصن المسلم (73)","category":"After salam","categoryEnglish":"الأذكار بعد السلام من الصلاة","text":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نافِعاً وَرِزْقاً طَيِّباً وَعَمَلاً مُتَقَبَّلاً (بَعْدَ السّلامِ مِنْ صَلاَةِ الفَجْرِ)","source":"Ibn Majah and others. See Sahih Ibn Majah 1/152 and Majma' Az-Zawa'id 10/111","sourceUrl":"https://sunnah.com/hisn:73"},{"id":"hisn-74","title":"ذكر من حصن المسلم (74)","category":"For seeking guidance in forming a decision or choosing the proper course","categoryEnglish":"دعاء صلاة الاستخارة","text":"قال جابر بن عبد الله رضي الله عنهما : كان رسول الله صلى الله عليه وسلم ، يُعلمنا الاستخارة في الأمور كلها كما يعلمُنا السورة من القرآن ، يقول : إذا هم أحدكم بالأمر فليركع ركعتين من غير الفريضة ، ثم ليقل: \"اللهم إني أستخيرك بعلمك ، وأستقدرك بقدرتك ، وأسألك من فضلك العظيم فإنك تقدِرُ ولا أقدِرُ ، وتعلم ولا أعلم ، وأنت علام الغيوب ، اللهم إن كنت تعلم أن هذا الأمر - يسمي حاجته - خير لي في ديني ومعاشي وعاقبة أمري - أو قال : عاجله وآجله - فاقدره لي ويسره لي ، ثم بارك لي فيه ، وإن كنت تعلم أن هذا الأمر شر لي في ديني ومعاشي وعاقبة أمري - أو قال : عاجله وآجله - فاصرفه عني واصرفني عنه ، واقدر لي الخير حيث كان ، ثم ارضني به \"\nوما ندم من استخار الخالق، وشاور المخلوقين المؤمنين وتثبَّت في أمره، فقد قال سبحانه ﴿وَشـاوِرْهُـم في الأمْـرِ فَـإِذا عَـزَمْـتَ فَتَوَكّـلْ عَلـى الله﴾\nالْحَمْدُ لِلَّهِ وَحْدَهُ، وَالصَّلاَةُ وَالسَّلاَمُ عَلَى مَنْ لاَ نَبِيَّ بَعْدَهُ","source":"Al-Bukhari 7/162. and Aal-'Imran 3:159.","sourceUrl":"https://sunnah.com/hisn:74"},{"id":"hisn-75","title":"ذكر من حصن المسلم (75)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"(أعوذ بالله من الشيطان الرجيم) ﴿اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾","source":"Whoever says this when he rises in the morning will be protected from jinns until he retires in the evening, and whoever says it when retiring in the evening will be protected from them until he rises in the morning. It was reported by Al-Hakim 1 / 562, Al-Albani graded it as authentic in Sahihut-Targhib wat-Tarhib 1/273, and traces it to An-Nasa'i and At-Tabarani. He says that At-Tabarani's chain of transmission is reliable (Jayyid).","sourceUrl":"https://sunnah.com/hisn:75"},{"id":"hisn-76","title":"ذكر من حصن المسلم (76)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"بسم الله الرحمن الرحيم { قُلْ هُوَ اللَّهُ أَحَدٌ \\* اللَّهُ الصَّمَدُ \\* لَمْ يَلِدْ وَلَمْ يُولَدْ \\* لَمْ يَكُن لَّهُ كُفُواً أَحَدٌ } بسم الله الرحمن الرحيم { قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ \\* مِن شَرِّ مَا خَلَقَ \\* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ \\* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ \\* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ } بسم الله الرحمن الرحيم { قُلْ أَعُوذُ بِرَبِّ النَّاسِ \\* مَلِكِ النَّاسِ \\* إِلَهِ النَّاسِ \\* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ \\* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ \\* مِنَ الْجِنَّةِ وَالنَّاسِ } (ثلاث مرات)","source":"Al-Ikhlas 112:1-4, Al-Falaq 113:1-5, An-Nas 114:1-6. Whoever recites these three times in the morning and in the evening, they will suffice him (as a protection) against everything. The Hadith was reported by Abu Dawud 4/322, and At-Tirmidhi 5/567. See Al-Albani's Sahih At-Tirmidhi 3/182.","sourceUrl":"https://sunnah.com/hisn:76"},{"id":"hisn-77","title":"ذكر من حصن المسلم (77)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي القَـبْر.","source":"1 When you say this in the evening you should say Amsaynā wa amsal-mulku lillāh: \"We have ended another day and with it, all dominion is Allah's. 2 When you say this in the evening you should say: Rabbi as'aluka khayra mā fī hāthihil-laylati, wa khayra mā ba`dahā, wa a`ūthu bika min sharri mā fī hāthihil-laylati wa sharri mā ba`dahā: \"I ask You for the good things of this night and of the nights that come after it and I seek refuge in You from the evil of this night and of the nights that come after it.\" 3 Muslim 4/2088.","sourceUrl":"https://sunnah.com/hisn:77"},{"id":"hisn-78","title":"ذكر من حصن المسلم (78)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهُـمَّ بِكَ أَصْـبَحْنا وَبِكَ أَمْسَـينا وَبِكَ نَحْـيا وَبِكَ نَمـوتُ وَإِلَـيْكَ النِّـشور\nوإذا أمسي فليقل : اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير","source":"Sahih At-Tirmidhi 3/142.'","sourceUrl":"https://sunnah.com/hisn:78"},{"id":"hisn-79","title":"ذكر من حصن المسلم (79)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهـمَّ أَنْتَ رَبِّـي لا إلهَ إلاّ أَنْتَ خَلَقْتَنـي وَأَنا عَبْـدُك وَأَنا عَلـى عَهْـدِكَ وَوَعْـدِكَ ما اسْتَـطَعْـت أَعـوذُ بِكَ مِنْ شَـرِّ ما صَنَـعْت أَبـوءُ لَـكَ بِنِعْـمَتِـكَ عَلَـيَّ وَأَبـوءُ بِذَنْـبي فَاغْفـِرْ لي فَإِنَّـهُ لا يَغْـفِرُ الذُّنـوبَ إِلاّ أَنْتَ","source":"Whoever recites this with conviction in the evening and dies during that night shall enter Paradise, and whoever recites it with conviction in the morning and dies during that day shall enter Paradise, Al-Bukhari 7/150. Other reports are in An-Nasa'i and At-Tirmidhi.","sourceUrl":"https://sunnah.com/hisn:79"},{"id":"hisn-80","title":"ذكر من حصن المسلم (80)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهُـمَّ إِنِّـي أَصْبَـحْتُ أَُشْـهِدُك ، وَأُشْـهِدُ حَمَلَـةَ عَـرْشِـك ، وَمَلائِكَتِك ، وَجَمـيعَ خَلْـقِك ، أَنَّـكَ أَنْـتَ اللهُ لا إلهَ إلاّ أَنْـتَ وَحْـدَكَ لا شَريكَ لَـك ، وَأَنَّ ُ مُحَمّـداً عَبْـدُكَ وَرَسـولُـك . (أربع مرات حينَ يصْبِح أوْ يمسي)","source":"1 When you say this in the evening you should say, Allāhumma innī amsaytu. . . .: \"O Allah, I have ended another day...\" 2 \"Allah will spare whoever says this four times in the morning or evening from the fire of Hell.\" Abu Dawud 4/317. It was also reported by Al-Bukhari in Al-'Adab Al-Mufrad, An-Nasa'i in 'Amalul-Yawm wal-Laylah and Ibn As-Sunni. Nasa'i's and Abu Dawud's chains of transmission are good (Hasan), Ibn Baz, p. 23.","sourceUrl":"https://sunnah.com/hisn:80"},{"id":"hisn-81","title":"ذكر من حصن المسلم (81)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهُـمَّ ما أَصْبَـَحَ بي مِـنْ نِعْـمَةٍ أَو بِأَحَـدٍ مِـنْ خَلْـقِك ، فَمِـنْكَ وَحْـدَكَ لا شريكَ لَـك ، فَلَـكَ الْحَمْـدُ وَلَـكَ الشُّكْـر","source":"1 When you say this in the evening, you should say: Allāhumma mā 'amsā bī...: \"O Allah, as I... enter this evening...\" 2 Whoever recites this in the morning, has completed his obligation to thank Allah for that day; and whoever says it in the evening, has completed his obligation for that night. Abu Dawud 4/318, An-Nasa'i 'Amalul-Yawm wal-Laylah (no. 7), Ibn As-Sunni (no. 41), Ibn Hibban (no. 2361). Its chain of transmission is good (Hasan), Ibn Baz, p. 24.","sourceUrl":"https://sunnah.com/hisn:81"},{"id":"hisn-82","title":"ذكر من حصن المسلم (82)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهُـمَّ عافِـني في بَدَنـي، اللّهُـمَّ عافِـني في سَمْـعي، اللّهُـمَّ عافِـني في بَصَـري، لا إلهَ إلاّ اللّه أَنْـتَ. اللّهُـمَّ إِنّـي أَعـوذُبِكَ مِنَ الْكُـفر، وَالفَـقْر، وَأَعـوذُ بِكَ مِنْ عَذابِ القَـبْر، لا إلهَ إلاّ أَنْـتَ. (ثلاث مرات)","source":"Abu Dawud 4/324, Ahmad 5/42, An-Nasa'i, 'Amalul-Yawm wal-Laylah (no. 22), Ibn As-Sunni (no. 69), Al-Bukhari Al-'Adab Al-Mufrad. Its chain of transmission is good (Hasan), Ibn Baz, p. 26.","sourceUrl":"https://sunnah.com/hisn:82"},{"id":"hisn-83","title":"ذكر من حصن المسلم (83)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"حَسْبِـيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَـيهِ تَوَكَّـلتُ وَهُوَ رَبُّ العَرْشِ العَظـيم.","source":"Allah will grant whoever recites this seven times in the morning or evening whatever he desires from this world or the next, Ibn As-Sunni (no. 71), Abu Dawud 4/321. Both reports are attributed directly to the Prophet j§ (Marfu1). The chain of transmission is sound (Sahih). Ibn As-Sunni.","sourceUrl":"https://sunnah.com/hisn:83"},{"id":"hisn-84","title":"ذكر من حصن المسلم (84)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في الدُّنْـيا وَالآخِـرَة ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في ديني وَدُنْـيايَ وَأهْـلي وَمالـي ، اللّهُـمَّ اسْتُـرْ عـوْراتي وَآمِـنْ رَوْعاتـي ، اللّهُـمَّ احْفَظْـني مِن بَـينِ يَدَيَّ وَمِن خَلْفـي وَعَن يَمـيني وَعَن شِمـالي ، وَمِن فَوْقـي ، وَأَعـوذُ بِعَظَمَـتِكَ أَن أُغْـتالَ مِن تَحْتـي","source":"Sahih Ibn Majah 2/332 and Abu Dawud.","sourceUrl":"https://sunnah.com/hisn:84"},{"id":"hisn-85","title":"ذكر من حصن المسلم (85)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كـلِّ شَـيءٍ وَمَليـكَه ، أَشْهَـدُ أَنْ لا إِلـهَ إِلاّ أَنْت ، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي وَمِن شَـرِّ الشَّيْـطانِ وَشِـرْكِه ، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم","source":"Sahih At-Tirmidhi 3/142 and AbuDawud.","sourceUrl":"https://sunnah.com/hisn:85"},{"id":"hisn-86","title":"ذكر من حصن المسلم (86)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ شَيءٌ في الأرْضِ وَلا في السّمـاءِ وَهـوَ السّمـيعُ العَلـيم .","source":"\"Whoever recites it three times in the morning will not be afflicted by any calamity before evening, and whoever recites it three times in the evening will not be overtaken by any calamity before morning.\" Abu Dawud 4/323, At-Tirmidhi 5/465, Ibn Majah 2/332, Ahmad. Ibn Majah's chain of transmission is good (Hasan), Ibn Baz, p. 39.","sourceUrl":"https://sunnah.com/hisn:86"},{"id":"hisn-87","title":"ذكر من حصن المسلم (87)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"رَضيـتُ بِاللهِ رَبَّـاً وَبِالإسْلامِ ديـناً وَبِمُحَـمَّدٍ نَبِيّـاً .","source":"\"Allah has promised that anyone who says this three times every morning or evening will be pleased on the Day of Resurrection.\" Ahmad 4/ 337, An-Nasa'i, 'Amalul-Yawm wal-Laylah p. 4, Ibn As-Sunni (no. 68), At-Tirmidhi 5/465. Its chain of transmission is good (Hasan), Ibn Baz, p. 39.","sourceUrl":"https://sunnah.com/hisn:87"},{"id":"hisn-88","title":"ذكر من حصن المسلم (88)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"يا حَـيُّ يا قَيّـومُ بِـرَحْمَـتِكِ أَسْتَـغـيث ، أَصْلِـحْ لي شَـأْنـي كُلَّـه ، وَلا تَكِلـني إِلى نَفْـسي طَـرْفَةَ عَـين","source":"Its chain of transmission is sound (Sahih), Al-Hakim 1/545, see Albani, Sahihut-Targhib wat-Tarhib, 1/273.","sourceUrl":"https://sunnah.com/hisn:88"},{"id":"hisn-89","title":"ذكر من حصن المسلم (89)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"أَصْبَـحْـنا وَأَصْبَـحْ المُـلكُ للهِ رَبِّ العـالَمـين ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ خَـيْرَ هـذا الـيَوْم ، فَـتْحَهُ ، وَنَصْـرَهُ ، وَنـورَهُ وَبَـرَكَتَـهُ ، وَهُـداهُ ، وَأَعـوذُ بِـكَ مِـنْ شَـرِّ ما فـيهِ وَشَـرِّ ما بَعْـدَه\nوإذا أمسى قال: أَمْسَيْـنا وَأَمْسـى المُـلكُ للهِ رَبِّ العـالَمـين ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ خَـيْرَ هـذهِ اللَّـيْلَة ، فَتْحَهـا ، وَنَصْـرَهـا ، وَنـورَهـا وَبَـرَكَتَـهـا ، وَهُـداهـا ، وَأَعـوذُ بِـكَ مِـنْ شَـرِّ ما فـيهـاِ وَشَـرِّ ما بَعْـدَهـا","source":"1 For evening recitation, say here: Allāhumma innī as'aluka khayra hāthihil-laylah: \"My Lord, I ask You for the good things of this night.\" 2 Abu Dawud 4/322. Its transmission chain is good (Hasan). See also Ibn Al-Qayyim, Zadul- Ma'ad 2/273.","sourceUrl":"https://sunnah.com/hisn:89"},{"id":"hisn-90","title":"ذكر من حصن المسلم (90)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"أَصْـبَحْنا[أَمْسَـينا] علـى فِطْـرَةِ الإسْلام،\nوَعَلـى كَلِـمَةِ الإخْـلاص، وَعلـى دينِ نَبِـيِّنا مُحَـمَّدٍ وَعَلـى مِلَّـةِ أبينـا إِبْـراهيـمَ حَنيـفاً مُسْلِـماً وَمـا كـانَ مِنَ المُشـرِكيـن","source":"1 When you say this in the evening, you should say: 'Amsaynā `alā fiṭratil-Islām...: \"We end this day...\" 2 Ahmad 3/406-7, 5/123, An-Nasa'i, 'Amalul- Yawm wal-Laylah (no. 34), At-Tirmidhi 4/209.","sourceUrl":"https://sunnah.com/hisn:90"},{"id":"hisn-91","title":"ذكر من حصن المسلم (91)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"سُبْحـانَ اللهِ وَبِحَمْـدِهِ . (مائة مرة)","source":"\"Whoever recites this one hundred times in the morning and in the evening will not be surpassed on the Day of Resurrection by anyone having done better than this except for someone who had recited it more. \" Al-Bukhari 4/2071.","sourceUrl":"https://sunnah.com/hisn:91"},{"id":"hisn-92","title":"ذكر من حصن المسلم (92)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"لا إلهَ إلاّ اللّهُ وحْـدَهُ لا شَـريكَ لهُ، لهُ المُـلْكُ ولهُ الحَمْـد، وهُوَ على كُلّ شَيءٍ قَدير . (عشر مرات أَوْ مرَّةً واحدةً عندَ الكَسَلِ)","source":"1Allah will write ten Hasanaat (rewards) for whoever recites this ten times in the morning, and forgive him ten misdeeds and give him the reward of freeing ten slaves and protect him from Satan. Whoever recites this ten times in the evening will get this same reward. An-Nasa'i, 'Amalul-Yawm wal-Laylah (no. 24). Its chain of transmission is sound (Sahih). Albani 1/272. Abu Hurayrah «fe narrated that the Prophet j§ said: \"Allah will write one hundred Hasanat for whoever says There is no God but Allah alone, He has no partner. To Allah is possession of everything, and to Him all praise is. He is Capable of all things' ten times in the morning, and forgive him one hundred misdeeds. He will have the reward of freeing a slave and will be protected from Satan throughout the day unto dusk. Whoever says it in the evening will have the same reward.\" Ahmad 8/704, 16/293. Its chain of transmission is good (Hasan), Ibn Baz, p. 44. 2 Whoever recites this in the morning, will have the reward of freeing a slave from the Children of Isma'il. Ten Hasanaat (rewards) will be written for him, and he will be forgiven ten misdeeds, raised up ten degrees, and be protected from Satan until evening. Whoever says it in the evening will have the same reward until morning. Abu Dawud 4/319, 3/957, Ahmad 4/ 60, Ibn Majah 2/331, Ibn Al-Qayyim Zadul-Ma'ad 2/388. Its chain of transmission is sound (Sahih). Al-Albani 1/270.","sourceUrl":"https://sunnah.com/hisn:92"},{"id":"hisn-93","title":"ذكر من حصن المسلم (93)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"لا إلهَ إلاّ اللّهُ وحْـدَهُ لا شَـريكَ لهُ، لهُ المُـلْكُ ولهُ الحَمْـد، وهُوَ على كُلّ شَيءٍ قَدير . (مائة مرة إذا أصبح)","source":"Whoever recites this one hundred times a day will have the reward of freeing ten slaves. One hundred Hasanaat (rewards) will be written for him and one hundred misdeeds will be washed away. He will be shielded from Satan until the evening. No one will be able to present anything better than this except for someone who has recited more than this. Al-Bukhari 4/95, Muslim 4/2071.","sourceUrl":"https://sunnah.com/hisn:93"},{"id":"hisn-94","title":"ذكر من حصن المسلم (94)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"سُبْحـانَ اللهِ وَبِحَمْـدِهِ عَدَدَ خَلْـقِه ، وَرِضـا نَفْسِـه ، وَزِنَـةَ عَـرْشِـه ، وَمِـدادَ كَلِمـاتِـه . (ثلاث مرات إذا أصبح)","source":"Muslim 4/2090.","sourceUrl":"https://sunnah.com/hisn:94"},{"id":"hisn-95","title":"ذكر من حصن المسلم (95)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً، وَرِزْقاً طَيِّباً، وَعَمَلاً مُتَقَبَّلاً (إذا أصبحَ)","source":"Ibn As-Sunni, no. 54, Ibn Majah no. 925. Its chain of transmission is good (Hasan), Ibn Al-Qayyim 2/375.","sourceUrl":"https://sunnah.com/hisn:95"},{"id":"hisn-96","title":"ذكر من حصن المسلم (96)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ (مِائَةَ مَرَّةٍ فِي الْيَوْمِ)","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 11/101, Muslim 4/2075.","sourceUrl":"https://sunnah.com/hisn:96"},{"id":"hisn-97","title":"ذكر من حصن المسلم (97)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِنْ شَـرِّ ما خَلَـق (ثلاث مرات إِذا أمسى)","source":"Whoever recites this three times in the evening will be protected from insect stings, Ahmad 2/ 290, An-Nasa'i, 'Amalul-Yawm wal-Laylah no. 590, At-Tirmidhi 3/187, Ibn As-Sunni no. 68. According to Al-Albani, Ibn Majah's (2/266) chain of transmission is sound (Sahih), and following Ibn Baz 45, At-Tirmidhi's report is good (Hasan).","sourceUrl":"https://sunnah.com/hisn:97"},{"id":"hisn-98","title":"ذكر من حصن المسلم (98)","category":"In the morning and evening","categoryEnglish":"أذكار الصباح والمساء","text":"اللَّهُمَّ صَلِّ وَ سَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ (عشر مرات)","source":"The Prophet (ﷺ) said: \"Who recites blessings upon me ten times in the morning and ten times in the evening will obtain my intercession on the Day of Resurrection.\" At-Tabarani reported this Hadith together with two chains of transmission. One of them is reliable (Jayyid). See Haythami's Majma'uz-Zawa'id 10/120, and Al-Albani's Sahihut-Targhib wat-Tarhib 1/273.","sourceUrl":"https://sunnah.com/hisn:98"},{"id":"hisn-99","title":"ذكر من حصن المسلم (99)","category":"Before sleeping","categoryEnglish":"أذكار النوم","text":"يَجْمَعُ كَفَّيْهِ ثُمَّ يَنْفُثُ فِيهِمَا فَيَقْرَأُ فِيهِمَا: بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ هُوَ اللَّهُ أَحَدٌ \\* اللَّهُ الصَّمَدُ\\* لَمْ يَلِدْ وَلَمْ يُولَدْ\\* وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ}. بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ\\* مِن شَرِّ مَا خَلَقَ\\* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ\\* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ\\* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ}. بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ النَّاسِ\\* مَلِكِ النَّاسِ\\* إِلَهِ النَّاسِ\\* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ\\* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ\\* مِنَ الْجِنَّةِ وَالنَّاسِ} ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ وَمَا أَقبَلَ مِنْ جَسَدِهِ (يفعلُ ذلك ثلاثَ مرَّاتٍ)","source":"Al-Ikhlas 112:1-4. Bismillāhir-Raḥmānir-Raḥīm. Qul a`ūdhu birabbil-falaq. Min sharri mā khalaq. Wa min sharri ghāsiqin idhā waqab. Wa min sharrin-naffāthāti fil-`uqad. Wa min sharri ḥāsidin idhā ḥasad. Reference: Al-Falaq 113:1-5. Bismillāhir-Raḥmānir-Raḥīm. Qul a`ūdhu birabbin-nās. Malikin-nās. 'Ilāhin-nās. Min sharri ‘l-waswāsil-khannās. Alladhī yuwaswisu fī ṣudūrin-nās. Minal-jinnati wannās. Reference: An-Nas 114:1-6 Hold the palms together, blow (with a little spittle) into them, and recite: \"With the Name of Allah, the Most Gracious, the Most Merciful. Say: He is Allah (the) One. The Self-Sufficient Master, Whom all creatures need, He begets not nor was He begotten, and there is none equal to Him. With the Name of Allah, the Most Gracious, the Most Merciful. Say: I seek refuge with (Allah) the Lord of the daybreak, from the evil of what He has created, and from the evil of the darkening (night) as it comes with its darkness, and from the evil of those who practice witchcraft when they blow in the knots, and from the evil of the envier when he envies. With the Name of Allah, the Most Gracious, the Most Merciful. Say: I seek refuge with (Allah) the Lord of mankind, the King of mankind, the God of mankind, from the evil of the whisperer who withdraws, who whispers in the breasts of mankind, of jinns and men.\" (Then pass your hands over as much of your body as you can reach, beginning with the head and the face, then the entire front of your body. Do this three times.) Reference: Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 9/62, and Muslim 4/ 1723.","sourceUrl":"https://sunnah.com/hisn:99"},{"id":"hisn-100","title":"ذكر من حصن المسلم (100)","category":"Before sleeping","categoryEnglish":"أذكار النوم","text":"((اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ))","source":"Al-Baqarah 2:255. Whoever reads this when he lies down to sleep will have a guardian from Allah remain with him and Satan will not be able to come near him until he rises in the morning. See Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 4/487.","sourceUrl":"https://sunnah.com/hisn:100"},{"id":"hisn-101","title":"ذكر من حصن المسلم (101)","category":"Before sleeping","categoryEnglish":"أذكار النوم","text":"((ءامَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ ءامَنَ بِاللهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُواْ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ {285} لاَ يُكَلِّفُ اللهُ نَفْسًا إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَآ أَنتَ مَوْلاَنَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ {286}))","source":"Al-Baqarah 2:285-6. These two Verses will be sufficient for anyone who recites them at night before sleeping. Al-Bukhari, cf. Al-Asqalani, Fathul-Bari.9/94, Muslim 1/554.","sourceUrl":"https://sunnah.com/hisn:101"},{"id":"hisn-102","title":"ذكر من حصن المسلم (102)","category":"Before sleeping","categoryEnglish":"أذكار النوم","text":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِن أَمْسَكْتَ نَفْسِي فارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ","source":"1 \"If any of you rises from his bed and later returns to it, let him dust off his bed with his waist garment three times and mention the Name of Allah, for he does not know what may have entered the bed after him, and when he lies down he should say. . . \". 2 Al-Bukhari 1 1/ 126 and Muslim 4/2084.","sourceUrl":"https://sunnah.com/hisn:102"}];</script>
  <script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modal-root');
  const toastNode = document.getElementById('toast');
  const ADHKAR = window.WARDI_ADHKAR || { morning: [], evening: [] };
  const EXTRA = window.WARDI_EXTRA_ADHKAR || [];
  const DUAS = window.WARDI_DUAS || [];
  const SHORT_SURAHS = window.WARDI_SHORT_SURAHS || [];
  const PREF_KEY = 'wardi:v2:prefs';
  const SUPPORT_PROMPT_PREFIX = 'wardi:v2:support-prompt';
  const SUPPORT_CHANNELS = {
    jannah: { title: 'الإبداع والتفكير', detail: 'قناة جنة غايتنا', url: 'https://t.me/MAR_IAMquran' },
    omar: { title: 'عمر', detail: 'التطوير والإنشاء', url: 'https://t.me/L_Omar_1' }
  };
  const PREF_DEFAULTS = { city: 'Cairo', country: 'Egypt', dark: false, fontScale: 1, readerMode: false };
  const state = {
    user: null, home: null, page: 'home', loading: true, bootError: '',
    taskKind: null, readerPage: 1, readerFromTask: false, quranData: null,
    quranLoading: false, quranError: '', libraryQuery: '', extraCategory: 'sleep',
    groupSearch: null, prayer: null, prayerError: '', prayerLoading: false,
    recording: false, audioUrl: '', mediaRecorder: null, mediaStream: null,
    modalAction: null, toastTimer: 0, searchTimer: 0, busy: false,
    supportPromptUid: '', supportClicks: { jannah: false, omar: false }
  };
  let prefs = loadPrefs();
  const KIND_LABELS = { morning: 'أذكار الصباح', quran: 'ورد القرآن', memorize: 'الحفظ', evening: 'أذكار المساء' };
  const GUIDANCE = {
    'account-type': ['اختار شكل وردك', 'الفردي مستقل، والمزدوج يجمع ورد شخصين، والمجموعة تجمع ورد الأعضاء المؤهلين. الاسم للعرض فقط، وحسابك المجهول مرتبط بهذا المتصفح.'],
    'pair-type': ['نوع المزدوج', 'العادي يمكن لأي طرف إنهاؤه. الإسلامي لا ينتهي إلا بعد موافقة الطرفين على طلب الخروج.'],
    pairing: ['ربط حسابين', 'يختار الطرفان «مزدوج» والنوع نفسه، ثم يتبادل كل منهما كود الربط. لا تشارك الكود إلا مع الشخص المقصود.'],
    'islamic-pair': ['رفقًا بالصحبة', 'هذا ارتباط إسلامي. إذا أراد أحدكما الخروج، يصل للطرف الآخر طلب للموافقة؛ يظل الارتباط قائمًا حتى يوافق الطرفان.'],
    groups: ['المجموعات', 'تبدأ أهلية العضوية الجديدة غدًا. المجموعة التي يقل أعضاؤها عن ثلاثة تظل قابلة للاستخدام، لكن لا يبدأ لها Streak جماعي.'],
    'group-create': ['إنشاء مجموعة', 'اختر Username فريدًا وسعة من ٣ إلى ٢٠٠. تأكد من اتفاق الأعضاء على الاسم قبل مشاركة دعوة المجموعة.'],
    'group-join': ['الانضمام لمجموعة', 'تأكد من الـUsername قبل الانضمام. تبدأ أهليتك للـStreak الجماعي في اليوم التالي، ويبدأ ورد القرآن من الصفحة الأولى.'],
    morning: ['أذكار الصباح', 'اضغط عدّاد كل ذكر بعد قوله. لا يكتمل الورد حتى تستوفي الأعداد المطلوبة في كل ذكر.'],
    quran: ['ورد القرآن', 'اقرأ صفحات اليوم بالترتيب. يحفظ التطبيق تقدم الورد، ولا يزيد ذلك Streak مباشرة؛ التقييم يكون عند منتصف الليل.'],
    memorize: ['الحفظ', 'سورة اليوم ثابتة لثلاثة أيام متتابعة. أكمل ثلاث تلاوات، والتسجيل الصوتي اختياري ولا يُرفع إلى الخادم.'],
    evening: ['أذكار المساء', 'اضغط عدّاد كل ذكر بعد قوله. لا يكتمل الورد حتى تستوفي الأعداد المطلوبة في كل ذكر.'],
    streak: ['كيف يُحسب الثبات؟', 'يُقيّم الخادم اليوم بتوقيت القاهرة بعد منتصف الليل. لا يزيد العداد إلا إذا أكمل جميع الأعضاء المؤهلين المهام الأربع؛ للمجموعة حد أدنى ثلاثة أعضاء، ولا تُستهلك فرصة إنقاذ وهي أصغر من ذلك.']
  };

  function loadPrefs() {
    try { return { ...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem(PREF_KEY) || '{}') }; }
    catch { return { ...PREF_DEFAULTS }; }
  }
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch { /* التخزين المحلي اختياري */ }
    applyPrefs();
  }
  function applyPrefs() {
    document.documentElement.classList.toggle('dark-mode', Boolean(prefs.dark));
    document.documentElement.classList.toggle('reader-mode', Boolean(prefs.readerMode));
    document.documentElement.style.setProperty('--font-scale', String(Math.min(1.35, Math.max(.9, Number(prefs.fontScale) || 1))));
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
  function safeUrl(value) {
    try { const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : ''; } catch { return ''; }
  }
  async function api(path, options = {}) {
    const response = await fetch(path, {
      method: options.method || 'GET', credentials: 'same-origin', cache: 'no-store',
      headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(data.message || 'تعذر الاتصال بالخادم. تحقق من الاتصال ثم حاول مرة أخرى.');
      error.code = data.code; error.status = response.status; throw error;
    }
    return data;
  }
  function notify(message, type = 'info') {
    toastNode.textContent = message;
    toastNode.className = `toast show${type === 'error' ? ' error' : ''}`;
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { toastNode.className = 'toast'; }, 3400);
  }
  function showModal(title, body, actions = [{ label: 'إغلاق', action: 'modal-close', secondary: true }]) {
    state.modalAction = null;
    modalRoot.innerHTML = `<div class="modal-backdrop" data-action="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${escapeHtml(title)}</h2><p>${body}</p><div class="modal-actions">${actions.map(a => `<button type="button" class="btn ${a.secondary ? 'btn-secondary' : ''} ${a.danger ? 'btn-danger' : ''}" data-action="${escapeHtml(a.action)}">${escapeHtml(a.label)}</button>`).join('')}</div></section></div>`;
    modalRoot.querySelector('.modal')?.focus();
  }
  function closeModal() { modalRoot.innerHTML = ''; state.modalAction = null; }
  function supportKey(kind, uid) { return `${SUPPORT_PROMPT_PREFIX}:${kind}:${uid}`; }
  function supportPromptDone(uid) {
    try { return localStorage.getItem(supportKey('done', uid)) === '1'; }
    catch { return false; }
  }
  function readSupportClicks(uid) {
    try {
      const saved = JSON.parse(localStorage.getItem(supportKey('clicks', uid)) || '{}');
      return { jannah: Boolean(saved.jannah), omar: Boolean(saved.omar) };
    } catch { return { jannah: false, omar: false }; }
  }
  function updateSupportPromptControls() {
    const jannahStatus = modalRoot.querySelector('[data-support-status="jannah"]');
    const omarStatus = modalRoot.querySelector('[data-support-status="omar"]');
    if (jannahStatus) jannahStatus.textContent = state.supportClicks.jannah ? 'تم فتح الرابط' : 'افتح القناة';
    if (omarStatus) omarStatus.textContent = state.supportClicks.omar ? 'تم فتح الرابط' : 'افتح القناة';
    const button = modalRoot.querySelector('[data-action="support-dismiss"]');
    const bothOpened = state.supportClicks.jannah && state.supportClicks.omar;
    if (button) {
      button.disabled = !bothOpened;
      button.textContent = bothOpened ? 'تم فتح القناتين — متابعة' : 'افتح الرابطين للمتابعة';
    }
  }
  function showSupportPrompt(uid) {
    if (!uid || supportPromptDone(uid)) return;
    state.supportPromptUid = uid;
    state.supportClicks = readSupportClicks(uid);
    modalRoot.innerHTML = `<div class="modal-backdrop support-backdrop"><section class="modal support-modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="support-title" aria-describedby="support-description"><h2 id="support-title">ادعموا وردي بمتابعة المطورين</h2><p id="support-description">يسعدنا دعمكم بفتح القناتين. بعد فتح الرابطين اضغط «متابعة» لإغلاق هذه الرسالة.</p><div class="support-channel-list"><a class="support-channel support-channel-jannah" href="${SUPPORT_CHANNELS.jannah.url}" target="_blank" rel="noopener noreferrer" data-action="support-channel-jannah"><span class="support-channel-copy"><strong>${SUPPORT_CHANNELS.jannah.title}</strong><small>${SUPPORT_CHANNELS.jannah.detail}</small></span><span class="support-channel-status" data-support-status="jannah">افتح القناة</span></a><a class="support-channel support-channel-omar" href="${SUPPORT_CHANNELS.omar.url}" target="_blank" rel="noopener noreferrer" data-action="support-channel-omar"><span class="support-channel-copy"><strong>${SUPPORT_CHANNELS.omar.title}</strong><small>${SUPPORT_CHANNELS.omar.detail}</small></span><span class="support-channel-status" data-support-status="omar">افتح القناة</span></a></div><p class="support-disclaimer">لا يتحقق التطبيق فعليًا من الاشتراك؛ يعتمد فقط على فتح رابطَي القناتين.</p><div class="modal-actions"><button type="button" class="btn" data-action="support-dismiss" disabled>افتح الرابطين للمتابعة</button></div></section></div>`;
    updateSupportPromptControls();
    modalRoot.querySelector('.support-modal')?.focus();
  }
  function startSupportPrompt(user) {
    const uid = String(user?.uid || '');
    if (!uid || supportPromptDone(uid)) return;
    try { localStorage.setItem(supportKey('pending', uid), '1'); } catch { /* التخزين المحلي اختياري */ }

  function render() {
    applyPrefs();
    if (!(state.page === 'task' && state.taskKind === 'memorize')) {
      if (state.recording) {
        try { state.mediaRecorder?.stop(); } catch { /* انتهى التسجيل أو لم يبدأ */ }
        state.mediaStream?.getTracks().forEach(track => track.stop());
        state.mediaStream = null;
        state.recording = false;
      }
      if (state.audioUrl) { URL.revokeObjectURL(state.audioUrl); state.audioUrl = ''; }
    }
    if (state.loading) return loadingPage();
    if (!state.user) return loginPage();
    if (!state.user.accountType) return accountPage();
    if (state.user.accountType === 'pair' && !state.user.pairId) return pairingPage();
    if (state.user.accountType === 'group' && !state.user.groupId) return groupsPage();
    if (state.page === 'task' && ['morning','evening'].includes(state.taskKind)) return adhkarTaskPage(state.taskKind);
    if (state.page === 'task' && state.taskKind === 'memorize') return memorizePage();
    if (state.page === 'reader') return readerPage();
    if (state.page === 'adhkar') return adhkarPage();
    if (state.page === 'duas') return duasPage();
    if (state.page === 'progress') return progressPage();
    if (state.page === 'relationship') return relationshipPage();
    if (state.page === 'more') return morePage();
    if (state.page === 'quran') return readerPage();
    return homePage();
  }
  async function refreshHome() {
    const data = await api('/api/home');
    state.home = data;
    state.user = { ...(state.user || {}), ...(data.user || {}) };
    if (data.needsAccountType) state.user.accountType = null;
    render();
    return data;
  }
  async function loadSession() {
    state.loading = true; state.bootError = ''; render();
    try {
      const data = await api('/api/session');
      state.user = data.user;
      if (state.user) await refreshHome();
      else { state.home = null; state.loading = false; render(); }
    } catch (error) {
      state.user = null; state.home = null; state.loading = false;
      state.bootError = error.message.includes('Firebase') || error.status === 503 ? 'الخادم غير جاهز للاتصال بقاعدة البيانات. يلزم إعداد اعتماد Firebase Admin في إعدادات الاستضافة.' : error.message;
      render();
    } finally { state.loading = false; render(); if (state.user) resumeSupportPrompt(state.user); }
  }
  async function loadPrayer() {
    state.prayerLoading = true; state.prayerError = ''; render();
    const params = new URLSearchParams({ city: prefs.city || 'Cairo', country: prefs.country || 'Egypt', method: '5' });
    try {
      const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?${params.toString()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error('تعذر جلب مواقيت الصلاة. تحقق من اسم المدينة والدولة.');
      const json = await response.json();
      if (json.code !== 200 || !json.data?.timings) throw new Error('لم نجد مواقيت لهذه المدينة. راجع كتابة المدينة والدولة.');
      state.prayer = json.data;
    } catch (error) { state.prayerError = error.message || 'تعذر جلب مواقيت الصلاة الآن.'; }
    finally { state.prayerLoading = false; render(); }
  }
  async function loadQuranPage(page) {
    const n = Math.min(604, Math.max(1, Number(page) || 1));
    state.readerPage = n; state.quranLoading = true; state.quranError = ''; state.quranData = null; render();
    try {
      const response = await fetch(`https://api.alquran.cloud/v1/page/${n}/quran-uthmani`, { cache: 'force-cache' });
      const json = await response.json();
      if (!response.ok || json.code !== 200 || !json.data?.ayahs) throw new Error('تعذر تحميل الصفحة من مصدر المصحف.');
      if (state.readerPage === n) state.quranData = json.data;
    } catch { state.quranError = 'تعذر تحميل نص الصفحة. تحقق من الإنترنت ثم أعد المحاولة.'; }
    finally { state.quranLoading = false; render(); }
  }
  async function withBusy(action) {
    if (state.busy) return;
    state.busy = true; render();
    try { await action(); }
    catch (error) { notify(error.message || 'تعذر إتمام الطلب.', 'error'); }
    finally { state.busy = false; render(); }
  }
  async function chooseType(type, pairMode = null) {
    closeModal();
    return withBusy(async () => {
      await api('/api/account/type', { method: 'POST', body: { accountType: type, pairMode } });
      await api('/api/session').then(x => { state.user = x.user; });
      if (type === 'pair') { state.page = 'pairing'; await maybeGuidance('pairing'); }
      else if (type === 'group') { state.page = 'groups'; await maybeGuidance('groups'); }
      else { await refreshHome(); state.page = 'home'; notify('وردك الفردي جاهز.'); }
      render();
    });
  }
  async function startTask(kind) {
    await withBusy(async () => {
      const data = await api(`/api/tasks/${kind}/start`, { method: 'POST', body: {} });
      if (state.home?.tasks) state.home.tasks[kind] = data.task;
      state.taskKind = kind;
      if (kind === 'quran') {
        state.page = 'reader'; state.readerFromTask = true;
        const plan = state.home?.plan || { start: 1 };
        const last = Number(data.task?.lastPage || 0);
        await maybeGuidance('quran');
        await loadQuranPage(Math.max(Number(plan.start || 1), last || Number(plan.start || 1)));
      } else {
        state.page = 'task';
        if (kind === 'memorize') await maybeGuidance('memorize');
        else await maybeGuidance(kind);
      }
      render();
    });
  }
  async function finishTask(kind) {
    await withBusy(async () => {
      const data = await api(`/api/tasks/${kind}/complete`, { method: 'POST', body: {} });
      await refreshHome(); state.page = 'home'; state.readerFromTask = false;
      notify(data.allDone ? 'أكملت ورد اليوم كله. تقبّل الله منك.' : `اكتملت مهمة ${KIND_LABELS[kind]}.`);
      render();
    });
  }
  async function incrementAdhkar(kind, index) {
    await withBusy(async () => {
      const result = await api(`/api/tasks/${kind}/progress`, { method: 'POST', body: { index: Number(index) } });
      state.home.tasks[kind] = result.task;
      render();
    });
  }
  async function countMemorization() {
    const current = Number(state.home?.tasks?.memorize?.recitedCount || 0);
    if (current >= 3) return;
    await withBusy(async () => {
      const result = await api('/api/tasks/memorize/progress', { method: 'POST', body: { recitedCount: current + 1 } });
      state.home.tasks.memorize = result.task;
      if (current + 1 === 3) notify('اكتملت التلاوات الثلاث. اضغط إكمال المهمة.');
      render();
    });
  }
  async function nextQuranPage() {
    const plan = state.home?.plan || { end: 604 };
    const limit = state.readerFromTask ? Number(plan.end) : 604;
    if (state.readerFromTask) {
      await withBusy(async () => {
        await api('/api/tasks/quran/progress', { method: 'POST', body: { page: state.readerPage } });
        state.home.tasks.quran.reached = Math.max(Number(state.home.tasks.quran.reached || 0), state.readerPage);
        state.home.tasks.quran.lastPage = state.readerPage;
        await refreshHome();
        if (state.readerPage < limit) await loadQuranPage(state.readerPage + 1);
        else notify('تم تسجيل آخر صفحة في ورد اليوم.');
      });
    } else if (state.readerPage < limit) await loadQuranPage(state.readerPage + 1);
  }
  async function previousQuranPage() {
    const floor = state.readerFromTask ? Number(state.home?.plan?.start || 1) : 1;
    if (state.readerPage <= floor) return;
    await loadQuranPage(state.readerPage - 1);
  }
  async function saveBookmark() {
    await withBusy(async () => {
      await api('/api/quran/bookmark', { method: 'POST', body: { page: state.readerPage } });
      if (state.home?.quranProgress) state.home.quranProgress.currentPage = state.readerPage;
      notify(`تم حفظ علامة الصفحة ${state.readerPage}.`);
    });
  }
  function openReader(fromTask = false) {
    state.readerFromTask = fromTask; state.page = 'reader';
    if (fromTask) state.taskKind = 'quran';
    const start = fromTask ? Number(state.home?.plan?.start || 1) : Number(state.home?.quranProgress?.currentPage || 1);
    const taskLast = fromTask ? Number(state.home?.tasks?.quran?.lastPage || 0) : 0;
    loadQuranPage(Math.max(start, taskLast || start));
  }
  function recordStart() {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return notify('التسجيل الصوتي غير متاح في هذا المتصفح.', 'error');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      state.mediaStream = stream; const chunks = [];
      const recorder = new MediaRecorder(stream); state.mediaRecorder = recorder;
      recorder.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
      recorder.onstop = () => {
        if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        state.audioUrl = URL.createObjectURL(blob); state.mediaStream?.getTracks().forEach(t => t.stop()); state.mediaStream = null; state.recording = false; render();
      };
      recorder.start(); state.recording = true; notify('بدأ التسجيل على جهازك فقط.'); render();
    }).catch(() => notify('لم نتمكن من استخدام الميكروفون. راجع إذن المتصفح.', 'error'));
  }
  function recordStop() { try { state.mediaRecorder?.stop(); } catch { state.recording = false; state.mediaStream?.getTracks().forEach(t => t.stop()); render(); } }
  async function handleClick(event) {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    if (action === 'modal-backdrop' && event.target === button) return closeModal();
    if (action === 'modal-close') return closeModal();
    if (action === 'support-channel-jannah') return markSupportChannelOpened('jannah');
    if (action === 'support-channel-omar') return markSupportChannelOpened('omar');
    if (action === 'support-dismiss') return completeSupportPrompt();
    if (action.startsWith('guidance:')) return markGuidance(action.split(':')[1]);
    if (action === 'guidance-open') return modalInfo(button.dataset.key);
    if (action === 'open-guidance') return modalInfo(state.page === 'more' ? 'account-type' : state.page === 'pairing' ? 'pairing' : state.page === 'groups' ? 'groups' : state.taskKind || 'account-type');
    if (action === 'retry') return loadSession();
    if (action === 'choose-individual') return chooseType('individual');
    if (action === 'choose-group') return chooseType('group');
    if (action === 'open-pair-choice') return pairChoiceModal();
    if (action === 'choose-pair-ordinary') return chooseType('pair','ordinary');
    if (action === 'choose-pair-islamic') return chooseType('pair','islamic');
    if (action === 'switch-account') return showModal('إنهاء الارتباط أولًا', 'لا يمكن تغيير النوع أثناء وجود ارتباط أو عضوية نشطة. افتح إدارة العلاقة، وأنهِها بالطريقة المناسبة، ثم اختر نوع الحساب.', [{label:'فهمت',action:'modal-close'}]);
    if (action === 'copy-code') {
      try { await navigator.clipboard.writeText(state.user?.pairingCode || state.home?.user?.pairingCode || ''); notify('تم نسخ كود الربط.'); }
      catch { notify('تعذر النسخ تلقائيًا؛ حدّد الكود وانسخه يدويًا.', 'error'); }
      return;
    }
    if (action === 'join-group') return withBusy(async () => { await api('/api/groups/join',{method:'POST',body:{username:button.dataset.username}}); state.groupSearch=null; await api('/api/session').then(x=>state.user=x.user); await refreshHome(); state.page='home'; notify('انضممت للمجموعة. تبدأ أهليتك للـStreak غدًا.'); render(); });
    if (action === 'navigate') {
      const p = button.dataset.page;
      if (p === 'quran') return openReader(false);
      if (p === 'home') { state.page = 'home'; state.readerFromTask = false; state.taskKind = null; return refreshHome().catch(e=>notify(e.message,'error')); }
      if (p === 'adhkar') { state.page='adhkar';state.libraryQuery='';return render(); }
      if (p === 'duas') { state.page='duas';state.libraryQuery='';return render(); }
      if (p === 'more') { state.page='more';return render(); }
      state.page=p;return render();
    }
    if (action === 'settings') { state.page='more'; return render(); }
    if (action === 'open-task') return startTask(button.dataset.kind);
    if (action === 'complete-task') return finishTask(button.dataset.kind);
    if (action === 'adhkar-increment') return incrementAdhkar(button.dataset.kind, button.dataset.index);
    if (action === 'memorize-count') return countMemorization();
    if (action === 'reader-open') return openReader(false);
    if (action === 'reader-next') {
      if (!state.readerFromTask) return nextQuranPage();
      const last = Number(state.home?.tasks?.quran?.lastPage || Number(state.home?.plan?.start || 1) - 1);
      if (state.readerPage < last + 1) return loadQuranPage(state.readerPage + 1);
      return notify('اقرأ الصفحة الحالية ثم اضغط «أنهيت الصفحة» لتسجيل تقدم الورد.');
    }
    if (action === 'reader-prev') return previousQuranPage();
    if (action === 'task-page-done') return nextQuranPage();
    if (action === 'bookmark') return saveBookmark();
    if (action === 'retry-quran') return loadQuranPage(state.readerPage);
    if (action === 'toggle-reader-mode') { prefs.readerMode=!prefs.readerMode; savePrefs(); return render(); }
    if (action === 'toggle-dark') { prefs.dark=!prefs.dark;savePrefs();return render(); }
    if (action === 'font-up') { prefs.fontScale=Math.min(1.35,Number(prefs.fontScale)+.05);savePrefs();return render(); }
    if (action === 'font-down') { prefs.fontScale=Math.max(.9,Number(prefs.fontScale)-.05);savePrefs();return render(); }
    if (action === 'extra-category') { state.extraCategory=button.dataset.id;state.libraryQuery='';return render(); }
    if (action === 'clear-search') { state.libraryQuery='';return render(); }
    if (action === 'record-start') return recordStart();
    if (action === 'record-stop') return recordStop();
    if (action === 'leave-group') return showModal('الخروج من المجموعة؟','سيبقى حسابك وتقدمك محفوظين. لن تُحسب عضوًا مؤهلًا لهذا اليوم إذا خرجت قبل منتصف الليل، ويمكنك الانضمام إلى مجموعة أخرى.',[{label:'إلغاء',action:'modal-close',secondary:true},{label:'الخروج',action:'confirm-leave-group',danger:true}]);
    if (action === 'confirm-leave-group') { closeModal(); return withBusy(async()=>{await api('/api/groups/leave',{method:'POST',body:{}});await api('/api/session').then(x=>state.user=x.user);await refreshHome();state.page='home';notify('خرجت من المجموعة، وحسابك محفوظ.');render();}); }
    if (action === 'pair-leave-request') return showModal(state.home?.relationship?.pairMode==='islamic'?'طلب الخروج من المزدوج الإسلامي؟':'إنهاء الارتباط؟',state.home?.relationship?.pairMode==='islamic'?'سيصل الطلب للطرف الآخر. لن ينتهي الارتباط إلا بعد موافقته.':'سينتهي الارتباط المشترك الآن، ويعود كل طرف لحساب فردي.',[{label:'إلغاء',action:'modal-close',secondary:true},{label:'تأكيد الطلب',action:'confirm-pair-leave',danger:true}]);
    if (action === 'confirm-pair-leave') { closeModal(); return withBusy(async()=>{const data=await api('/api/pairing/leave/request',{method:'POST',body:{}});await refreshHome();state.page='relationship';notify(data.status==='pending'?'أُرسل الطلب، وبانتظار موافقة الطرف الآخر.':'انتهى الارتباط.');render();}); }
    if (action === 'pair-leave-response') return withBusy(async()=>{const data=await api('/api/pairing/leave/respond',{method:'POST',body:{approve:button.dataset.approve==='true'}});await api('/api/session').then(x=>state.user=x.user);await refreshHome();state.page=data.status==='ended'?'home':'relationship';notify(data.status==='ended'?'انتهى الارتباط وعاد الحسابان للفردي.':'تم تسجيل ردك.');render();});
    if (action === 'reset-progress') return showModal('بدء الورد من جديد؟','سيُعاد ضبط تقدم القرآن والحفظ والمهام. في المزدوج أو المجموعة ينتظر التطبيق موافقة كل الأعضاء. لا يُحذف حسابك، ولا نعيد ضبط سجل الـStreak الفردي دون تنبيه.',[{label:'إلغاء',action:'modal-close',secondary:true},{label:'طلب إعادة الضبط',action:'confirm-reset',danger:true}]);
    if (action === 'confirm-reset') { closeModal(); return withBusy(async()=>{const data=await api('/api/progress/reset',{method:'POST',body:{agree:true}});await refreshHome();state.page='relationship';notify(data.status==='reset'?'أُعيد ضبط التقدم.':`بانتظار موافقات الأعضاء (${data.approved} / ${data.required}).`);render();}); }
    if (action === 'logout') return showModal('الخروج من هذا المتصفح؟','سيتم حذف جلسة هذا المتصفح. لأن الحساب مجهول بلا بريد أو كلمة مرور، لن يمكن استرجاعه من جهاز آخر.',[{label:'إلغاء',action:'modal-close',secondary:true},{label:'خروج',action:'confirm-logout',danger:true}]);
    if (action === 'confirm-logout') { closeModal(); return withBusy(async()=>{await api('/api/session/logout',{method:'POST',body:{}});state.user=null;state.home=null;state.page='home';state.loading=false;render();notify('تم الخروج من هذا المتصفح.');}); }
  }
  async function handleSubmit(event) {
    const form = event.target;
    if (!form.id) return;
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form).entries());
    if (form.id === 'login-form') {
      const name=String(values.displayName||'').trim();
      await withBusy(async()=>{
        const data=await api('/api/session',{method:'POST',body:{displayName:name}});
        state.user=data.user;
        await refreshHome();
        if(!state.user?.accountType) state.page='home';
        notify(`أهلًا ${name}، نبدأ بهدوء.`);
        render();
        startSupportPrompt(state.user);
      });
    } else if (form.id === 'pair-form') {
      await withBusy(async()=>{const data=await api('/api/pairing/connect',{method:'POST',body:{code:values.code}});await api('/api/session').then(x=>state.user=x.user);await refreshHome();state.page='home';notify(`تم الربط مع ${data.partnerName || 'الطرف الآخر'}.`);render();if(data.pairMode==='islamic') await maybeGuidance('islamic-pair');});
    } else if (form.id === 'group-search-form') {
      await withBusy(async()=>{const data=await api(`/api/groups/search?username=${encodeURIComponent(values.username||'')}`);state.groupSearch=data;render();if(data.found) await maybeGuidance('group-join');});
    } else if (form.id === 'group-create-form') {
      await withBusy(async()=>{const data=await api('/api/groups/create',{method:'POST',body:{name:values.name,username:values.username,capacity:Number(values.capacity)}});await api('/api/session').then(x=>state.user=x.user);await refreshHome();state.page='home';notify(`أُنشئت مجموعة ${data.group.name}. أهليتك تبدأ غدًا.`);render();});
    } else if (form.id === 'location-form') {
      prefs.city=String(values.city||'').trim()||'القاهرة';prefs.country=String(values.country||'').trim()||'Egypt';savePrefs();state.page='more';await loadPrayer();notify('تم تحديث مواقيت الصلاة.');
    }
  }
  document.addEventListener('click', event => { handleClick(event).catch(error => notify(error.message || 'حدث خطأ غير متوقع.', 'error')); });
  document.addEventListener('submit', event => { handleSubmit(event).catch(error => notify(error.message || 'تعذر إرسال النموذج.', 'error')); });
  document.addEventListener('input', event => {
    if (event.target.id === 'extra-search' || event.target.id === 'dua-search') {
      const value=event.target.value; clearTimeout(state.searchTimer); state.searchTimer=setTimeout(()=>{state.libraryQuery=value;const pos=event.target.selectionStart;render();const next=document.getElementById(event.target.id);if(next){next.focus();next.setSelectionRange(pos,pos);}},120);
    }
  });
  window.addEventListener('pagehide', () => {
    if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
    state.mediaStream?.getTracks().forEach(t=>t.stop());
  });
  applyPrefs();
  loadSession();
  loadPrayer();
})();

</script>
</body>
</html>
