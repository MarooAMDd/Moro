<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وردي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ea;
    --fg: #1e2a25;
    --mute: #7f7b6c;
    --line: #e1dbc9;
    --acc: #2f5d50;
    --done: #8a8578;
    --friday: #c9a961;
    --danger: #b3473a;
    --fs: 1.7;
  }
  [data-theme=night] {
    --bg: #12161a;
    --fg: #e1dbc8;
    --mute: #8a8778;
    --line: #252b2f;
    --acc: #8fbfae;
    --done: #6a675c;
    --friday: #d2ae5a;
    --danger: #d6725f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Tajawal, "Segoe UI", Tahoma, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background .5s;
  }
  body.friday-mode { background: linear-gradient(180deg, #f6f0dd 0%, #f6f3ea 60%); }
  [data-theme=night] body.friday-mode { background: linear-gradient(180deg, #1a160e 0%, #12161a 60%); }
  #app { height: 100%; overflow: auto; }
  h1 { font-weight: 700; font-size: 1.8rem; margin: 0; }
  .screen {
    min-height: 100%;
    max-width: 26rem;
    margin: 0 auto;
    padding: 2rem 1.4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    text-align: center;
  }
  .mute { color: var(--mute); font-size: .92rem; }
  .row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    padding: .9rem 0;
    border-bottom: 1px solid var(--line);
    text-align: right;
    transition: opacity .3s;
  }
  .row.done { opacity: .55; }
  .row.done b, .row.done .mute { color: var(--done); }
  .row b { font-weight: 500; font-size: 1.08rem; display: block; }
  .prog { width: 100%; }
  .bar0 { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: .4rem; }
  .bar0 i { display: block; height: 100%; background: var(--acc); transition: width .4s; }
  .err { color: var(--danger); min-height: 1.3em; font-size: .9rem; }
  input {
    font: inherit;
    width: 100%;
    padding: .75rem;
    border: 1px solid var(--line);
    border-radius: .6rem;
    background: transparent;
    color: var(--fg);
    text-align: center;
  }
  .btn {
    font: inherit;
    min-height: 2.75rem;
    background: var(--acc);
    color: var(--bg);
    border: 0;
    border-radius: .7rem;
    padding: .6rem 1.3rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.big { font-size: 1.08rem; padding: .75rem 1.8rem; }
  .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); }
  .btn.danger { background: none; color: var(--danger); border: 1px solid var(--danger); }
  .btn:disabled { background: var(--line); color: var(--mute); cursor: default; }
  .btn.done-btn { background: var(--done); color: var(--bg); }
  .btn-omar { background: #3d6b55; color: #fff; font-size: 1.4rem; padding: 1.4rem; font-weight: 600; width: 100%; letter-spacing: .5px; }
  .btn-maryam { background: #6f5a8f; color: #fff; font-size: 1.4rem; padding: 1.4rem; font-weight: 600; width: 100%; letter-spacing: .5px; }
  .seg { display: flex; gap: .6rem; width: 100%; }
  .seg .btn { flex: 1; }
  .link { font: inherit; font-size: .9rem; min-height: 2.5rem; background: none; border: 0; color: var(--mute); cursor: pointer; }
  .toast {
    position: fixed;
    bottom: 4.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--fg);
    color: var(--bg);
    padding: .5rem 1rem;
    border-radius: .6rem;
    font-size: .9rem;
    z-index: 9;
    max-width: 90vw;
  }
  .fl { display: inline-block; transition: filter .3s; filter: grayscale(1) opacity(.55); }
  .fl.red { filter: drop-shadow(0 0 4px rgba(214,90,60,.55)); }
  .qf { font-family: "Amiri Quran", "Scheherazade New", "Traditional Arabic", serif; }

  /* ===== Adhkar cards ===== */
  .dk-list { width: 100%; display: flex; flex-direction: column; gap: .1rem; }
  .dk-card {
    width: 100%;
    text-align: right;
    padding: .9rem 0;
    border-bottom: 1px solid var(--line);
  }
  .dk-card.complete { opacity: .6; }
  .dk-card .dk-title { font-size: .85rem; color: var(--acc); margin-bottom: .35rem; font-weight: 600; }
  .dk-card .dk-text { font-family: "Amiri Quran", serif; font-size: 1.3rem; line-height: 2.2; text-align: justify; text-align-last: center; }
  .dk-card .dk-src { color: var(--mute); font-size: .78rem; margin-top: .4rem; }
  .dk-card .dk-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    margin-top: .6rem;
  }
  .dk-count { font-size: 1rem; font-weight: 600; color: var(--acc); min-width: 4.5rem; text-align: center; }
  .dk-plus {
    width: 2.8rem;
    height: 2.8rem;
    border-radius: 50%;
    border: 0;
    background: var(--acc);
    color: var(--bg);
    font-size: 1.3rem;
    cursor: pointer;
  }
  .dk-plus:disabled { background: var(--line); color: var(--mute); }
  .dk-check { font-size: 1.3rem; color: var(--acc); }

  /* ===== Memorization ===== */
  .mem { width: 100%; text-align: center; padding: 1rem 0; }
  .mem .sn2 { font-family: "Amiri Quran", serif; font-size: 1.6rem; color: var(--acc); margin-bottom: .5rem; }
  .mem .ays {
    font-family: "Amiri Quran", serif;
    font-size: 1.2rem;
    line-height: 2.4;
    max-height: 40vh;
    overflow-y: auto;
    padding: .7rem;
    border: 1px solid var(--line);
    border-radius: .6rem;
    text-align: justify;
    text-align-last: center;
  }

  /* ===== Recorder card (spec §31) ===== */
  .rec-card {
    width: 100%;
    border: 1px dashed var(--line);
    border-radius: .8rem;
    padding: 1.1rem 1rem;
    margin: .9rem 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .7rem;
  }
  .rec-title { font-weight: 600; font-size: .98rem; }
  .rec-time { font-size: 1.6rem; font-weight: 700; color: var(--acc); font-variant-numeric: tabular-nums; }
  .rec-msg { color: var(--mute); font-size: .85rem; text-align: center; }
  .rec-btn {
    min-width: 8rem;
    min-height: 2.9rem;
    border-radius: .7rem;
    border: 0;
    background: var(--acc);
    color: var(--bg);
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
    padding: .6rem 1.2rem;
  }
  .rec-btn.recording { background: var(--danger); animation: pulse 1.2s infinite; }
  .rec-actions { display: flex; gap: .6rem; width: 100%; justify-content: center; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

  .nav { display: flex; gap: .6rem; width: 100%; justify-content: space-between; }
  #rd { position: relative; display: flex; flex-direction: column; height: 100%; }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .3rem .5rem;
    background: var(--bg);
    color: var(--mute);
    z-index: 2;
    transition: opacity .2s;
  }
  .rm .bar { position: absolute; left: 0; right: 0; opacity: 0; pointer-events: none; }
  .rm .top { top: 0; }
  .rm .bot { bottom: 0; }
  .rm.show .bar { opacity: 1; pointer-events: auto; }
  .tb {
    font: inherit;
    font-size: .92rem;
    min-height: 2.75rem;
    background: none;
    border: 0;
    color: var(--mute);
    padding: .4rem .5rem;
    cursor: pointer;
  }
  .top { border-bottom: 1px solid var(--line); }
  .bot { border-top: 1px solid var(--line); }
  #pg { flex: 1; overflow-y: auto; padding: .8rem 1.3rem 3rem; }
  .rm #pg { padding-top: 1.6rem; }
  .mushaf { max-width: 38rem; margin: 0 auto; font-size: calc(var(--fs)*1rem); line-height: 2.5; }
  .rm .mushaf { font-size: calc((var(--fs) + .25)*1rem); }
  .ay { margin: 0; text-align: justify; text-align-last: center; }
  .juz { text-align: center; color: var(--mute); font-size: .7em; line-height: 2; }
  .sn {
    text-align: center;
    color: var(--acc);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin: 1rem 0 .5rem;
    font-size: 1.05em;
    line-height: 2.2;
  }
  .rm .sn { color: var(--mute); border-color: transparent; }
  .bsm { text-align: center; }
  .msg { text-align: center; color: var(--mute); margin-top: 28vh; }
  .endp { text-align: center; margin: 1.5rem 0; font-family: Tajawal, sans-serif; font-size: 1rem; line-height: 1.9; }
  .jump {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9rem;
    padding: 2rem;
  }
  .jump input { max-width: 16rem; }

  .prayer-bar {
    width: 100%;
    padding: .6rem .8rem;
    background: var(--line);
    border-radius: .6rem;
    font-size: .9rem;
    color: var(--fg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background .4s;
  }
  body.friday-mode .prayer-bar { background: rgba(201,169,97,.18); }
  .prayer-bar b { color: var(--acc); }
  .pick { width: 100%; padding: 1.5rem 0; text-align: center; display: flex; flex-direction: column; gap: .9rem; }
  .day-complete { width: 100%; text-align: center; padding: .5rem 0; color: var(--done); font-size: .88rem; font-weight: 500; }
  .friday-banner {
    width: 100%;
    background: linear-gradient(135deg, rgba(201,169,97,.15), rgba(201,169,97,.05));
    border: 1px solid rgba(201,169,97,.4);
    border-radius: .8rem;
    padding: .9rem 1rem;
    margin: .3rem 0;
    text-align: right;
  }
  .friday-banner .fb-title { color: var(--friday); font-weight: 700; font-size: .95rem; margin-bottom: .5rem; text-align: center; font-family: "Amiri Quran", serif; }
  .friday-banner .fb-item { font-size: .85rem; line-height: 1.8; color: var(--fg); padding: .3rem 0; }
  .friday-banner .fb-hadith {
    font-family: "Amiri Quran", serif;
    font-size: .95rem;
    line-height: 2;
    text-align: justify;
    text-align-last: center;
    color: var(--mute);
    border-top: 1px dashed rgba(201,169,97,.3);
    padding-top: .6rem;
    margin-top: .5rem;
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- بيانات السور القصيرة لمهمة الحفظ. سكريبت عادي (وليس module) حتى يصبح SHORT_SURAHS متاحًا في الوحدة أدناه. -->
<script src="./surahs.js"></script>

<script type="module">
/*
  Realtime Database rules لهذا الإصدار (لا يوجد Firebase Authentication؛ الحساب يُختار من شاشة الاختيار
  ويُحمى بكلمة مرور ثابتة داخل الكود فقط):

  { "rules": { ".read": true, ".write": true } }

  ملاحظة أمان: هذه القواعد تسمح لأي شخص يملك رابط/إعدادات Firebase بقراءة وكتابة القاعدة كاملة.
  هذا مقبول فقط لاستخدام خاص جدًا بين شخصين، وليس مناسبًا لو أصبح المشروع عامًا.
*/

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, get, set, update, runTransaction, onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ======================================================================
   CONFIG
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDcZQLLUtWL8UGjib9Nwqcu-gs84hXTWyk",
  authDomain: "omar-1-fcd61.firebaseapp.com",
  databaseURL: "https://omar-1-fcd61-default-rtdb.firebaseio.com",
  projectId: "omar-1-fcd61",
  storageBucket: "omar-1-fcd61.firebasestorage.app",
  messagingSenderId: "1098323069112",
  appId: "1:1098323069112:web:0e36a35eae752e53ac4c4d",
  measurementId: "G-2ZJMPDMCTP"
};

const CFG = {
  tz: "Africa/Cairo",
  totalPages: 604,
  quranPagePlan: [4, 6, 8, 10, 12],      // الأهداف اليومية المسموحة لصفحات القرآن (Deterministic، تدور حسب رقم اليوم)
  memorizeRepeats: 3,                    // عدد مرات "تم" المطلوبة لإكمال مهمة الحفظ
  rescuesTotal: 3,                       // عدد محاولات الاسترجاع المتاحة قبل تصفير الـ streak
  pair: "pair_001",
  quranApiBase: "https://api.alquran.cloud/v1/",
  editionPrimary: "quran-uthmani-quran-academy",   // edition رسمي من Al Quran Cloud لعرض صفحات المصحف
  editionFallback: "quran-uthmani",                 // احتياطي فقط إذا فشل الأول تمامًا، لتفادي "جارٍ التحميل" الدائم
  pageCacheLimit: 20,                    // أقصى عدد صفحات محفوظة في ذاكرة المتصفح (Map، وليس localStorage)
  fetchTimeoutMs: 12000,
  fetchRetriesPerEdition: 1,             // محاولة إضافية واحدة لكل edition قبل الانتقال للتالي
  bootTimeoutMs: 15000                   // حد أقصى لأي شاشة "جارٍ التحميل" عند بدء التشغيل
};

const USERS = { user_omar: "عمر", user_maryam: "مريم" };
const MEMBERS = Object.keys(USERS);
const KINDS = ["morning", "quran", "memorize", "evening"];

// كلمات مرور ثابتة (مطلوبة سابقًا، ولم يُطلب حذفها). مناسبة للاستخدام الخاص فقط لأنها ظاهرة في مصدر الصفحة.
const PASSWORDS = { user_omar: "Omar", user_maryam: "Mariam" };

// الحساب الوحيد الذي يرى زر "إعادة ضبط كل البيانات".
const RESET_ALLOWED_UID = "user_omar";

/* ======================================================================
   FIREBASE
   ====================================================================== */
const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

/* ======================================================================
   DATE / TIME
   (ساعة خادم Firebase + توقيت القاهرة؛ لا تُستخدم ساعة الجهاز أبدًا لتحديد اليوم)
   ====================================================================== */
let serverOffsetMs = 0;
onValue(ref(db, ".info/serverTimeOffset"), snap => {
  serverOffsetMs = snap.val() || 0;
});

function serverNow() {
  return Date.now() + serverOffsetMs;
}

function dateKey() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: CFG.tz }).format(new Date(serverNow()));
}

function addDays(dateStr, n) {
  const t = new Date(dateStr + "T00:00:00Z");
  t.setUTCDate(t.getUTCDate() + n);
  return t.toISOString().slice(0, 10);
}

function dayIndexOf(dateStr) {
  // رقم يوم ثابت منذ ١٩٧٠-٠١-٠١ UTC، يُستخدم فقط لاختيار الهدف اليومي (deterministic)، وليس عدّاد "اليوم الأول/الثاني".
  return Math.floor(new Date(dateStr + "T00:00:00Z").getTime() / 86400000);
}

function waitForServerOffset() {
  return new Promise(resolve => {
    const start = Date.now();
    const i = setInterval(() => {
      if (serverOffsetMs !== 0 || Date.now() - start > 3000) {
        clearInterval(i);
        resolve();
      }
    }, 100);
  });
}

function isFriday() {
  return new Intl.DateTimeFormat("en-US", { timeZone: CFG.tz, weekday: "short" }).format(new Date(serverNow())) === "Fri";
}

function cairoClockParts() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: CFG.tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
  }).format(new Date(serverNow())).split(":").map(Number);
  return parts; // [hh, mm, ss]
}

function cairoMinutesOfDay() {
  const [hh, mm] = cairoClockParts();
  return hh * 60 + mm;
}
function cairoSecondsOfDay() {
  const [hh, mm, ss] = cairoClockParts();
  return hh * 3600 + mm * 60 + ss;
}

function secondsToMidnight() {
  const [hh, mm, ss] = cairoClockParts();
  return Math.max(0, 86400 - (hh * 3600 + mm * 60 + ss));
}

// يمنع أي شاشة "جارٍ التحميل" من الاستمرار للأبد: يرفض الـ Promise بعد مهلة محددة إن لم يكتمل.
function withTimeout(promise, ms, label) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error("timeout:" + (label || ""))), ms);
    promise.then(
      v => { clearTimeout(timer); resolve(v); },
      e => { clearTimeout(timer); reject(e); }
    );
  });
}

/* ======================================================================
   SETTINGS
   (تفضيلات الواجهة فقط: حجم الخط، الوضع الليلي، وضع القراءة — محلية بالكامل)
   ====================================================================== */
const localStore = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* التخزين قد يكون ممتلئًا أو معطلاً؛ ليس خطأً فادحًا */ }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }
};

const settings = Object.assign({ fontScale: 1.7, theme: "day", readingMode: false }, localStore.get("settings", {}));

function applySettings() {
  document.documentElement.style.setProperty("--fs", settings.fontScale);
  document.documentElement.setAttribute("data-theme", settings.theme);
}
function saveSettings() {
  localStore.set("settings", settings);
  applySettings();
}

/* ======================================================================
   UI HELPERS
   ====================================================================== */
function ar(n) {
  return String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
}
function pagesLabel(n) {
  if (n === 1) return "صفحة واحدة";
  if (n === 2) return "صفحتان";
  return ar(n) + " صفحات";
}
// كل وقت يظهر في الواجهة (عدّاد اليوم الجديد، تسجيل الصوت، الوقت المتبقي للصلاة) يُعرض بنفس الشكل: ساعات:دقائق:ثوانٍ.
function formatClock(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const hh = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
  const mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
  const ss = String(totalSeconds % 60).padStart(2, "0");
  return ar(hh + ":" + mm + ":" + ss);
}

function h(tag, attrs, ...children) {
  attrs = attrs || {};
  const el = document.createElement(tag);
  for (const key in attrs) {
    if (key === "on") {
      for (const evt in attrs.on) el.addEventListener(evt, attrs.on[evt]);
    } else if (key === "cls") {
      el.className = attrs.cls;
    } else {
      el.setAttribute(key, attrs[key]);
    }
  }
  children.flat().forEach(child => {
    if (child == null || child === false) return;
    el.append(child);
  });
  return el;
}

// يستبدل أبناء عنصر موجود، ويتجاهل null/false بدل إدراجها كنص "null".
function put(el, ...children) {
  el.replaceChildren(...children.flat().filter(c => c != null && c !== false));
}

let activeTicks = [];        // دوال تُستدعى كل ثانية لتحديث عناصر حيّة على الشاشة الحالية (عداد وقت، إلخ)
let currentView = "";
let uiBusy = false;          // يمنع الضغط المزدوج أثناء عملية كتابة جارية إلى Firebase

function mount(node) {
  activeTicks = [];
  document.querySelector("#app").replaceChildren(node);
}

function toast(message) {
  const el = h("div", { cls: "toast" }, message);
  document.body.append(el);
  setTimeout(() => el.remove(), 3500);
}

const SAVE_ERROR_MSG = "تعذر حفظ التقدم، حاول مرة أخرى.";
const CONNECT_ERROR_MSG = "تعذر الاتصال بالخادم. حاول مرة أخرى.";

setInterval(() => activeTicks.forEach(fn => fn()), 1000);

/* ======================================================================
   STATE
   UID          — معرف الحساب الحالي (user_omar / user_maryam)
   QP           — تقدم القرآن لهذا الحساب (quranProgress/UID في Firebase)
   T            — حالة اليوم الحالي (dailyTasks/UID/date)
   S            — حالة الـ Shared Streak (streak/pair_001)

/* ======================================================================
   QURAN API
   (تُستخدم فقط لعرض صفحات المصحف في القارئ. مهمة الحفظ تستخدم surahs.js المحلي بالكامل.)
   ====================================================================== */

// يحذف تشكيل الآية (حركات/تنوين/شدة/سكون) فقط لغرض المقارنة الحرفية، دون التأثير على النص المعروض فعليًا.
const ARABIC_DIACRITICS_RE = /[\u064B-\u065F\u0670\u06D6-\u06ED\u08F0-\u08FF]/;
const BARE_BASMALA = "بسم الله الرحمن الرحيم".replace(/\s+/g, "");

// يحذف البسملة من بداية نص الآية الأولى في السورة (إن وُجدت) بالاعتماد على تطابق الحروف الفعلية حرفًا حرفًا،
// وليس على عدّ الكلمات — تفاديًا لأي حذف خاطئ من نص الآية نفسها.
// يُعيد null إن لم يبدأ النص بالبسملة أصلًا (فتُعرض الآية كما هي، مع سطر البسملة المنفصل الثابت فوقها).
function stripLeadingBasmala(ayahText) {
  let bareIdx = 0;
  let i = 0;
  while (i < ayahText.length && bareIdx < BARE_BASMALA.length) {
    const ch = ayahText[i];
    if (ARABIC_DIACRITICS_RE.test(ch)) { i++; continue; }
    if (ch === " " || ch === "\u00A0") { i++; continue; }
    if (ch === BARE_BASMALA[bareIdx]) { bareIdx++; i++; continue; }
    return null;
  }
  if (bareIdx < BARE_BASMALA.length) return null;
  while (i < ayahText.length && /\s/.test(ayahText[i])) i++;
  return ayahText.slice(i);
}

async function fetchQuranJson(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), CFG.fetchTimeoutMs);
  try {
    const response = await fetch(url, { signal: controller.signal });
    if (!response.ok) throw new Error("http-" + response.status);
    let body;
    try {
      body = await response.json();
    } catch (parseErr) {
      throw new Error("invalid-json");
    }
    if (!body || body.code !== 200 || !body.data) throw new Error("invalid-payload");
    return body.data;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchMushafPage(pageNumber) {
  const editions = [CFG.editionPrimary, CFG.editionFallback];
  let lastError = null;
  for (const edition of editions) {
    for (let attempt = 0; attempt <= CFG.fetchRetriesPerEdition; attempt++) {
      try {
        const url = CFG.quranApiBase + "page/" + pageNumber + "/" + edition;
        const data = await fetchQuranJson(url);
        if (!data || !Array.isArray(data.ayahs) || data.ayahs.length === 0) {
          throw new Error("empty-ayahs");
        }
        return data.ayahs.map(a => ({
          surah: a.surah.number,
          surahName: a.surah.name,
          numberInSurah: a.numberInSurah,
          text: a.text,
          juz: a.juz
        }));
      } catch (err) {
        lastError = err;
        console.error("fetchMushafPage failed", { pageNumber, edition, attempt, err });
      }
    }
  }
  throw lastError || new Error("fetch-failed");
}

/* ======================================================================
   QURAN CACHE
   (Map محدود بآخر CFG.pageCacheLimit صفحة — وليس localStorage — لمنع تضخم التخزين)
   ====================================================================== */
const quranPageCache = new Map();

function cacheGetPage(pageNumber) {
  const key = pageNumber;
  if (!quranPageCache.has(key)) return null;
  const value = quranPageCache.get(key);
  quranPageCache.delete(key);
  quranPageCache.set(key, value); // إعادة الإدخال في النهاية = "استُخدم مؤخرًا" لسياسة LRU بسيطة
  return value;
}
function cacheSetPage(pageNumber, ayahs) {
  quranPageCache.set(pageNumber, ayahs);
  while (quranPageCache.size > CFG.pageCacheLimit) {
    const oldestKey = quranPageCache.keys().next().value;
    quranPageCache.delete(oldestKey);
  }
}
function clearQuranPageCache() {
  quranPageCache.clear();
}

async function getMushafPage(pageNumber) {
  const cached = cacheGetPage(pageNumber);
  if (cached) return cached;
  const ayahs = await fetchMushafPage(pageNumber);
  cacheSetPage(pageNumber, ayahs);
  return ayahs;
}

const ADHKAR_BY_KIND = { morning: MORNING_ADHKAR, evening: EVENING_ADHKAR };

/* ======================================================================
   DAILY TASKS
   (اختيار الهدف اليومي deterministic بالكامل: يعتمد على رقم اليوم + تقدّم المستخدم، وليس Math.random)
   ====================================================================== */
function planForDate(quranProgress, date) {
  const idx = dayIndexOf(date);
  const pages = CFG.quranPagePlan[idx % CFG.quranPagePlan.length];
  const surah = SHORT_SURAHS[idx % SHORT_SURAHS.length];
  return {
    start: quranProgress.frontier,
    pages,
    end: Math.min(CFG.totalPages, quranProgress.frontier + pages - 1),
    khatmah: quranProgress.khatmah,
    surahNumber: surah.number,
    surahName: surah.name
  };
}

function taskPath(kind) {
  return `dailyTasks/${UID}/${T.date}/tasks/${kind}`;
}

// تحديث محلي متفائل (Optimistic) + كتابة فعلية على Firebase، مع تراجع محلي إذا فشلت الكتابة.
async function patchTask(kind, changes) {
  const taskObj = T.tasks[kind];
  const flatChanges = Object.entries(changes).filter(([key]) => !key.includes("/"));
  const previousValues = {};
  flatChanges.forEach(([key]) => { previousValues[key] = taskObj[key]; });
  Object.assign(taskObj, Object.fromEntries(flatChanges));
  try {
    await update(ref(db, taskPath(kind)), changes);
  } catch (err) {
    Object.assign(taskObj, previousValues);
    throw err;
  }
}

function stateOf(kind) {
  if (T.date !== dateKey()) return "locked"; // يوم قديم انتهى ولم يُحدَّث بعد
  return T.tasks[kind].state;
}

async function loadAccountData() {
  const quranRef = ref(db, "quranProgress/" + UID);
  QP = (await get(quranRef)).val();
  if (!QP) {
    QP = { currentPage: 1, khatmah: 1, frontier: 1, pagesRead: 0, lastReadAt: 0 };
    await set(quranRef, QP);
  }

  const memRef = ref(db, "memorize/" + UID);
  MEM = (await get(memRef)).val();
  if (!MEM) {
    MEM = { completed: {}, count: 0 };
    await set(memRef, MEM);
  }

  const date = dateKey();
  const dayRef = ref(db, `dailyTasks/${UID}/${date}`);
  const freshPlan = planForDate(QP, date);

  // يُثبَّت هدف اليوم عند أول إنشاء فقط، ولا يُعاد توليده أبدًا (Refresh، تغيير جهاز، تسجيل خروج/دخول، تغيير ساعة الجهاز — كله بلا تأثير).
  await runTransaction(dayRef, current => {
    if (current && current.plan) return current;
    return {
      plan: freshPlan,
      tasks: {
        morning: { state: "available" },
        quran: { state: "available" },
        evening: { state: "available" },
        memorize: { state: "available" }
      }
    };
  });

  const dayData = (await get(dayRef)).val();
  T = { date, plan: dayData.plan, tasks: dayData.tasks || {} };
  for (const kind of KINDS) {
    T.tasks[kind] = Object.assign({ state: "available" }, T.tasks[kind]);
  }

  if (!streakListenerBound) {
    streakListenerBound = true;
    onValue(ref(db, "streak/" + CFG.pair), snap => {
      S = Object.assign({}, INITIAL_STREAK, snap.val());
      if (currentView === "home") renderHome();
    });
  }
  S = S || INITIAL_STREAK;
}

/* ======================================================================
   STREAK
   (تقييم الأيام المنتهية فقط، بترانزاكشن يمنع تكرار احتساب نفس اليوم من أكثر من جهاز)
   ====================================================================== */
async function evaluateStreak() {
  const today = dateKey();
  const streakRef = ref(db, "streak/" + CFG.pair);
  const currentSnapshot = Object.assign({}, INITIAL_STREAK, (await get(streakRef)).val());
  const lastEvaluatedBefore = currentSnapshot.lastEvaluated || addDays(today, -1);

  // اجلب حالة الأيام غير المقيَّمة بعد (كل يوم: هل أكمل الاثنان كل مهامهما؟) قبل الدخول في الترانزاكشن.
  const fetchedDays = {};
  for (let d = addDays(lastEvaluatedBefore, 1), guard = 0; d < today && guard < 400; d = addDays(d, 1), guard++) {
    fetchedDays[d] = (await get(ref(db, `days/${CFG.pair}/${d}`))).val() || {};
  }

  await runTransaction(streakRef, current => {
    current = Object.assign({}, INITIAL_STREAK, current);
    let lastEvaluated = current.lastEvaluated || addDays(today, -1);
    for (let d = addDays(lastEvaluated, 1); d < today; d = addDays(d, 1)) {
      if (!fetchedDays[d]) break; // لم نجلب بيانات هذا اليوم (نادر) — نكمل في المرة القادمة
      const bothCompleted = MEMBERS.every(member => fetchedDays[d][member] === true);
      if (bothCompleted) {
        current.count += 1;
        current.status = "red";
        current.fails = 0;
      } else {
        current.status = "gray";
        current.fails += 1;
        if (current.fails >= 2) { // مرّت ٤٨ ساعة دون يوم ناجح
          if (current.rescues > 0) {
            current.rescues -= 1;
            current.fails = 0;
          } else {
            current.count = 0;
            current.fails = 0;
          }
        }
      }
      lastEvaluated = d;
    }
    current.lastEvaluated = lastEvaluated;
    return current;
  });
}

/* ======================================================================
   TASK COMPLETION RULES
   (بدون Timer وبدون Confirmation: "تم" تُنهي المهمة فورًا بمجرد استيفاء المحتوى فقط)
   ====================================================================== */
function adhkarProgress(kind) {
  const list = ADHKAR_BY_KIND[kind];
  const counts = T.tasks[kind].counts || {};
  const done = list.reduce((sum, item, i) => sum + Math.min(counts[i] || 0, item.repeat), 0);
  const need = list.reduce((sum, item) => sum + item.repeat, 0);
  return { done, need };
}

function contentOk(kind) {
  const task = T.tasks[kind];
  if (kind === "quran") return (task.reached || 0) >= T.plan.end;
  if (kind === "memorize") return (task.recitedCount || 0) >= CFG.memorizeRepeats;
  const list = ADHKAR_BY_KIND[kind];
  const counts = task.counts || {};
  return list.every((item, i) => (counts[i] || 0) >= item.repeat);
}

async function startTask(kind) {
  if (T.tasks[kind].state !== "available") return;
  if (kind === "quran") {
    return patchTask(kind, { state: "inProgress", reached: T.plan.start - 1, lastPage: T.plan.start });
  }
  if (kind === "memorize") {
    return patchTask(kind, { state: "inProgress", recitedCount: 0 });
  }
  return patchTask(kind, { state: "inProgress" });
}

async function completeTask(kind) {
  if (uiBusy) return;
  if (T.tasks[kind].state === "completed") { viewHome(); return; }
  if (!contentOk(kind)) return;
  uiBusy = true;
  try {
    if (kind === "quran") {
      await runTransaction(ref(db, "quranProgress/" + UID), progress => {
        progress = progress || QP;
        if (progress.frontier !== T.plan.start) return; // سبق احتسابها (منع الاحتساب المزدوج)
        progress.lastReadAt = serverNow();
        if (T.plan.end >= CFG.totalPages) {
          progress.khatmah += 1;
          progress.frontier = 1;
          progress.pagesRead = 0;
          progress.currentPage = 1;
        } else {
          progress.frontier = T.plan.end + 1;
          progress.pagesRead = T.plan.end;
        }
        return progress;
      });
      QP = (await get(ref(db, "quranProgress/" + UID))).val();
    }
    if (kind === "memorize") {
      await runTransaction(ref(db, "memorize/" + UID), mem => {
        mem = mem || MEM;
        if (!mem.completed) mem.completed = {};
        if (!mem.completed[T.plan.surahNumber]) {
          mem.completed[T.plan.surahNumber] = T.date;
          mem.count = (mem.count || 0) + 1;
        }
        return mem;
      });
      MEM = (await get(ref(db, "memorize/" + UID))).val();
    }
    await patchTask(kind, { state: "completed" });
    if (KINDS.every(k => T.tasks[k].state === "completed")) {
      await set(ref(db, `days/${CFG.pair}/${T.date}/${UID}`), true);
    }
    uiBusy = false;
    viewHome();
  } catch (err) {
    uiBusy = false;
    toast(SAVE_ERROR_MSG);
  }
}

// زر "تم" العام: مُعطَّل حتى يكتمل المحتوى فقط، بلا أي عدّاد وقت وبلا نافذة تأكيد.
function finishButton(kind, label) {
  const button = h("button", { cls: "btn big" }, label);
  const update = () => { button.disabled = uiBusy || !contentOk(kind); };
  button.onclick = () => completeTask(kind);
  activeTicks.push(update);
  update();
  return button;
}

/* ======================================================================
   RESET (لعمر فقط — يعيد كل شيء إلى الصفر لكلا الحسابين)
   ====================================================================== */
async function resetEverything() {
  if (UID !== RESET_ALLOWED_UID) return; // حماية إضافية، الزر أصلاً لا يظهر لغير عمر
  if (uiBusy) return;
  const confirmed = confirm(
    "سيتم تصفير: تقدم القرآن والختمات لعمر ومريم، الحفظ، مهام اليوم، الستريك المشترك، والمحاولات. " +
    "لن يتأثر تسجيل دخولك. متابعة؟"
  );
  if (!confirmed) return;
  uiBusy = true;
  try {
    const freshQuran = { currentPage: 1, khatmah: 1, frontier: 1, pagesRead: 0, lastReadAt: 0 };
    const freshMemorize = { completed: {}, count: 0 };
    const freshStreak = { count: 0, status: "gray", fails: 0, rescues: CFG.rescuesTotal, lastEvaluated: null };

    const multiPathUpdate = {};
    for (const memberId of MEMBERS) {
      multiPathUpdate["quranProgress/" + memberId] = freshQuran;
      multiPathUpdate["memorize/" + memberId] = freshMemorize;
      multiPathUpdate["dailyTasks/" + memberId] = null;
    }
    multiPathUpdate["days/" + CFG.pair] = null;
    multiPathUpdate["streak/" + CFG.pair] = freshStreak;

    await update(ref(db), multiPathUpdate); // تحديث ذرّي عبر عدة مسارات دفعة واحدة

    clearQuranPageCache();
    localStore.remove("lastFreePage");
    sessionStorage.removeItem("openView");

    uiBusy = false;
    loadingView();
    await loadAccountData();
    await evaluateStreak();
    viewHome();
  } catch (err) {
    uiBusy = false;
    toast(SAVE_ERROR_MSG);
  }
}

/* ======================================================================
   AUDIO RECORDING
   (تسجيل محلي بالكامل، لا يُرفع إلى Firebase أبدًا، ولا علاقة له بإكمال مهمة الحفظ)
   ====================================================================== */
const MIN_RECORDING_SECONDS = 3;
const MAX_RECORDING_SECONDS = 300;

// عنصر التسجيل النشط حاليًا (إن وُجد)، لإيقافه بأمان عند إغلاق الصفحة أو مغادرة الشاشة.
let activeRecorderTeardown = null;

function pickSupportedMimeType() {
  if (!window.MediaRecorder) return "";
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
  return candidates.find(type => MediaRecorder.isTypeSupported(type)) || "";
}

// يبني بطاقة التسجيل كاملة (عنصر DOM) + دالة تفكيك (teardown) تُستدعى عند مغادرة الشاشة.
function createRecorderCard() {
  let mediaRecorder = null;
  let mediaStream = null;
  let recordedChunks = [];
  let audioObjectUrl = null;
  let audioElement = null;
  let elapsedSeconds = 0;
  let tickInterval = null;
  let state = "idle"; // idle | recording | recorded | playing
  let starting = false; // يمنع ضغطتين سريعتين على "تسجيل" قبل استلام إذن الميكروفون

  const titleEl = h("div", { cls: "rec-title" }, "🎙 تسجيل التلاوة");
  const timeEl = h("div", { cls: "rec-time" }, "");
  const messageEl = h("div", { cls: "rec-msg" }, "التسجيل اختياري، ولا يؤثر على إكمال مهمة الحفظ.");
  const actionsEl = h("div", { cls: "rec-actions" });

  function stopAllTracks() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
  }

  function revokeAudio() {
    if (audioElement) {
      audioElement.pause();
      audioElement = null;
    }
    if (audioObjectUrl) {
      URL.revokeObjectURL(audioObjectUrl);
      audioObjectUrl = null;
    }
  }

  function render() {
    if (state === "idle") {
      titleEl.textContent = "🎙 تسجيل التلاوة";
      timeEl.textContent = "";
      timeEl.hidden = true;
      const startBtn = h("button", { cls: "rec-btn", on: { click: beginRecording } }, "🎙 تسجيل");
      startBtn.disabled = starting;
      put(actionsEl, startBtn);
    } else if (state === "recording") {
      titleEl.textContent = "🎙 تسجيل التلاوة";
      timeEl.hidden = false;
      timeEl.textContent = formatClock(elapsedSeconds);
      put(actionsEl, h("button", { cls: "rec-btn recording", on: { click: stopRecording } }, "⏹ إيقاف"));
    } else if (state === "recorded" || state === "playing") {
      titleEl.textContent = "✓ تم التسجيل";
      timeEl.hidden = true;
      timeEl.textContent = "";
      const playBtn = h("button", {
        cls: "rec-btn",
        on: { click: state === "playing" ? pausePlayback : startPlayback }
      }, state === "playing" ? "⏸ إيقاف الاستماع" : "▶ استماع");
      const deleteBtn = h("button", { cls: "btn ghost", on: { click: deleteRecording } }, "🗑 حذف");
      put(actionsEl, playBtn, deleteBtn);
    }
  }

  async function beginRecording() {
    if (starting || state === "recording") return; // يمنع بدء تسجيل ثانٍ أثناء تسجيل جارٍ
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      messageEl.textContent = "المتصفح لا يدعم تسجيل الصوت.";
      return;
    }
    starting = true;
    render();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      starting = false;
      revokeAudio(); // أي تسجيل سابق يُحذف بمجرد بدء تسجيل جديد (لا يمكن الوصول لهذه الحالة أصلًا إلا من idle، لكن للأمان)
      mediaStream = stream;
      recordedChunks = [];
      elapsedSeconds = 0;
      const mimeType = pickSupportedMimeType();
      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);

      mediaRecorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) recordedChunks.push(event.data);
      };
      mediaRecorder.onstop = () => {
        stopAllTracks();
        if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || mimeType || "audio/webm" });
        if (blob.size === 0) {
          messageEl.textContent = "لم يتم تسجيل أي صوت.";
          state = "idle";
        } else if (elapsedSeconds < MIN_RECORDING_SECONDS) {
          messageEl.textContent = "التسجيل قصير جدًا، الحد الأدنى ٣ ثوانٍ.";
          state = "idle";
        } else {
          audioObjectUrl = URL.createObjectURL(blob);
          messageEl.textContent = "يمكنك الاستماع إلى تسجيلك أو حذفه.";
          state = "recorded";
        }
        render();
      };

      mediaRecorder.start(250);
      state = "recording";
      messageEl.textContent = "جارٍ التسجيل…";
      render();

      tickInterval = setInterval(() => {
        elapsedSeconds += 1;
        if (state === "recording") timeEl.textContent = formatClock(elapsedSeconds);
        if (elapsedSeconds >= MAX_RECORDING_SECONDS) {
          stopRecording(); // إيقاف تلقائي عند الوصول للحد الأقصى، دون انتظار المستخدم
        }
      }, 1000);
    } catch (err) {
      starting = false;
      state = "idle";
      messageEl.textContent = (err && err.name === "NotAllowedError")
        ? "يجب السماح باستخدام الميكروفون لتسجيل التلاوة."
        : "تعذر بدء التسجيل.";
      render();
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.stop(); } catch (err) { console.error("stopRecording failed", err); }
    }
  }

  function startPlayback() {
    if (!audioObjectUrl) return;
    if (!audioElement) {
      audioElement = new Audio(audioObjectUrl);
      audioElement.onended = () => { state = "recorded"; render(); };
    }
    audioElement.play().catch(err => console.error("playback failed", err));
    state = "playing";
    render();
  }

  function pausePlayback() {
    if (audioElement) audioElement.pause();
    state = "recorded";
    render();
  }

  function deleteRecording() {
    revokeAudio();
    recordedChunks = [];
    elapsedSeconds = 0;
    messageEl.textContent = "التسجيل اختياري، ولا يؤثر على إكمال مهمة الحفظ.";
    state = "idle";
    render();
  }

  function teardown() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      try { mediaRecorder.stop(); } catch (err) {}
    }
    stopAllTracks();
    revokeAudio();
    if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
  }

  render();
  const cardEl = h("div", { cls: "rec-card" }, titleEl, timeEl, messageEl, actionsEl);
  return { element: cardEl, teardown };
}

/* ======================================================================
   ADHKAR UI
   (قائمة بطاقات، كل ذكر بعدّاده الخاص، وزر "تم" العام يظهر فقط بعد اكتمال الجميع)
   ====================================================================== */
async function viewAdhkar(kind) {
  currentView = "task";
  sessionStorage.setItem("openView", kind);
  try { await startTask(kind); } catch (err) { toast(SAVE_ERROR_MSG); }

  const list = ADHKAR_BY_KIND[kind];
  const task = T.tasks[kind];
  const counts = task.counts || (task.counts = {});
  const isDone = task.state === "completed";

  const listEl = h("div", { cls: "dk-list" });
  const finishSlot = h("div", { style: "width:100%" });

  function increment(index) {
    if (isDone) return;
    const item = list[index];
    const current = counts[index] || 0;
    if (current >= item.repeat) return;
    const nextValue = current + 1;
    counts[index] = nextValue;
    redraw();
    patchTask(kind, { ["counts/" + index]: nextValue }).catch(() => {
      counts[index] = current;
      toast(SAVE_ERROR_MSG);
      redraw();
    });
  }

  function redraw() {
    const cards = list.map((item, index) => {
      const current = Math.min(item.repeat, counts[index] || 0);
      const complete = current >= item.repeat;
      const plusBtn = h("button", { cls: "dk-plus", "aria-label": "زيادة", on: { click: () => increment(index) } }, "+");
      plusBtn.disabled = isDone || complete;
      return h("div", { cls: "dk-card" + (complete ? " complete" : "") },
        h("div", { cls: "dk-title" }, item.title),
        h("div", { cls: "dk-text qf" }, item.text),
        h("div", { cls: "dk-src" }, item.source),
        h("div", { cls: "dk-foot" },
          h("span", { cls: "dk-count" }, ar(current) + " / " + ar(item.repeat)),
          complete ? h("span", { cls: "dk-check" }, "✓") : plusBtn
        )
      );
    });
    put(listEl, ...cards);
    put(finishSlot, !isDone && contentOk(kind) ? finishButton(kind, "تم") : null);
  }

  redraw();

  mount(h("div", { cls: "screen", style: "justify-content:flex-start" },
    h("div", { cls: "mute" }, kind === "morning" ? "☀️ أذكار الصباح" : "🌙 أذكار المساء"),
    listEl,
    finishSlot,
    h("button", { cls: "link", on: { click: () => viewHome() } }, "رجوع")
  ));
}

let readerRequestId = 0; // منع Race Condition: طلب صفحة قديم لا يمكن أن يستبدل صفحة أحدث منه
let bookmarkSaveTimer = 0;

function viewReader(mode) {
  currentView = "reader";
  sessionStorage.setItem("openView", mode === "task" ? "quran" : "free");

  const isTask = mode === "task";
  const plan = T.plan;
  let currentPage;

  const pageContainerEl = h("div", { id: "pg" });

  const jumpInput = h("input", { type: "number", min: 1, max: CFG.totalPages, inputmode: "numeric", placeholder: "رقم الصفحة" });
  const goToTypedPage = () => {
    const n = parseInt(jumpInput.value, 10);
    jumpOverlay.hidden = true;
    if (n >= 1 && n <= CFG.totalPages) showPage(n);
  };
  jumpInput.addEventListener("keydown", e => { if (e.key === "Enter") goToTypedPage(); });
  const jumpOverlay = h("div", { cls: "jump", hidden: "" },
    h("div", {}, "الانتقال إلى صفحة"),
    jumpInput,
    h("button", { cls: "btn big", on: { click: goToTypedPage } }, "انتقال"),
    h("button", { cls: "link", on: { click: () => { jumpOverlay.hidden = true; } } }, "إلغاء")
  );

  const pageNumberBtn = h("button", { cls: "tb", on: { click: () => {
    if (isTask) return; // القفز لصفحة معينة متاح فقط في القراءة الحرة، حتى لا يتجاوز المستخدم ورد اليوم
    jumpInput.value = "";
    jumpOverlay.hidden = false;
    jumpInput.focus();
  } } });

  const themeBtn = h("button", { cls: "tb", "aria-label": "الوضع الليلي", on: { click: () => {
    settings.theme = settings.theme === "night" ? "day" : "night";
    saveSettings();
    syncBars();
  } } });
  const readingModeBtn = h("button", { cls: "tb", on: { click: () => {
    settings.readingMode = !settings.readingMode;
    saveSettings();
    syncBars();
  } } });
  const adjustFontSize = delta => {
    settings.fontScale = Math.min(2.8, Math.max(1.1, +(settings.fontScale + delta).toFixed(1)));
    saveSettings();
  };

  const readerRootEl = h("div", { id: "rd" },
    h("div", { cls: "bar top" },
      h("button", { cls: "tb", on: { click: async () => {
        document.onkeydown = null;
        await flushBookmark();
        viewHome();
      } } }, "رجوع"),
      h("span", {},
        h("button", { cls: "tb", "aria-label": "تصغير الخط", on: { click: () => adjustFontSize(-0.1) } }, "A-"),
        h("button", { cls: "tb", "aria-label": "تكبير الخط", on: { click: () => adjustFontSize(0.1) } }, "A+"),
        themeBtn,
        readingModeBtn
      )
    ),
    pageContainerEl,
    h("div", { cls: "bar bot" },
      h("button", { cls: "tb", on: { click: () => navigate(-1) } }, "→ السابقة"),
      pageNumberBtn,
      h("button", { cls: "tb", on: { click: () => navigate(1) } }, "التالية ←")
    ),
    jumpOverlay
  );

  function syncBars() {
    readerRootEl.classList.toggle("rm", settings.readingMode);
    if (!settings.readingMode) readerRootEl.classList.remove("show");
    themeBtn.textContent = settings.theme === "night" ? "☀" : "🌙";
    readingModeBtn.textContent = settings.readingMode ? "خروج من وضع القراءة" : "وضع القراءة";
  }

  // في وضع "ورد اليوم" لا يمكن تجاوز آخر صفحة مطلوبة ولا الرجوع قبل أول صفحة فيه.
  function navigate(delta) {
    const target = currentPage + delta;
    if (target < 1 || target > CFG.totalPages) return;
    if (isTask && target > plan.end) { toast("انتهى وردك لهذا اليوم"); return; }
    if (isTask && target < plan.start) return;
    showPage(target);
  }

  function endOfTaskPanel() {
    if (!isTask || currentPage !== plan.end || T.tasks.quran.state === "completed") return null;
    const messageEl = h("div", {});
    const update = () => {
      messageEl.textContent = contentOk("quran")
        ? "أتممت ورد القرآن لليوم — اضغط «تم»."
        : "اقرأ هذه الصفحة حتى النهاية.";
    };
    activeTicks.push(update);
    update();
    return h("div", { cls: "endp" }, messageEl, finishButton("quran", "تم"));
  }

  async function showPage(pageNumber, restoreScrollTop) {
    currentPage = pageNumber;
    const myRequestId = ++readerRequestId;
    localStore.set("lastFreePage", pageNumber);
    QP.currentPage = pageNumber;

    clearTimeout(bookmarkSaveTimer);
    bookmarkSaveTimer = setTimeout(flushBookmark, 600);
    pageNumberBtn.textContent = "صفحة " + ar(pageNumber);

    const quranTask = T.tasks.quran;
    if (isTask && quranTask.state === "inProgress") {
      patchTask("quran", { reached: Math.max(quranTask.reached || 0, pageNumber), lastPage: pageNumber })
        .catch(() => toast(SAVE_ERROR_MSG));
    }

    put(pageContainerEl, h("div", { cls: "msg" }, "جارٍ التحميل…"));
    try {
      const ayahs = await getMushafPage(pageNumber);
      if (myRequestId !== readerRequestId) return; // وصل بعد طلب أحدث — يُتجاهل
      activeTicks = [];
      put(pageContainerEl, renderMushafPage(ayahs, pageNumber, endOfTaskPanel()));
      pageContainerEl.scrollTop = restoreScrollTop || 0;
    } catch (err) {
      if (myRequestId !== readerRequestId) return;
      put(pageContainerEl, h("div", { cls: "msg" },
        navigator.onLine ? "تعذر تحميل الصفحة." : "لا يوجد اتصال بالإنترنت.",
        h("br"), h("br"),
        h("button", { cls: "btn ghost", on: { click: () => showPage(pageNumber) } }, "إعادة المحاولة")
      ));
    }
  }

  let touchStartX = 0, touchStartY = 0;
  pageContainerEl.addEventListener("touchstart", e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  pageContainerEl.addEventListener("touchend", e => {
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) navigate(dx < 0 ? 1 : -1);
  }, { passive: true });
  pageContainerEl.addEventListener("click", () => {
    if (settings.readingMode) readerRootEl.classList.toggle("show");
  });
  document.onkeydown = e => {
    if (e.key === "ArrowLeft") navigate(1);
    else if (e.key === "ArrowRight") navigate(-1);
  };

  (async function init() {
    if (isTask) {
      try { await startTask("quran"); } catch (err) { toast(SAVE_ERROR_MSG); }
      const quranTask = T.tasks.quran;
      const reached = quranTask.reached || (plan.start - 1);
      currentPage = (quranTask.lastPage && quranTask.lastPage >= plan.start && quranTask.lastPage <= plan.end)
        ? quranTask.lastPage
        : Math.min(plan.end, Math.max(plan.start, reached + 1));
    } else {
      currentPage = QP.currentPage || localStore.get("lastFreePage", 1);
    }
    mount(readerRootEl);
    syncBars();
    showPage(currentPage, 0);
  })();
}

async function flushBookmark() {
  clearTimeout(bookmarkSaveTimer);
  if (!UID || !QP) return;
  try {
    await update(ref(db, "quranProgress/" + UID), { currentPage: QP.currentPage, lastReadAt: serverNow() });
  } catch (err) {
    console.error("flushBookmark failed", err);
  }
}

function renderMushafPage(ayahs, pageNumber, endPanelEl) {
  const pageEl = h("div", { cls: "mushaf qf" });
  let paragraphEl = null;
  pageEl.append(h("div", { cls: "juz" }, "الجزء " + ar(ayahs[0].juz)));

  ayahs.forEach(a => {
    if (a.numberInSurah === 1) {
      pageEl.append(h("div", { cls: "sn" }, a.surahName));
      if (a.surah !== 1 && a.surah !== 9) {
        const stripped = stripLeadingBasmala(a.text);
        pageEl.append(h("div", { cls: "bsm" }, "﷽"));
        if (stripped !== null) a = Object.assign({}, a, { text: stripped });
      }
      paragraphEl = null;
    }
    if (!paragraphEl) {
      paragraphEl = h("p", { cls: "ay" });
      pageEl.append(paragraphEl);
    }
    paragraphEl.append(a.text + " ﴿" + ar(a.numberInSurah) + "﴾ ");
  });

  pageEl.append(h("div", { cls: "juz" }, ar(pageNumber)));
  if (endPanelEl) pageEl.append(endPanelEl);
  return pageEl;
}

/* ======================================================================
   PRAYER TIMES (اختياري — Aladhan API؛ فشل الطلب لا يكسر الصفحة الرئيسية)
   ====================================================================== */
const prayerTimesCache = {};
async function getPrayerTimes(date) {
  if (prayerTimesCache[date]) return prayerTimesCache[date];
  try {
    const [year, month, day] = date.split("-");
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const url = `https://api.aladhan.com/v1/timings/${day}-${month}-${year}?latitude=30.0444&longitude=31.2357&method=5`;
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    const body = await response.json();
    if (body.code !== 200) throw new Error("bad-response");
    const t = body.data.timings;
    return (prayerTimesCache[date] = { fajr: t.Fajr, dhuhr: t.Dhuhr, asr: t.Asr, maghrib: t.Maghrib, isha: t.Isha });
  } catch (err) {
    return null;
  }
}
function parseHHMMToSeconds(value) {
  const match = /(\d{1,2}):(\d{2})/.exec(value || "");
  return match ? (Number(match[1]) * 3600 + Number(match[2]) * 60) : null;
}
// يُعيد الوقت المتبقي للصلاة القادمة بالثواني (وليس بالدقائق فقط)، حتى يُعرض العدّاد ساعات:دقائق:ثوانٍ ويتحدث كل ثانية.
function nextPrayer(times) {
  if (!times) return null;
  const nowSeconds = cairoSecondsOfDay();
  const list = [["الفجر", times.fajr], ["الظهر", times.dhuhr], ["العصر", times.asr], ["المغرب", times.maghrib], ["العشاء", times.isha]]
    .map(([name, t]) => ({ name, seconds: parseHHMMToSeconds(t) }))
    .filter(p => p.seconds !== null);
  if (!list.length) return null;
  for (const prayer of list) {
    if (prayer.seconds > nowSeconds) return { name: prayer.name, remaining: prayer.seconds - nowSeconds };
  }
  return { name: list[0].name, remaining: 86400 - nowSeconds + list[0].seconds, tomorrow: true };
}

async function viewHome() {

function renderHome() {
  if (currentView !== "home") return;

  const plan = T.plan;
  const streak = S || INITIAL_STREAK;
  const percentRead = Math.floor((QP.pagesRead / CFG.totalPages) * 100);
  const allDone = KINDS.every(k => stateOf(k) === "completed");
  const stateLabel = { available: "لم تبدأ بعد", inProgress: "قيد التنفيذ", completed: "✓ تم", locked: "مغلقة" };

  document.body.classList.toggle("friday-mode", isFriday());

  function actionButton(kind, onClick) {
    const state = stateOf(kind);
    const button = h("button", {
      cls: "btn" + (state === "completed" ? " done-btn" : " ghost"),
      on: { click: onClick }
    }, state === "completed" ? "تم ✓" : state === "inProgress" ? "متابعة" : "ابدأ");
    button.disabled = state === "locked";
    return button;
  }

  function subtitleFor(kind) {
    const state = stateOf(kind);
    if (kind === "quran") {
      return state === "completed" ? "✓ تم" : pagesLabel(plan.pages) + " · ص " + ar(plan.start) + " — ص " + ar(plan.end);
    }
    if (kind === "memorize") {
      if (state === "completed") return "✓ تم حفظ سورة " + plan.surahName;
      const progressSuffix = state === "inProgress" ? " — " + ar(T.tasks.memorize.recitedCount || 0) + "/" + ar(CFG.memorizeRepeats) : "";
      return "سورة " + plan.surahName + progressSuffix;
    }
    if (state === "completed") return "✓ تم";
    if (state === "inProgress") {
      const { done, need } = adhkarProgress(kind);
      return "قيد التنفيذ " + ar(done) + "/" + ar(need);
    }
    return stateLabel[state];
  }

  function taskRow(icon, title, kind, onClick) {

      h("div", {}, h("b", {}, icon + " " + title), h("span", { cls: "mute" }, subtitleFor(kind))),
      actionButton(kind, onClick)
    );

  const prayerBarSlot = h("div", { style: "width:100%" });

  const fridayItems = [
    ["📖", "اقرأ سورة الكهف — «من قرأها يوم الجمعة أضاء له من النور ما بين الجمعتين»"],
    ["ﷺ", "أكثِر من الصلاة على النبي ﷺ — «فأكثروا عليّ من الصلاة فيه»"],
    ["🕌", "تحرّى ساعة الإجابة — آخر ساعة قبل المغرب"],
    ["🛁", "اغتسل وتطيّب والبس أحسن ثيابك"],
    ["🤲", "بكّر إلى المسجد وأنصت للخطبة"],
    ["📿", "«سبحان الله وبحمده» مائة مرة — غُفرت ذنوبه"]
  ];
  const fridayBannerEl = isFriday() ? h("div", { cls: "friday-banner" },
    h("div", { cls: "fb-title" }, "﷽ يوم الجمعة"),
    ...fridayItems.map(([icon, text]) => h("div", { cls: "fb-item" }, icon + " " + text)),
    h("div", { cls: "fb-hadith" }, "«إن من أفضل أيامكم يوم الجمعة، فأكثروا عليّ من الصلاة فيه»")
  ) : null;

    h("div", { cls: "mute" }, "أهلًا " + USERS[UID]),
    h("h1", {}, "وردك اليوم"),

    h("div", { style: "width:100%" },
      taskRow("☀️", "أذكار الصباح", "morning", () => viewAdhkar("morning")),
      taskRow("📖", "ورد القرآن", "quran", () => viewReader("task")),
      taskRow("📚", "الحفظ", "memorize", () => viewMemorize()),
      taskRow("🌙", "أذكار المساء", "evening", () => viewAdhkar("evening"))
    ),
    h("div", { cls: "prog" },
      h("div", { cls: "bar0" }, h("i", { style: "width:" + percentRead + "%" })),
      h("div", { cls: "mute" }, "ختمة " + ar(QP.khatmah) + " · " + ar(QP.pagesRead) + " / " + ar(CFG.totalPages) + " · " + ar(percentRead) + "٪")
    ),
    h("div", { cls: "mute" }, "حفظت " + ar((MEM && MEM.count) || 0) + " سورة حتى الآن"),
    h("button", { cls: "link", on: { click: () => viewReader("free") } }, "قراءة حرة"),
    h("div", { style: "font-size:1.1rem", "aria-label": "الستريك المشترك" },
      h("span", { cls: "fl" + (streak.status === "red" ? " red" : "") }, "🔥"), " " + ar(streak.count)
    ),
    allDone ? h("div", { cls: "day-complete" }, "✓ تم ورد اليوم بحمد الله") : null,
    allDone ? countdownEl : null
  ];

  if (UID === RESET_ALLOWED_UID) {
    nodes.push(h("button", { cls: "btn danger", on: { click: resetEverything } }, "إعادة ضبط كل البيانات"));
  }

  mount(h("div", { cls: "screen" }, ...nodes));

  if (allDone) { activeTicks.push(updateCountdown); updateCountdown(); }

  getPrayerTimes(dateKey()).then(times => {
    if (currentView !== "home") return; // المستخدم غادر الشاشة قبل وصول الرد
    const updatePrayerBar = () => {
      const next = nextPrayer(times);
      if (next) {
        put(prayerBarSlot, h("div", { cls: "prayer-bar" },
          h("span", {}, "🕌 " + next.name + (next.tomorrow ? " (غدًا)" : "")),
          h("b", {}, formatClock(next.remaining))
        ));
      }
    };
    activeTicks.push(updatePrayerBar);
    updatePrayerBar();
  });
}

function beginLogin(candidateUid) {
  const passwordInput = h("input", { type: "password", placeholder: "كلمة المرور", autocomplete: "current-password" });
  const errorEl = h("div", { cls: "err" });
  const attempt = () => {
    if (passwordInput.value.trim() === PASSWORDS[candidateUid]) {
      UID = candidateUid;
      localStore.set("uid", UID);
      start();
    } else {
      errorEl.textContent = "كلمة المرور غير صحيحة";
    }
  };
  passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
  mount(h("div", { cls: "screen" },
    h("h1", {}, "وردي"),
    h("div", { cls: "mute" }, USERS[candidateUid]),
    passwordInput,
    errorEl,
    h("button", { cls: "btn big", on: { click: attempt } }, "دخول"),
    h("button", { cls: "link", on: { click: viewPicker } }, "رجوع")
  ));
}

/* ======================================================================
   BOOT / LOADING / ERROR VIEWS
   ====================================================================== */
function loadingView() {
  mount(h("div", { cls: "screen" }, h("div", { cls: "mute" }, "جارٍ التحميل…")));
}

function errorView(onRetry) {
  mount(h("div", { cls: "screen" },
    h("div", { cls: "mute" }, CONNECT_ERROR_MSG),
    h("button", { cls: "btn", on: { click: onRetry } }, "إعادة المحاولة")
  ));
}

async function start() {
  applySettings();
  loadingView();
  document.body.classList.toggle("friday-mode", isFriday());
  try {
    await withTimeout(waitForServerOffset(), CFG.bootTimeoutMs, "offset");
    await withTimeout(loadAccountData(), CFG.bootTimeoutMs, "load");
    await withTimeout(evaluateStreak(), CFG.bootTimeoutMs, "evaluate");
    const openView = sessionStorage.getItem("openView"); // الرجوع لنفس الشاشة بعد Refresh
    if (openView === "quran" || openView === "free") {
      viewReader(openView === "quran" ? "task" : "free");
    } else if (openView === "memorize") {
      viewMemorize();
    } else if (openView === "morning" || openView === "evening") {
      viewAdhkar(openView);
    } else {
      viewHome();
    }
  } catch (err) {
    console.error("start() failed", err);
    errorView(() => start());
  }
}

const savedUid = localStore.get("uid", null);
if (savedUid && USERS[savedUid]) {
  UID = savedUid;
  start();
} else {
  viewPicker();
}

// إعادة تقييم دورية (كل ٣٠ ثانية) لضمان تحديث الستريك واليوم دون الحاجة لإعادة فتح الصفحة يدويًا.
setInterval(async () => {
  if (!UID || !T) return;
  try {
    if (T.date !== dateKey()) {
      await evaluateStreak();
      if (currentView === "home") viewHome();
    } else if (currentView === "home") {
      await evaluateStreak();
    }
  } catch (err) {
    console.error("periodic refresh failed", err);
  }
}, 30000);

// عند إخفاء الصفحة أو إغلاقها: احفظ العلامة المرجعية، وأوقف أي تسجيل صوتي جارٍ بأمان (لا يبقى الميكروفون مفتوحًا).
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    flushBookmark();
    if (activeRecorderTeardown) activeRecorderTeardown();
  }
});
window.addEventListener("pagehide", () => {
  flushBookmark();
  if (activeRecorderTeardown) activeRecorderTeardown();
});
</script>
