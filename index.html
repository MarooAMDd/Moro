<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وردي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--fg:#1e2a25;--mute:#7f7b6c;--line:#e1dbc9;--acc:#2f5d50;--gold:#b8923a;--fs:1.7}
[data-theme=night]{--bg:#12161a;--fg:#e1dbc8;--mute:#8a8778;--line:#252b2f;--acc:#8fbfae;--gold:#d2ae5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{height:100%;overflow:auto}
h1{font-weight:700;font-size:1.8rem;margin:0}
.screen{min-height:100%;max-width:26rem;margin:0 auto;padding:2rem 1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.mute{color:var(--mute);font-size:.92rem}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.9rem 0;border-bottom:1px solid var(--line);text-align:right}
.row b{font-weight:500;font-size:1.08rem;display:block}
.prog{width:100%}.bar0{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:.4rem}.bar0 i{display:block;height:100%;background:var(--acc)}
.err{color:#b3473a;min-height:1.3em;font-size:.9rem}
input{font:inherit;width:100%;padding:.75rem;border:1px solid var(--line);border-radius:.6rem;background:transparent;color:var(--fg);text-align:center}
.btn{font:inherit;min-height:2.75rem;background:var(--acc);color:var(--bg);border:0;border-radius:.7rem;padding:.6rem 1.3rem;cursor:pointer;white-space:nowrap}
.btn.big{font-size:1.08rem;padding:.75rem 1.8rem}.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{background:var(--line);color:var(--mute);cursor:default}.btn.gold:disabled{background:var(--gold);color:#fff;opacity:.85}
.seg{display:flex;gap:.6rem;width:100%}.seg .btn{flex:1}
.link{font:inherit;font-size:.9rem;min-height:2.5rem;background:none;border:0;color:var(--mute);cursor:pointer}
.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem 1rem;border-radius:.6rem;font-size:.9rem;z-index:9}
.fl{display:inline-block;transition:filter .3s;filter:grayscale(1) opacity(.55)}.fl.red{filter:drop-shadow(0 0 4px rgba(214,90,60,.55))}
.qf{font-family:"Amiri Quran","Scheherazade New","Traditional Arabic",serif}
.dk{width:100%;padding:1rem 0}.dk .t{line-height:2.4;font-size:1.45rem}.dk .s{color:var(--mute);font-size:.85rem;margin-top:.5rem}
.nav{display:flex;gap:.6rem;width:100%;justify-content:space-between}
#rd{position:relative;display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;background:var(--bg);color:var(--mute);z-index:2;transition:opacity .2s}
.rm .bar{position:absolute;left:0;right:0;opacity:0;pointer-events:none}.rm .top{top:0}.rm .bot{bottom:0}.rm.show .bar{opacity:1;pointer-events:auto}
.tb{font:inherit;font-size:.92rem;min-height:2.75rem;background:none;border:0;color:var(--mute);padding:.4rem .5rem;cursor:pointer}
.top{border-bottom:1px solid var(--line)}.bot{border-top:1px solid var(--line)}
#pg{flex:1;overflow-y:auto;padding:.8rem 1.3rem 3rem}.rm #pg{padding-top:1.6rem}
.mushaf{max-width:38rem;margin:0 auto;font-size:calc(var(--fs)*1rem);line-height:2.5}.rm .mushaf{font-size:calc((var(--fs) + .25)*1rem)}
.ay{margin:0;text-align:justify;text-align-last:center}
.juz{text-align:center;color:var(--mute);font-size:.7em;line-height:2}
.sn{text-align:center;color:var(--acc);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:1rem 0 .5rem;font-size:1.05em;line-height:2.2}.rm .sn{color:var(--mute);border-color:transparent}
.bsm{text-align:center}.msg{text-align:center;color:var(--mute);margin-top:28vh}
.endp{text-align:center;margin:1.5rem 0;font-family:Tajawal,sans-serif;font-size:1rem;line-height:1.9}
.jump{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:2rem}.jump input{max-width:16rem}
.mem{width:100%;text-align:center;padding:1rem 0}
.mem .sn2{font-family:"Amiri Quran",serif;font-size:1.6rem;color:var(--acc);margin-bottom:.5rem}
.mem .ays{font-family:"Amiri Quran",serif;font-size:1.15rem;line-height:2.3;max-height:35vh;overflow-y:auto;padding:.5rem;border:1px solid var(--line);border-radius:.6rem;text-align:justify;text-align-last:center}
.rec-area{width:100%;margin:1rem 0;padding:1rem;border:1px dashed var(--line);border-radius:.7rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.rec-btn{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--acc);color:var(--bg);border:0;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rec-btn.recording{background:#b3473a;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.rec-timer{font-size:1.3rem;font-weight:600;color:var(--acc)}
.rec-actions{display:flex;gap:.6rem;justify-content:center;width:100%}
.prayer-bar{width:100%;padding:.6rem .8rem;background:var(--line);border-radius:.6rem;font-size:.9rem;color:var(--fg);display:flex;justify-content:space-between;align-items:center}
.prayer-bar b{color:var(--acc)}
.pick{width:100%;padding:1.5rem 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, update, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ===== CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyDcZQLLUtWL8UGjib9Nwqcu-gs84hXTWyk", authDomain: "omar-1-fcd61.firebaseapp.com",
  databaseURL: "https://omar-1-fcd61-default-rtdb.firebaseio.com", projectId: "omar-1-fcd61",
  storageBucket: "omar-1-fcd61.firebasestorage.app", messagingSenderId: "1098323069112",
  appId: "1:1098323069112:web:0e36a35eae752e53ac4c4d", measurementId: "G-2ZJMPDMCTP"
};
const TASK_DURATIONS = { morning: 15 * 60, quran: 5 * 60, evening: 10 * 60, memorize: 3 * 60 };
const CFG = { tz: "Africa/Cairo", pages: 604, plan: [4, 6, 8, 10, 12], rescues: 3, pair: "pair_001", quranApi: "https://api.alquran.cloud/v1/" };
const USERS = { user_omar: "Omar", user_maryam: "Mariam" }, MEMBERS = Object.keys(USERS);
const KINDS = ["morning", "quran", "evening", "memorize"];

// ===== SURAHS LIST =====
const SHORT_SURAHS = [
  { n: 1,  name: "الفاتحة" }, { n: 103, name: "العصر" }, { n: 108, name: "الكوثر" },
  { n: 110, name: "النصر" }, { n: 112, name: "الإخلاص" }, { n: 113, name: "الفلق" },
  { n: 114, name: "الناس" }, { n: 105, name: "الفيل" }, { n: 106, name: "قريش" },
  { n: 107, name: "الماعون" }, { n: 109, name: "الكافرون" }, { n: 111, name: "المسد" },
  { n: 102, name: "التكاثر" }, { n: 101, name: "القارعة" }, { n: 100, name: "العاديات" },
  { n: 99,  name: "الزلزلة" }, { n: 97,  name: "القدر" }, { n: 95,  name: "التين" },
  { n: 94,  name: "الشرح" }, { n: 93,  name: "الضحى" }, { n: 92,  name: "الليل" },
  { n: 91,  name: "الشمس" }, { n: 90,  name: "البلد" }, { n: 89,  name: "الفجر" },
  { n: 88,  name: "الغاشية" }, { n: 87,  name: "الأعلى" }, { n: 86,  name: "الطارق" },
  { n: 85,  name: "البروج" }, { n: 84,  name: "الانشقاق" }, { n: 83,  name: "المطففين" }
];

const app = initializeApp(firebaseConfig), db = getDatabase(app);

// ===== LOCAL STATE =====
const local = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const settings = Object.assign({ fs: 1.7, theme: "day", rm: false }, local.get("settings", {}));
const applySettings = () => { document.documentElement.style.setProperty("--fs", settings.fs); document.documentElement.setAttribute("data-theme", settings.theme); };
const saveSettings = () => { local.set("settings", settings); applySettings(); };

// ===== TIME =====
let OFFSET = 0;
onValue(ref(db, ".info/serverTimeOffset"), s => { OFFSET = s.val() || 0; });
const now = () => Date.now() + OFFSET;
const dateKey = () => new Intl.DateTimeFormat("en-CA", { timeZone: CFG.tz }).format(new Date(now()));
const addDays = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const waitOffset = () => new Promise(r => { const t0 = Date.now(), i = setInterval(() => { if (OFFSET !== 0 || Date.now() - t0 > 3000) { clearInterval(i); r(); } }, 100); });
const isFriday = () => new Date(now()).getDay() === 5;

// ===== PRAYER TIMES (Aladhan API) =====
const prayerCache = {};
async function getPrayerTimes(date) {
  if (prayerCache[date]) return prayerCache[date];
  try {
    const d = new Date(date + "T12:00:00Z");
    const dd = String(d.getUTCDate()).padStart(2, "0"), mm = String(d.getUTCMonth() + 1).padStart(2, "0"), yyyy = d.getUTCFullYear();
    const url = `https://api.aladhan.com/v1/timings/${dd}-${mm}-${yyyy}?latitude=30.0444&longitude=31.2357&method=5`;
    const r = await fetch(url), j = await r.json();
    if (j.code !== 200) throw 0;
    const t = j.data.timings;
    const out = { fajr: t.Fajr, sunrise: t.Sunrise, dhuhr: t.Dhuhr, asr: t.Asr, maghrib: t.Maghrib, isha: t.Isha };
    prayerCache[date] = out;
    return out;
  } catch (e) { return null; }
}
function nextPrayer(times) {
  if (!times) return null;
  const nowMin = new Date(now()).getHours() * 60 + new Date(now()).getMinutes();
  const list = [
    { name: "الفجر", time: times.fajr }, { name: "الظهر", time: times.dhuhr },
    { name: "العصر", time: times.asr }, { name: "المغرب", time: times.maghrib }, { name: "العشاء", time: times.isha }
  ];
  for (const p of list) {
    const [h, m] = p.time.split(":").map(Number);
    if (h * 60 + m > nowMin) return { ...p, remaining: h * 60 + m - nowMin };
  }
  const [h, m] = list[0].time.split(":").map(Number);
  return { ...list[0], remaining: (24 * 60 - nowMin) + h * 60 + m, tomorrow: true };
}

// ===== HELPERS =====
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const pagesTxt = n => n === 1 ? "صفحة واحدة" : n === 2 ? "صفحتان" : ar(n) + " صفحات";
const fmt = s => ar(String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.ceil(s % 60) % 60).padStart(2, "0"));
const fmtMin = m => ar(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
function h(tag, a = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in a) { if (k === "on") for (const ev in a.on) e.addEventListener(ev, a.on[ev]); else if (k === "cls") e.className = a[k]; else e.setAttribute(k, a[k]); }
  kids.flat().filter(x => x != null && x !== false).forEach(x => e.append(x)); return e;
}
let ticks = [], view = "", busy = false;
const mount = n => { ticks = []; document.querySelector("#app").replaceChildren(n); };
const toast = t => { const e = h("div", { cls: "toast" }, t); document.body.append(e); setTimeout(() => e.remove(), 3500); };
setInterval(() => ticks.forEach(f => f()), 1000);

// ===== STATE =====
let UID = null, QP = null, T = null, S = null, streakBound = false, MEM = null;
const INIT_STREAK = { count: 0, status: "gray", fails: 0, rescues: CFG.rescues, lastEvaluated: null, rescueNotice: null };
const taskPath = k => `dailyTasks/${UID}/${T.date}/tasks/${k}`;
async function patchTask(k, o) { await update(ref(db, taskPath(k)), o); Object.assign(T.tasks[k], o); }
const stateOf = k => T.date !== dateKey() ? "locked" : T.tasks[k].state;

async function load() {
  const qref = ref(db, "quranProgress/" + UID);
  QP = (await get(qref)).val();
  if (!QP) { QP = { currentPage: 1, khatmah: 1, frontier: 1, pagesRead: 0, tasksDone: 0, lastReadAt: 0 }; await set(qref, QP); }
  const mref = ref(db, "memorize/" + UID);
  MEM = (await get(mref)).val();
  if (!MEM) { MEM = { completed: {}, count: 0 }; await set(mref, MEM); }
  const date = dateKey(), dref = ref(db, `dailyTasks/${UID}/${date}`);
  await runTransaction(dref, cur => {
    if (cur && cur.plan) return cur;
    const pages = CFG.plan[QP.tasksDone % CFG.plan.length];
    const s = SHORT_SURAHS[Math.floor(now() / 86400000) % SHORT_SURAHS.length];
    return { plan: { start: QP.frontier, pages, end: Math.min(CFG.pages, QP.frontier + pages - 1), khatmah: QP.khatmah, surah: s.n, surahName: s.name },
             tasks: { morning: { state: "available" }, quran: { state: "available" }, evening: { state: "available" }, memorize: { state: "available" } } };
  });
  const d = (await get(dref)).val();
  T = { date, plan: d.plan, tasks: d.tasks };
  for (const k of KINDS) T.tasks[k] = Object.assign({ state: "available" }, T.tasks[k]);
  if (!streakBound) { streakBound = true; onValue(ref(db, "streak/" + CFG.pair), s => { S = Object.assign({}, INIT_STREAK, s.val()); if (view === "home") renderHome(); }); }
  S = S || INIT_STREAK;
}

// ===== STREAK =====
async function evaluate() {
  const today = dateKey(), sref = ref(db, "streak/" + CFG.pair), cur0 = Object.assign({}, INIT_STREAK, (await get(sref)).val());
  const last0 = cur0.lastEvaluated || addDays(today, -1), days = {};
  for (let d = addDays(last0, 1), n = 0; d < today && n < 400; d = addDays(d, 1), n++) days[d] = (await get(ref(db, `days/${CFG.pair}/${d}`))).val() || {};
  await runTransaction(sref, cur => {
    cur = Object.assign({}, INIT_STREAK, cur);
    let last = cur.lastEvaluated || addDays(today, -1);
    for (let d = addDays(last, 1); d < today; d = addDays(d, 1)) {
      if (!days[d]) return;
      if (MEMBERS.every(m => days[d][m] === true)) { cur.count++; cur.status = "red"; cur.fails = 0; }
      else {
        cur.status = "gray"; cur.fails++;
        if (cur.fails >= 2) {
          if (cur.rescues > 0) { cur.rescues--; cur.fails = 0; }
          else { cur.count = 0; cur.fails = 0; }
        }
      }
      last = d;
    }
    cur.lastEvaluated = last; return cur;
  });
}

// ===== TASK RULES =====
const N = k => k === "memorize" ? 1 : ADHKAR[k].length;
const elapsed = k => (now() - (T.tasks[k].startedAt || now())) / 1000;
const contentOk = k => {
  const t = T.tasks[k];
  if (k === "quran") return t.reached >= T.plan.end && t.endSeen === true;
  if (k === "memorize") return t.recitedCount >= 3 && t.recorded === true;
  return (t.step || 0) >= N(k) - 1;
};
const canFinish = k => T.tasks[k].state === "inProgress" && contentOk(k) && elapsed(k) >= TASK_DURATIONS[k];
async function startTask(k) {
  if (T.tasks[k].state !== "available") return;
  if (k === "quran") return patchTask(k, { state: "inProgress", startedAt: now(), reached: T.plan.start - 1, endSeen: false });
  if (k === "memorize") return patchTask(k, { state: "inProgress", startedAt: now(), recitedCount: 0, recorded: false });
  return patchTask(k, { state: "inProgress", startedAt: now(), step: 0 });
}
async function completeTask(k) {
  if (busy) return; if (T.tasks[k].state === "completed") return viewHome();
  if (!canFinish(k)) return;
  busy = true;
  try {
    if (k === "quran") {
      await runTransaction(ref(db, "quranProgress/" + UID), p => {
        p = p || QP; if (p.frontier !== T.plan.start) return;
        p.tasksDone++; p.lastReadAt = now();
        if (T.plan.end >= CFG.pages) { p.khatmah++; p.frontier = 1; p.pagesRead = 0; p.currentPage = 1; }
        else { p.frontier = T.plan.end + 1; p.pagesRead = T.plan.end; }
        return p;
      });
      QP = (await get(ref(db, "quranProgress/" + UID))).val();
    }
    if (k === "memorize") {
      await runTransaction(ref(db, "memorize/" + UID), m => {
        m = m || MEM;
        if (!m.completed) m.completed = {};
        if (!m.completed[T.plan.surah]) { m.completed[T.plan.surah] = T.date; m.count = (m.count || 0) + 1; }
        return m;
      });
      MEM = (await get(ref(db, "memorize/" + UID))).val();
    }
    await patchTask(k, { state: "completed", completedAt: now() });
    if (KINDS.every(x => T.tasks[x].state === "completed")) await set(ref(db, `days/${CFG.pair}/${T.date}/${UID}`), true);
    viewHome();
  } catch (e) { toast("تعذر حفظ التقدم، حاول مرة أخرى."); } finally { busy = false; }
}
function finisher(k, label) {
  const b = h("button", { cls: "btn big", "aria-label": label }, label); b.disabled = true;
  const upd = () => {
    const ok = contentOk(k), rem = TASK_DURATIONS[k] - elapsed(k);
    b.disabled = !(ok && rem <= 0); b.className = "btn big" + (b.disabled && ok ? " gold" : "");
    b.textContent = ok && rem > 0 ? label + " · " + fmt(rem) : label;
  };
  b.onclick = () => completeTask(k); ticks.push(upd); upd(); return b;
}

// ===== ADHKAR =====
const TASBIH = { t: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", s: "مائة مرة — رواه مسلم" };
const BISM = { t: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", s: "ثلاث مرات — رواه أبو داود والترمذي" };
const KURSI = { q: ["ayah/2:255"], s: "آية الكرسي — البقرة ٢٥٥" }, MUAW = { q: ["surah/112", "surah/113", "surah/114"], s: "الإخلاص والفلق والناس، ثلاث مرات" };
const ADHKAR = {
  morning: [KURSI, MUAW,
    { t: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", s: "رواه مسلم" },
    { t: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", s: "رواه الترمذي" }, BISM, TASBIH],
  evening: [KURSI, MUAW,
    { t: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", s: "رواه مسلم" },
    { t: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ", s: "رواه الترمذي" }, BISM, TASBIH]
};
const qcache = {}, noBasmala = t => t.split(" ").slice(4).join(" ");

async function viewAdhkar(k) {

    if (x.q) quranText(x.q).then(v => { if (ADHKAR[k][i] === x) tx.textContent = v; }).catch(() => { tx.textContent = "تعذر تحميل النص."; });

// ===== MEMORIZE WITH RECORDING =====
async function viewMemorize() {
  view = "memorize"; sessionStorage.setItem("open", "memorize");
  try { await startTask("memorize"); } catch (e) {}
  const s = T.plan.surah, name = T.plan.surahName;
  const t = T.tasks.memorize, done = t.state === "completed";

  const aysEl = h("div", { cls: "ays" }, "جارٍ التحميل…");
  const recTimer = h("div", { cls: "rec-timer" }, "");
  const recBtn = h("button", { cls: "rec-btn" }, "🎙️");
  const playBtn = h("button", { cls: "btn", style: "display:none" }, "▶️ اسمع");
  const stopBtn = h("button", { cls: "btn", style: "display:none" }, "⏹️ إيقاف");
  const deleteBtn = h("button", { cls: "btn ghost", style: "display:none" }, "🗑️ امسح");
  const recStatus = h("div", { cls: "mute" }, "اضغط الميكروفون لبدء التسجيل");
  const recActions = h("div", { cls: "rec-actions" }, playBtn, stopBtn, deleteBtn);
  const fin = h("div", { style: "width:100%" });

  let mediaRecorder = null, chunks = [], audioURL = null, timerInt = null, seconds = 0;

  const resetRec = () => {
    if (audioURL) URL.revokeObjectURL(audioURL);
    audioURL = null; chunks = []; seconds = 0;
    if (timerInt) { clearInterval(timerInt); timerInt = null; }
    recTimer.textContent = "";
    recBtn.classList.remove("recording"); recBtn.textContent = "🎙️";
    playBtn.style.display = "none"; stopBtn.style.display = "none"; deleteBtn.style.display = "none";
    recActions.style.display = "flex";
    recStatus.textContent = t.recitedCount >= 3 ? "يمكنك التسجيل للمراجعة" : "اضغط الميكروفون لبدء التسجيل";
  };

  const startRec = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      chunks = []; seconds = 0;
      mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        const blob = new Blob(chunks, { type: "audio/webm" });
        if (blob.size > 0) {
          audioURL = URL.createObjectURL(blob);
          playBtn.style.display = "block"; deleteBtn.style.display = "block";
          recStatus.textContent = "التسجيل جاهز — اسمع نفسك";
          if (!t.recorded) patchTask("memorize", { recorded: true }).then(() => upd()).catch(() => {});
        } else { recStatus.textContent = "التسجيل فاضي، جرب تاني"; }
        if (timerInt) { clearInterval(timerInt); timerInt = null; }
      };
      mediaRecorder.start(250);
      recBtn.classList.add("recording"); recBtn.textContent = "⏹️";
      stopBtn.style.display = "block"; playBtn.style.display = "none"; deleteBtn.style.display = "none";
      recStatus.textContent = "جاري التسجيل…";
      timerInt = setInterval(() => { seconds++; recTimer.textContent = fmt(seconds); }, 1000);
    } catch (e) {
      recStatus.textContent = "لم يتم السماح بالوصول للميكروفون";
      toast("الميكروفون غير متاح");
    }
  };
  const stopRec = () => { if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop(); };
  const playRec = () => { if (audioURL) new Audio(audioURL).play(); };
  const delRec = () => { resetRec(); };

  recBtn.onclick = () => { if (mediaRecorder && mediaRecorder.state === "recording") stopRec(); else startRec(); };
  stopBtn.onclick = stopRec;
  playBtn.onclick = playRec;
  deleteBtn.onclick = delRec;

  const cntBtn = h("button", { cls: "btn big" }, "قرأت السورة مرة");
  const resetBtn = h("button", { cls: "btn ghost" }, "إعادة العدّ");
  const btns = h("div", { cls: "seg" }, cntBtn, resetBtn);
  const upd = () => {
    const c = t.recitedCount || 0;
    cntBtn.disabled = done || c >= 3;
    resetBtn.disabled = done || c === 0;
    const ready = (t.recitedCount || 0) >= 3 && t.recorded;
    fin.replaceChildren(!done && ready ? finisher("memorize", "تم الحفظ") : "");
    recStatus.textContent = done ? "✓ تم حفظ هذه السورة" : (t.recorded ? "✓ تم التسجيل" : "اضغط الميكروفون لبدء التسجيل");
  };
  cntBtn.onclick = async () => { if (done) return; const c = Math.min(3, (t.recitedCount || 0) + 1); try { await patchTask("memorize", { recitedCount: c }); } catch (e) {} upd(); };
  resetBtn.onclick = async () => { try { await patchTask("memorize", { recitedCount: 0 }); } catch (e) {} upd(); };
  ticks.push(upd); upd();

  quranText(["surah/" + s]).then(v => { aysEl.textContent = v; }).catch(() => { aysEl.textContent = "تعذر تحميل السورة."; });

  mount(h("div", { cls: "screen", style: "justify-content:flex-start" },
    h("div", { cls: "mute" }, "📚 ورد الحفظ اليومي"),
    h("div", { cls: "mem" },
      h("div", { cls: "sn2" }, "سورة " + name),
      aysEl
    ),
    h("div", { cls: "rec-area" }, recTimer, recBtn, recStatus, recActions),
    h("div", { cls: "mute", style: "margin-top:.5rem" }, "اقرأها ٣ مرات، وسجّل صوتك للمراجعة"),
    btns, fin,
    h("button", { cls: "link", on: { click: () => { resetRec(); viewHome(); } } }, "رجوع")
  ));
}

// ===== USER PICKER =====

}
function pickUser(id) { UID = id; local.set("uid", id); start(); }

const loadingView = () => mount(h("div", { cls: "screen" }, h("div", { cls: "mute" }, "جارٍ التحميل…")));
const errorView = (msg) => mount(h("div", { cls: "screen" }, h("div", { cls: "mute" }, "تعذر الاتصال بالخادم."), msg ? h("div", { cls: "err" }, msg) : null,
  h("button", { cls: "btn", on: { click: start } }, "إعادة المحاولة"),

}

// ===== QURAN READER =====
let saveT = 0;
const pageCache = async n => { const k = "qp" + n, c = local.get(k, null); if (c) return c;
  const a = (await fetchJson(CFG.quranApi + "page/" + n + "/quran-uthmani")).ayahs.map(x => [x.surah.number, x.surah.name, x.numberInSurah, x.text, x.juz]); if (!a.length) throw 0; local.set(k, a); return a; };
function viewReader(mode) {
  view = "reader"; sessionStorage.setItem("open", mode === "task" ? "quran" : "free");
  const task = mode === "task", p = T.plan;
  let cur, seq = 0, st = 0;
  const init = async () => {
    if (task) { try { await startTask("quran"); } catch (e) {} cur = Math.min(p.end, Math.max(p.start, T.tasks.quran.reached || p.start)); }
    else cur = QP.currentPage || local.get("lp", 1);
    mount(rd); sync(); show(cur, 0);
  };
  const pg = h("div", { id: "pg" });
  const jIn = h("input", { type: "number", min: 1, max: CFG.pages, inputmode: "numeric", placeholder: "رقم الصفحة" });
  const jGo = () => { const n = parseInt(jIn.value, 10); jump.hidden = true; if (n >= 1 && n <= CFG.pages) show(n); };
  jIn.addEventListener("keydown", e => { if (e.key === "Enter") jGo(); });
  const jump = h("div", { cls: "jump", hidden: "" }, h("div", {}, "الانتقال إلى صفحة"), jIn, h("button", { cls: "btn big", on: { click: jGo } }, "انتقال"), h("button", { cls: "link", on: { click: () => { jump.hidden = true; } } }, "إلغاء"));
  const pgNum = h("button", { cls: "tb", on: { click: () => { if (task) return; jIn.value = ""; jump.hidden = false; jIn.focus(); } } });
  const bTheme = h("button", { cls: "tb", on: { click: () => { settings.theme = settings.theme === "night" ? "day" : "night"; saveSettings(); sync(); } } });
  const bRm = h("button", { cls: "tb", on: { click: () => { settings.rm = !settings.rm; saveSettings(); sync(); } } });
  const fs = d => { settings.fs = Math.min(2.8, Math.max(1.1, +(settings.fs + d).toFixed(1))); saveSettings(); };
  const rd = h("div", { id: "rd" },
    h("div", { cls: "bar top" }, h("button", { cls: "tb", on: { click: async () => { document.onkeydown = null; await flushBookmark(); viewHome(); } } }, "رجوع"),
      h("span", {}, h("button", { cls: "tb", on: { click: () => fs(-0.1) } }, "A-"), h("button", { cls: "tb", on: { click: () => fs(0.1) } }, "A+"), bTheme, bRm)),
    pg, h("div", { cls: "bar bot" }, h("button", { cls: "tb", on: { click: () => go(-1) } }, "→ السابقة"), pgNum, h("button", { cls: "tb", on: { click: () => go(1) } }, "التالية ←")), jump);
  function sync() { rd.classList.toggle("rm", settings.rm); if (!settings.rm) rd.classList.remove("show"); bTheme.textContent = settings.theme === "night" ? "☀" : "🌙"; bRm.textContent = settings.rm ? "خروج من وضع القراءة" : "وضع القراءة"; }
  const go = (d, swipe) => {
    const n = cur + d;
    if (n < 1 || n > CFG.pages) return;
    if (task && (n < p.start || n > p.end)) { toast("انتهى وردك لهذا اليوم"); return; }
    if (swipe && task && cur === p.end && d > 0) return;
    show(n);
  };
  const atBottom = () => pg.scrollHeight - pg.scrollTop - pg.clientHeight < 40;
  async function checkEnd() {
    const t = T.tasks.quran;
    if (task && t.state === "inProgress" && cur === p.end && t.reached >= p.end && !t.endSeen && atBottom()) { try { await patchTask("quran", { endSeen: true }); } catch (e) {} }
  }
  function panel() {
    if (!task || cur !== p.end || T.tasks.quran.state === "completed") return null;
    const msg = h("div", {}), upd = () => { msg.textContent = contentOk("quran") ? "أتممت ورد القرآن لليوم." : "أكمل قراءة هذه الصفحة حتى نهايتها."; };
    ticks.push(upd); upd(); return h("div", { cls: "endp" }, msg, finisher("quran", "تم إنهاء مهمة القرآن"));
  }
  async function show(n, restore) {
    cur = n; const my = ++seq; local.set("lp", n); QP.currentPage = n;
    clearTimeout(saveT); saveT = setTimeout(flushBookmark, 600);
    pgNum.textContent = "صفحة " + ar(n);
    const t = T.tasks.quran;
    if (task && t.state === "inProgress" && n === (t.reached || p.start - 1) + 1 && n <= p.end) patchTask("quran", { reached: n }).catch(() => {});
    pg.replaceChildren(h("div", { cls: "msg" }, "جارٍ التحميل…"));
    try {
      const a = await pageCache(n); if (my !== seq) return;
      ticks = []; pg.replaceChildren(draw(a, n, panel())); pg.scrollTop = restore || 0; checkEnd();
      if (n < CFG.pages) pageCache(n + 1).catch(() => {});
    } catch (e) { if (my !== seq) return; pg.replaceChildren(h("div", { cls: "msg" }, navigator.onLine ? "تعذر تحميل الصفحة." : "لا يوجد اتصال بالإنترنت.", h("br"), h("br"), h("button", { cls: "btn ghost", on: { click: () => show(n) } }, "إعادة المحاولة"))); }
  }
  let sx = 0, sy = 0;
  pg.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  pg.addEventListener("touchend", e => { const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1, true); }, { passive: true });
  pg.addEventListener("click", () => { if (settings.rm) rd.classList.toggle("show"); });
  pg.addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(checkEnd, 200); }, { passive: true });
  document.onkeydown = e => { if (e.key === "ArrowLeft") go(1); else if (e.key === "ArrowRight") go(-1); };
  init();
}
async function flushBookmark() { clearTimeout(saveT); if (!UID || !QP) return; try { await update(ref(db, "quranProgress/" + UID), { currentPage: QP.currentPage, lastReadAt: now() }); } catch (e) {} }
function draw(a, n, panelEl) {
  const m = h("div", { cls: "mushaf qf" }); let q = null;
  m.append(h("div", { cls: "juz" }, "الجزء " + ar(a[0][4])));
  a.forEach(([s, name, i, txt]) => {
    if (i === 1) { m.append(h("div", { cls: "sn" }, name)); if (s !== 1 && s !== 9) { txt = noBasmala(txt); m.append(h("div", { cls: "bsm" }, "﷽")); } q = null; }
    if (!q) { q = h("p", { cls: "ay" }); m.append(q); } q.append(txt + " ﴿" + ar(i) + "﴾ ");
  });
  m.append(h("div", { cls: "juz" }, ar(n))); if (panelEl) m.append(panelEl); return m;
}

// ===== INIT =====
async function start() {
  applySettings(); loadingView();
  try {
    await waitOffset(); await load(); await evaluate();
    const open = sessionStorage.getItem("open");
    if (open === "quran" || open === "free") viewReader(open === "quran" ? "task" : "free");
    else if (open === "memorize") viewMemorize();
    else if (open === "morning" || open === "evening") viewAdhkar(open);
    else viewHome();
  } catch (e) { console.error(e); errorView(e && e.message); }
}

const savedUid = local.get("uid", null);
if (savedUid && USERS[savedUid]) { UID = savedUid; start(); } else { viewPicker(); }

setInterval(async () => { if (!UID || !T) return; try { if (T.date !== dateKey()) { await evaluate(); if (view === "home") viewHome(); } else if (view === "home") await evaluate(); } catch (e) {} }, 30000);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushBookmark(); });
window.addEventListener("pagehide", flushBookmark);
</script>
