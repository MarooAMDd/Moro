<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وردي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--fg:#1e2a25;--mute:#7f7b6c;--line:#e1dbc9;--acc:#2f5d50;--gold:#b8923a;--fs:1.7;--pink:#c48a9c;--done:#8a8578;--friday:#c9a961}
[data-theme=night]{--bg:#12161a;--fg:#e1dbc8;--mute:#8a8778;--line:#252b2f;--acc:#8fbfae;--gold:#d2ae5a;--pink:#c48a9c;--done:#6a675c;--friday:#d2ae5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background .5s}
body.friday-mode{background:linear-gradient(180deg,#f6f0dd 0%,#f6f3ea 60%)}
[data-theme=night] body.friday-mode{background:linear-gradient(180deg,#1a160e 0%,#12161a 60%)}
#app{height:100%;overflow:auto}
h1{font-weight:700;font-size:1.8rem;margin:0}
.screen{min-height:100%;max-width:26rem;margin:0 auto;padding:2rem 1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.mute{color:var(--mute);font-size:.92rem}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.9rem 0;border-bottom:1px solid var(--line);text-align:right;transition:opacity .3s}
.row.done{opacity:.55}
.row.done b{color:var(--done)}
.row.done .mute{color:var(--done)}
.row b{font-weight:500;font-size:1.08rem;display:block}
.prog{width:100%}.bar0{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:.4rem}.bar0 i{display:block;height:100%;background:var(--acc);transition:width .4s}
.err{color:#b3473a;min-height:1.3em;font-size:.9rem}
input{font:inherit;width:100%;padding:.75rem;border:1px solid var(--line);border-radius:.6rem;background:transparent;color:var(--fg);text-align:center}
.btn{font:inherit;min-height:2.75rem;background:var(--acc);color:var(--bg);border:0;border-radius:.7rem;padding:.6rem 1.3rem;cursor:pointer;white-space:nowrap}
.btn.big{font-size:1.08rem;padding:.75rem 1.8rem}.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{background:var(--line);color:var(--mute);cursor:default}
.btn.done-btn{background:var(--done);color:var(--bg)}
.btn-omar{background:#3d6b55;color:#fff;font-size:1.4rem;padding:1.4rem;font-weight:600;width:100%;letter-spacing:.5px}
.btn-maryam{background:var(--pink);color:#fff;font-size:1.4rem;padding:1.4rem;font-weight:600;width:100%;letter-spacing:.5px}
.seg{display:flex;gap:.6rem;width:100%}.seg .btn{flex:1}
.link{font:inherit;font-size:.9rem;min-height:2.5rem;background:none;border:0;color:var(--mute);cursor:pointer}
.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem 1rem;border-radius:.6rem;font-size:.9rem;z-index:9}
.fl{display:inline-block;transition:filter .3s;filter:grayscale(1) opacity(.55)}.fl.red{filter:drop-shadow(0 0 4px rgba(214,90,60,.55))}
.qf{font-family:"Amiri Quran","Scheherazade New","Traditional Arabic",serif}
.dk{width:100%;padding:1rem 0}
.nav{display:flex;gap:.6rem;width:100%;justify-content:space-between}
#rd{position:relative;display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;background:var(--bg);color:var(--mute);z-index:2;transition:opacity .2s}
.rm .bar{position:absolute;left:0;right:0;opacity:0;pointer-events:none}.rm .top{top:0}.rm .bot{bottom:0}.rm.show .bar{opacity:1;pointer-events:auto}
.tb{font:inherit;font-size:.92rem;min-height:2.75rem;background:none;border:0;color:var(--mute);padding:.4rem .5rem;cursor:pointer}
.top{border-bottom:1px solid var(--line)}.bot{border-top:1px solid var(--line)}
#pg{flex:1;overflow-y:auto;padding:.8rem 1.3rem 3rem}.rm #pg{padding-top:1.6rem}
.mushaf{max-width:38rem;margin:0 auto;font-size:calc(var(--fs)*1rem);line-height:2.5}.rm .mushaf{font-size:calc((var(--fs) + .25)*1rem)}
.ay{margin:0;text-align:justify;text-align-last:center}
.juz{text-align:center;color:var(--mute);font-size:.7em;line-height:2}
.sn{text-align:center;color:var(--acc);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:1rem 0 .5rem;font-size:1.05em;line-height:2.2}.rm .sn{color:var(--mute);border-color:transparent}
.bsm{text-align:center}.msg{text-align:center;color:var(--mute);margin-top:28vh}
.endp{text-align:center;margin:1.5rem 0;font-family:Tajawal,sans-serif;font-size:1rem;line-height:1.9}
.jump{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:2rem}.jump input{max-width:16rem}
.mem{width:100%;text-align:center;padding:1rem 0}
.mem .sn2{font-family:"Amiri Quran",serif;font-size:1.6rem;color:var(--acc);margin-bottom:.5rem}
.mem .ays{font-family:"Amiri Quran",serif;font-size:1.15rem;line-height:2.3;max-height:35vh;overflow-y:auto;padding:.5rem;border:1px solid var(--line);border-radius:.6rem;text-align:justify;text-align-last:center}
.rec-area{width:100%;margin:1rem 0;padding:1rem;border:1px dashed var(--line);border-radius:.7rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.rec-btn{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--acc);color:var(--bg);border:0;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rec-btn.recording{background:#b3473a;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.rec-timer{font-size:1.3rem;font-weight:600;color:var(--acc)}
.rec-actions{display:flex;gap:.6rem;justify-content:center;width:100%}
.prayer-bar{width:100%;padding:.6rem .8rem;background:var(--line);border-radius:.6rem;font-size:.9rem;color:var(--fg);display:flex;justify-content:space-between;align-items:center;transition:background .4s}
body.friday-mode .prayer-bar{background:rgba(201,169,97,.18)}
.prayer-bar b{color:var(--acc)}
.pick{width:100%;padding:1.5rem 0;text-align:center;display:flex;flex-direction:column;gap:.9rem}
.dk-item{width:100%;padding:1rem 0;border-bottom:1px solid var(--line);animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.dk-item .dt{font-family:"Amiri Quran",serif;font-size:1.15rem;line-height:2.1;text-align:justify;text-align-last:center;margin-bottom:.6rem}
.dk-item .ds{color:var(--mute);font-size:.82rem;margin-bottom:.5rem}
.dk-header{width:100%;text-align:center;padding:.6rem 0;border-bottom:1px dashed var(--line);margin-bottom:.8rem}
.dk-header .dh-prog{color:var(--mute);font-size:.85rem;margin-bottom:.3rem}
.dk-header .dh-title{font-family:"Amiri Quran",serif;font-size:1.25rem;color:var(--acc)}
.dk-counter{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1rem}
.dk-counter .num{font-size:1.5rem;font-weight:600;color:var(--acc);min-width:5rem;text-align:center}
.dk-counter button{width:3.5rem;height:3.5rem;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font-size:1.5rem;cursor:pointer;transition:transform .15s}
.dk-counter button:active{transform:scale(.92)}
.dk-counter button:disabled{background:var(--line);color:var(--mute)}
.dk-counter button.rst{background:none;color:var(--mute);border:1px solid var(--line);font-size:1.2rem}
.day-complete{width:100%;text-align:center;padding:.5rem 0;color:var(--done);font-size:.88rem;font-weight:500}
.friday-banner{width:100%;background:linear-gradient(135deg,rgba(201,169,97,.15),rgba(201,169,97,.05));border:1px solid rgba(201,169,97,.4);border-radius:.8rem;padding:.9rem 1rem;margin:.3rem 0;text-align:right}
.friday-banner .fb-title{color:var(--friday);font-weight:700;font-size:.95rem;margin-bottom:.5rem;text-align:center;font-family:"Amiri Quran",serif}
.friday-banner .fb-item{font-size:.85rem;line-height:1.8;color:var(--fg);padding:.3rem 0}
.friday-banner .fb-hadith{font-family:"Amiri Quran",serif;font-size:.95rem;line-height:2;text-align:justify;text-align-last:center;color:var(--mute);border-top:1px dashed rgba(201,169,97,.3);padding-top:.6rem;margin-top:.5rem}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* Realtime Database rules for this version (no Firebase Auth: the account is chosen on the picker screen):
   {"rules":{".read":true,".write":true}}   ← anyone with the link/config can read and write; private-use only. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, update, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ===== CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyDcZQLLUtWL8UGjib9Nwqcu-gs84hXTWyk",
  authDomain: "omar-1-fcd61.firebaseapp.com",
  databaseURL: "https://omar-1-fcd61-default-rtdb.firebaseio.com",
  projectId: "omar-1-fcd61",
  storageBucket: "omar-1-fcd61.firebasestorage.app",
  messagingSenderId: "1098323069112",
  appId: "1:1098323069112:web:0e36a35eae752e53ac4c4d",
  measurementId: "G-2ZJMPDMCTP"
};
const CFG = { tz: "Africa/Cairo", pages: 604, plan: [4, 6, 8, 10, 12], rescues: 3, pair: "pair_001", quranApi: "https://api.alquran.cloud/v1/" };
const USERS = { user_omar: "عمر", user_maryam: "مريم" };
const MEMBERS = Object.keys(USERS);
const KINDS = ["morning", "quran", "memorize", "evening"];
const SHORT_SURAHS = [
  { n: 1, name: "الفاتحة" }, { n: 112, name: "الإخلاص" }, { n: 113, name: "الفلق" }, { n: 114, name: "الناس" }, { n: 108, name: "الكوثر" },
  { n: 103, name: "العصر" }, { n: 110, name: "النصر" }, { n: 109, name: "الكافرون" }, { n: 107, name: "الماعون" }, { n: 105, name: "الفيل" },
  { n: 106, name: "قريش" }, { n: 102, name: "التكاثر" }, { n: 101, name: "القارعة" }, { n: 100, name: "العاديات" }, { n: 99, name: "الزلزلة" },
  { n: 97, name: "القدر" }, { n: 95, name: "التين" }, { n: 94, name: "الشرح" }, { n: 93, name: "الضحى" }, { n: 92, name: "الليل" },
  { n: 91, name: "الشمس" }, { n: 90, name: "البلد" }, { n: 89, name: "الفجر" }, { n: 88, name: "الغاشية" }, { n: 87, name: "الأعلى" },
  { n: 86, name: "الطارق" }, { n: 85, name: "البروج" }, { n: 84, name: "الانشقاق" }, { n: 83, name: "المطففين" }
];
const app = initializeApp(firebaseConfig), db = getDatabase(app);

// ===== LOCAL STORAGE (UI settings + last chosen account) =====
const local = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const settings = Object.assign({ fs: 1.7, theme: "day", rm: false }, local.get("settings", {}));
const applySettings = () => { document.documentElement.style.setProperty("--fs", settings.fs); document.documentElement.setAttribute("data-theme", settings.theme); };
const saveSettings = () => { local.set("settings", settings); applySettings(); };

// ===== TIME (Firebase server clock + Africa/Cairo) =====
let OFFSET = 0;
onValue(ref(db, ".info/serverTimeOffset"), s => { OFFSET = s.val() || 0; });
const now = () => Date.now() + OFFSET;
const dateKey = () => new Intl.DateTimeFormat("en-CA", { timeZone: CFG.tz }).format(new Date(now()));
const addDays = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const waitOffset = () => new Promise(r => { const t0 = Date.now(), i = setInterval(() => { if (OFFSET !== 0 || Date.now() - t0 > 3000) { clearInterval(i); r(); } }, 100); });
const isFriday = () => new Intl.DateTimeFormat("en-US", { timeZone: CFG.tz, weekday: "short" }).format(new Date(now())) === "Fri";
const cairoClock = () => new Intl.DateTimeFormat("en-GB", { timeZone: CFG.tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).format(new Date(now())).split(":").map(Number);
const cairoMin = () => { const [hh, mm] = cairoClock(); return hh * 60 + mm; };
const secToMidnight = () => { const [hh, mm, ss] = cairoClock(); return Math.max(0, 86400 - (hh * 3600 + mm * 60 + ss)); };

// ===== PRAYER TIMES (Aladhan, Cairo) =====
const prayerCache = {};
async function getPrayerTimes(date) {
  if (prayerCache[date]) return prayerCache[date];
  try {
    const [y, m, d] = date.split("-");
    const c = new AbortController(), tm = setTimeout(() => c.abort(), 8000);
    const r = await fetch(`https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=30.0444&longitude=31.2357&method=5`, { signal: c.signal });
    clearTimeout(tm);
    const j = await r.json();
    if (j.code !== 200) throw 0;
    const t = j.data.timings;
    return (prayerCache[date] = { fajr: t.Fajr, dhuhr: t.Dhuhr, asr: t.Asr, maghrib: t.Maghrib, isha: t.Isha });
  } catch (e) { return null; }
}
const toMin = s => { const m = /(\d{1,2}):(\d{2})/.exec(s || ""); return m ? +m[1] * 60 + +m[2] : null; };
function nextPrayer(times) {
  if (!times) return null;
  const cur = cairoMin();
  const list = [["الفجر", times.fajr], ["الظهر", times.dhuhr], ["العصر", times.asr], ["المغرب", times.maghrib], ["العشاء", times.isha]]
    .map(([name, t]) => ({ name, m: toMin(t) })).filter(p => p.m !== null);
  if (!list.length) return null;
  for (const p of list) if (p.m > cur) return { name: p.name, remaining: p.m - cur };
  return { name: list[0].name, remaining: 1440 - cur + list[0].m, tomorrow: true };
}

// ===== HELPERS =====
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const pagesTxt = n => n === 1 ? "صفحة واحدة" : n === 2 ? "صفحتان" : ar(n) + " صفحات";
const fmt = s => { s = Math.max(0, Math.floor(s)); return ar(String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0")); };
const fmtMin = m => ar(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
function h(tag, a = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in a) { if (k === "on") for (const ev in a.on) e.addEventListener(ev, a.on[ev]); else if (k === "cls") e.className = a[k]; else e.setAttribute(k, a[k]); }
  kids.flat().filter(x => x != null && x !== false).forEach(x => e.append(x));
  return e;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat().filter(x => x != null && x !== false));   // replaceChildren(null) would insert the text "null"
let ticks = [], view = "", busy = false;
const mount = n => { ticks = []; document.querySelector("#app").replaceChildren(n); };
const toast = t => { const e = h("div", { cls: "toast" }, t); document.body.append(e); setTimeout(() => e.remove(), 3500); };
const SAVE_ERR = "تعذر حفظ التقدم، حاول مرة أخرى.";
setInterval(() => ticks.forEach(f => f()), 1000);   // display refresh only

// ===== ADHKAR =====
const AYAT_KURSI = "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾";
const SURAH_IKHLAS = "قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾";
const SURAH_FALAQ = "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾";
const SURAH_NAS = "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾";
const BISM = { t: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", s: "رواه أبو داود والترمذي", times: 3, title: "بسم الله الذي لا يضر" };
const TASBIH = { t: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", s: "رواه مسلم", times: 100, title: "سبحان الله وبحمده" };
const COMMON = [
  { t: AYAT_KURSI, s: "آية الكرسي — البقرة ٢٥٥", times: 1, title: "آية الكرسي" },
  { t: SURAH_IKHLAS, s: "ثلاث مرات", times: 3, title: "سورة الإخلاص" },
  { t: SURAH_FALAQ, s: "ثلاث مرات", times: 3, title: "سورة الفلق" },
  { t: SURAH_NAS, s: "ثلاث مرات", times: 3, title: "سورة الناس" }
];
const ADHKAR = {
  morning: [...COMMON,
    { t: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", s: "رواه مسلم", times: 1, title: "أصبحنا وأصبح الملك لله" },

  document.onkeydown = e => { if (e.key === "ArrowLeft") go(1); else if (e.key === "ArrowRight") go(-1); };
  init();
}
async function flushBookmark() {
  clearTimeout(saveT); if (!UID || !QP) return;
  try { await update(ref(db, "quranProgress/" + UID), { currentPage: QP.currentPage, lastReadAt: now() }); } catch (e) {}
}
function draw(a, n, panelEl) {
  const m = h("div", { cls: "mushaf qf" }); let q = null;
  m.append(h("div", { cls: "juz" }, "الجزء " + ar(a[0][4])));
  a.forEach(([s, name, i, txt]) => {
    if (i === 1) { m.append(h("div", { cls: "sn" }, name)); if (s !== 1 && s !== 9) { txt = noBasmala(txt); m.append(h("div", { cls: "bsm" }, "﷽")); } q = null; }
    if (!q) { q = h("p", { cls: "ay" }); m.append(q); }
    q.append(txt + " ﴿" + ar(i) + "﴾ ");
  });
  m.append(h("div", { cls: "juz" }, ar(n))); if (panelEl) m.append(panelEl); return m;
}

// ===== VIEWS: PICKER / LOADING / ERROR =====
function viewPicker() {
  view = "picker";
  mount(h("div", { cls: "screen" }, h("h1", {}, "وردي"), h("div", { cls: "mute" }, "اختر حسابك"),
    h("div", { cls: "pick" }, h("button", { cls: "btn btn-omar", on: { click: () => pickUser("user_omar") } }, "عمر"), h("button", { cls: "btn btn-maryam", on: { click: () => pickUser("user_maryam") } }, "مريم"))));
}
function pickUser(id) { UID = id; local.set("uid", id); start(); }
const switchAccount = () => { local.del("uid"); UID = null; T = QP = S = MEM = null; sessionStorage.removeItem("open"); viewPicker(); };
async function resetMyData() {      // resets only this account's own Quran/memorize/today's tasks; the shared streak and past days are untouched
  if (busy) return;
  if (!confirm("سيُمسح تقدمك في القرآن والحفظ ومهام اليوم، وتبدأ من جديد كأول مرة. هذا لا يؤثر على حساب الطرف الآخر ولا على الستريك المشترك. متابعة؟")) return;
  busy = true;
  try {
    await set(ref(db, "quranProgress/" + UID), { currentPage: 1, khatmah: 1, frontier: 1, pagesRead: 0, lastReadAt: 0 });
    await set(ref(db, "memorize/" + UID), { completed: {}, count: 0 });
    await set(ref(db, `dailyTasks/${UID}/${T.date}`), null);
    await set(ref(db, `days/${CFG.pair}/${T.date}/${UID}`), null);   // remove today's own contribution only; past evaluated days stay as they are
    local.del("lp"); sessionStorage.removeItem("open");
    busy = false; await load(); viewHome();
  } catch (e) { busy = false; toast(SAVE_ERR); }
}
const loadingView = () => mount(h("div", { cls: "screen" }, h("div", { cls: "mute" }, "جارٍ التحميل…")));
const errorView = msg => mount(h("div", { cls: "screen" }, h("div", { cls: "mute" }, "تعذر الاتصال بالخادم. حاول مرة أخرى."), msg ? h("div", { cls: "err" }, msg) : null,
  h("button", { cls: "btn", on: { click: () => start() } }, "إعادة المحاولة"), h("button", { cls: "link", on: { click: switchAccount } }, "تبديل الحساب")));

// ===== VIEW: HOME =====
async function viewHome() {
  view = "home"; sessionStorage.removeItem("open");
  if (T.date !== dateKey()) { loadingView(); try { await load(); await evaluate(); } catch (e) { return errorView(); } view = "home"; }
  renderHome();
}
function renderHome() {
  if (view !== "home") return;
  const p = T.plan, s = S || INIT_STREAK, st = k => stateOf(k), pct = Math.floor(QP.pagesRead / CFG.pages * 100), allDone = KINDS.every(k => st(k) === "completed");
  const label = { available: "لم تبدأ بعد", inProgress: "قيد التنفيذ", completed: "✓ تم", locked: "مغلقة" };
  document.body.classList.toggle("friday-mode", isFriday());
  const fridayItems = [
    ["📖", "اقرأ سورة الكهف — «من قرأها يوم الجمعة أضاء له من النور ما بين الجمعتين»"], ["ﷺ", "أكثِر من الصلاة على النبي ﷺ — «فأكثروا عليّ من الصلاة فيه»"],
    ["🕌", "تحرّى ساعة الإجابة — آخر ساعة قبل المغرب"], ["🛁", "اغتسل وتطيّب والبس أحسن ثيابك"], ["🤲", "بكّر إلى المسجد وأنصت للخطبة"], ["📿", "«سبحان الله وبحمده» مائة مرة — غُفرت ذنوبه"]];
  const btn = (k, fn) => { const x = st(k), b = h("button", { cls: "btn" + (x === "completed" ? " done-btn" : " ghost"), on: { click: fn } }, x === "completed" ? "تم ✓" : x === "inProgress" ? "متابعة" : "ابدأ"); b.disabled = x === "locked"; return b; };
  const sub = k => {
    if (k === "quran") return st(k) === "completed" ? "✓ تم" : pagesTxt(p.pages) + " · ص " + ar(p.start) + " — ص " + ar(p.end);
    if (k === "memorize") return st(k) === "completed" ? "✓ تم حفظ سورة " + p.surahName : "سورة " + p.surahName + (st(k) === "inProgress" ? " — " + ar(T.tasks.memorize.recitedCount || 0) + "/٣" : "");
    const c = T.tasks[k].counts || {}, total = ADHKAR[k].reduce((a, x, i) => a + Math.min(c[i] || 0, x.times), 0), need = ADHKAR[k].reduce((a, x) => a + x.times, 0);
    return st(k) === "completed" ? "✓ تم" : st(k) === "inProgress" ? "قيد التنفيذ " + ar(total) + "/" + ar(need) : label[st(k)];
  };
  const row = (icon, title, k, fn) => h("div", { cls: "row" + (st(k) === "completed" ? " done" : "") }, h("div", {}, h("b", {}, icon + " " + title), h("span", { cls: "mute" }, sub(k))), btn(k, fn));
  const extras = h("div", { style: "width:100%" });
  const fridayBanner = isFriday() ? h("div", { cls: "friday-banner" }, h("div", { cls: "fb-title" }, "﷽ يوم الجمعة"), ...fridayItems.map(([i, t]) => h("div", { cls: "fb-item" }, i + " " + t)),
    h("div", { cls: "fb-hadith" }, "«إن من أفضل أيامكم يوم الجمعة، فأكثروا عليّ من الصلاة فيه»")) : null;
  const ticksBox = h("div", { cls: "mute" }, ""), updCountdown = () => { ticksBox.textContent = "اليوم الجديد بعد: " + fmt(secToMidnight()); };
  mount(h("div", { cls: "screen" }, h("div", { cls: "mute" }, "أهلًا بك"), h("h1", {}, "وردك اليوم"), extras, fridayBanner,
    h("div", { style: "width:100%" }, row("☀️", "أذكار الصباح", "morning", () => viewAdhkar("morning")), row("📖", "ورد القرآن", "quran", () => viewReader("task")), row("📚", "الحفظ", "memorize", () => viewMemorize()), row("🌙", "أذكار المساء", "evening", () => viewAdhkar("evening"))),
    h("div", { cls: "prog" }, h("div", { cls: "bar0" }, h("i", { style: "width:" + pct + "%" })), h("div", { cls: "mute" }, "ختمة " + ar(QP.khatmah) + " · " + ar(QP.pagesRead) + " / " + ar(CFG.pages) + " · " + ar(pct) + "٪")),
    h("div", { cls: "mute" }, "حفظت " + ar((MEM && MEM.count) || 0) + " سورة حتى الآن"),
    h("button", { cls: "link", on: { click: () => viewReader("free") } }, "قراءة حرة"),
    h("div", { style: "font-size:1.1rem", "aria-label": "الستريك المشترك" }, h("span", { cls: "fl" + (s.status === "red" ? " red" : "") }, "🔥"), " " + ar(s.count)),
    allDone ? h("div", { cls: "day-complete" }, "✓ تم ورد اليوم بحمد الله") : null, allDone ? ticksBox : null,
    h("button", { cls: "link", on: { click: switchAccount } }, "تبديل الحساب"),
    h("button", { cls: "link", on: { click: resetMyData } }, "بدء من جديد")));
  if (allDone) { ticks.push(updCountdown); updCountdown(); }          // after mount(), which clears ticks
  getPrayerTimes(dateKey()).then(times => { const np = nextPrayer(times); if (np && view === "home") put(extras, h("div", { cls: "prayer-bar" }, h("span", {}, "🕌 " + np.name + (np.tomorrow ? " (غدًا)" : "")), h("b", {}, fmtMin(np.remaining)))); });
}

// ===== START =====
async function start() {
  applySettings(); loadingView(); document.body.classList.toggle("friday-mode", isFriday());
  try {
    await waitOffset(); await load(); await evaluate();
    const open = sessionStorage.getItem("open");     // a refresh returns to the same task / page
    if (open === "quran" || open === "free") viewReader(open === "quran" ? "task" : "free");
    else if (open === "memorize") viewMemorize();
    else if (open === "morning" || open === "evening") viewAdhkar(open);
    else viewHome();
  } catch (e) { console.error(e); errorView(e && e.message); }
}
const savedUid = local.get("uid", null);
if (savedUid && USERS[savedUid]) { UID = savedUid; start(); } else viewPicker();

setInterval(async () => {
  if (!UID || !T) return;
  try { if (T.date !== dateKey()) { await evaluate(); if (view === "home") viewHome(); } else if (view === "home") await evaluate(); } catch (e) {}
}, 30000);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushBookmark(); });
window.addEventListener("pagehide", flushBookmark);
</script>
