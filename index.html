  <script>window.WARDI_ADHKAR={"morning":[{"title":"آية الكرسي","text":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","source":"البقرة ٢٥٥ — رواه الحاكم والنسائي والطبراني","repeat":1,"id":"morning-1"},{"title":"سورة الإخلاص","text":"قُلْ هُوَ اللَّهُ أَحَدٌ * اللَّهُ الصَّمَدُ * لَمْ يَلِدْ وَلَمْ يُولَدْ * وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","source":"ثلاث مرات — رواه أبو داود والترمذي","repeat":3,"id":"morning-2"},{"title":"سورة الفلق","text":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ * مِن شَرِّ مَا خَلَقَ * وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ * وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ * وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","source":"ثلاث مرات — رواه أبو داود والترمذي","repeat":3,"id":"morning-3"},{"title":"سورة الناس","text":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ * مَلِكِ النَّاسِ * إِلَٰهِ النَّاسِ * مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ * الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ * مِنَ الْجِنَّةِ وَالنَّاسِ","source":"ثلاث مرات — رواه أبو داود والترمذي","repeat":3,"id":"morning-4"},{"title":"سيد الاستغفار","text":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","source":"رواه البخاري","repeat":1,"id":"morning-5"},{"title":"اللهم عافني","text":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ","source":"رواه أبو داود وأحمد","repeat":3,"id":"morning-6"},{"title":"اللهم إني أسألك العفو والعافية","text":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","source":"رواه أبو داود وابن ماجه","repeat":1,"id":"morning-7"},{"title":"أعوذ بك من الكفر والفقر","text":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَٰهَ إِلَّا أَنْتَ","source":"رواه أبو داود وأحمد والنسائي","repeat":3,"id":"morning-8"},{"title":"حسبي الله","text":"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","source":"رواه أبو داود","repeat":7,"id":"morning-9"},{"title":"بسم الله الذي لا يضر","text":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","source":"رواه أبو داود والترمذي","repeat":3,"id":"morning-10"},{"title":"رضيت بالله ربًا","text":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","source":"رواه أبو داود والترمذي وابن ماجه","repeat":3,"id":"morning-11"},{"title":"يا حي يا قيوم","text":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَىٰ نَفْسِي طَرْفَةَ عَيْنٍ","source":"رواه الحاكم والنسائي، وصححه الألباني","repeat":1,"id":"morning-12"},{"title":"لا إله إلا الله وحده","text":"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","source":"رواه أحمد وأبو داود والترمذي والنسائي وابن ماجه","repeat":10,"id":"morning-13"},{"title":"سبحان الله وبحمده","text":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","source":"رواه مسلم","repeat":100,"id":"morning-14"},{"title":"سبحان الله عدد خلقه","text":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","source":"رواه مسلم","repeat":3,"id":"morning-15"},{"title":"الاستغفار","text":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","source":"رواه البخاري","repeat":100,"id":"morning-16"},{"title":"الصلاة على النبي ﷺ","text":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ","source":"رواه الطبراني","repeat":10,"id":"morning-17"},{"title":"أصبحنا وأصبح الملك لله","text":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","source":"رواه مسلم","repeat":1,"id":"morning-18"},{"title":"أصبحنا وأصبح الملك لله (الرواية الطويلة)","text":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَٰذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَٰذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","source":"رواه مسلم","repeat":1,"id":"morning-19"},{"title":"اللهم بك أصبحنا","text":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ","source":"رواه الترمذي","repeat":1,"id":"morning-20"},{"title":"أصبحنا على فطرة الإسلام","text":"أَصْبَحْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَىٰ مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ","source":"رواه أحمد","repeat":1,"id":"morning-21"},{"title":"اللهم إني أصبحت أشهدك","text":"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","source":"رواه أبو داود، أربع مرات","repeat":4,"id":"morning-22"},{"title":"اللهم ما أصبح بي من نعمة","text":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","source":"رواه أبو داود والنسائي وابن السني","repeat":1,"id":"morning-23"},{"title":"اللهم إني أسألك علمًا نافعًا","text":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا","source":"رواه ابن ماجه وابن السني — تُقال إذا أصبح خاصة","repeat":1,"id":"morning-24"}],"evening":[{"title":"آية الكرسي","text":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","source":"البقرة ٢٥٥ — رواه الحاكم والنسائي والطبراني","repeat":1,"id":"evening-1"},{"title":"سورة الإخلاص","text":"قُلْ هُوَ اللَّهُ أَحَدٌ * اللَّهُ الصَّمَدُ * لَمْ يَلِدْ وَلَمْ يُولَدْ * وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","source":"ثلاث مرات — رواه أبو داود والترمذي","repeat":3,"id":"evening-2"},{"title":"سورة الفلق","text":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ * مِن شَرِّ مَا خَلَقَ * وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ * وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ * وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","source":"ثلاث مرات — رواه أبو داود والترمذي","repeat":3,"id":"evening-3"},{"title":"سورة الناس","text":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ * مَلِكِ النَّاسِ * إِلَٰهِ النَّاسِ * مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ * الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ * مِنَ الْجِنَّةِ وَالنَّاسِ","source":"ثلاث مرات — رواه أبو داود والترمذي","repeat":3,"id":"evening-4"},{"title":"سيد الاستغفار","text":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","source":"رواه البخاري","repeat":1,"id":"evening-5"},{"title":"اللهم عافني","text":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ","source":"رواه أبو داود وأحمد","repeat":3,"id":"evening-6"},{"title":"اللهم إني أسألك العفو والعافية","text":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","source":"رواه أبو داود وابن ماجه","repeat":1,"id":"evening-7"},{"title":"أعوذ بك من الكفر والفقر","text":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَٰهَ إِلَّا أَنْتَ","source":"رواه أبو داود وأحمد والنسائي","repeat":3,"id":"evening-8"},{"title":"حسبي الله","text":"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","source":"رواه أبو داود","repeat":7,"id":"evening-9"},{"title":"بسم الله الذي لا يضر","text":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","source":"رواه أبو داود والترمذي","repeat":3,"id":"evening-10"},{"title":"رضيت بالله ربًا","text":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","source":"رواه أبو داود والترمذي وابن ماجه","repeat":3,"id":"evening-11"},{"title":"يا حي يا قيوم","text":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَىٰ نَفْسِي طَرْفَةَ عَيْنٍ","source":"رواه الحاكم والنسائي، وصححه الألباني","repeat":1,"id":"evening-12"},{"title":"لا إله إلا الله وحده","text":"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","source":"رواه أحمد وأبو داود والترمذي والنسائي وابن ماجه","repeat":10,"id":"evening-13"},{"title":"سبحان الله وبحمده","text":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","source":"رواه مسلم","repeat":100,"id":"evening-14"},{"title":"سبحان الله عدد خلقه","text":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","source":"رواه مسلم","repeat":3,"id":"evening-15"},{"title":"الاستغفار","text":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","source":"رواه البخاري","repeat":100,"id":"evening-16"},{"title":"الصلاة على النبي ﷺ","text":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ","source":"رواه الطبراني","repeat":10,"id":"evening-17"},{"title":"أمسينا وأمسى الملك لله","text":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","source":"رواه مسلم","repeat":1,"id":"evening-18"},{"title":"أمسينا وأمسى الملك لله (الرواية الطويلة)","text":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَٰذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَٰذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","source":"رواه مسلم","repeat":1,"id":"evening-19"},{"title":"اللهم بك أمسينا","text":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ","source":"رواه الترمذي","repeat":1,"id":"evening-20"},{"title":"أمسينا على فطرة الإسلام","text":"أَمْسَيْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَىٰ مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ","source":"رواه أحمد","repeat":1,"id":"evening-21"},{"title":"اللهم إني أمسيت أشهدك","text":"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","source":"رواه أبو داود، أربع مرات","repeat":4,"id":"evening-22"},{"title":"اللهم ما أمسى بي من نعمة","text":"اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","source":"رواه أبو داود والنسائي وابن السني","repeat":1,"id":"evening-23"}]};window.WARDI_EXTRA_ADHKAR=[{"id":"sleep","title":"النوم","description":"أذكار النوم والاستيقاظ ليلًا","items":[{"id":"sleep-legacy-1","title":"آية الكرسي","text":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ","source":"البقرة ٢٥٥ — من قالها حين يأوي إلى فراشه لم يزل عليه حافظ من الله، رواه البخاري","sourceUrl":"https://sunnah.com/hisn","repeat":1},{"id":"sleep-legacy-2","title":"آخر آيتين من سورة البقرة","text":"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾","source":"البقرة ٢٨٥-٢٨٦ — من قرأهما في ليلة كفتاه، متفق عليه","sourceUrl":"https://sunnah.com/hisn","repeat":1},{"id":"sleep-legacy-3","title":"سورة الإخلاص","text":"قُلْ هُوَ اللَّهُ أَحَدٌ * اللَّهُ الصَّمَدُ * لَمْ يَلِدْ وَلَمْ يُولَدْ * وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","source":"تُقرأ وتُنفخ في الكفين وتُمسح على الجسد، ثلاث مرات — متفق عليه","sourceUrl":"https://sunnah.com/hisn","repeat":3},{"id":"sleep-legacy-4","title":"سورة الفلق","text":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ * مِن شَرِّ مَا خَلَقَ * وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ * وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ * وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","source":"تُقرأ وتُنفخ في الكفين وتُمسح على الجسد، ثلاث مرات — متفق عليه","sourceUrl":"https://sunnah.com/hisn","repeat":3},{"id":"sleep-legacy-5","title":"سورة الناس","text":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ * مَلِكِ النَّاسِ * إِلَٰهِ النَّاسِ * مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ * الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ * مِنَ الْجِنَّةِ وَالنَّاسِ","source":"تُقرأ وتُنفخ في الكفين وتُمسح على الجسد، ثلاث مرات — متفق عليه","sourceUrl":"https://sunnah.com/hisn","repeat":3},{"id":"sleep-legacy-6","title":"باسمك اللهم أموت وأحيا","text":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","source":"رواه البخاري","sourceUrl":"https://sunnah.com/hisn","repeat":1},{"id":"sleep-legacy-7","title":"اللهم أسلمت نفسي إليك","text":"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ","source":"متفق عليه","sourceUrl":"https://sunnah.com/hisn","repeat":1},{"id":"sleep-legacy-8","title":"تسبيح فاطمة: سبحان الله","text":"سُبْحَانَ اللَّهِ","source":"رواه البخاري ومسلم، ثلاث وثلاثون مرة","sourceUrl":"https://sunnah.com/hisn","repeat":33},{"id":"sleep-legacy-9","title":"تسبيح فاطمة: الحمد لله","text":"الْحَمْدُ لِلَّهِ","source":"رواه البخاري ومسلم، ثلاث وثلاثون مرة","sourceUrl":"https://sunnah.com/hisn","repeat":33},{"id":"sleep-legacy-10","title":"تسبيح فاطمة: الله أكبر","text":"اللَّهُ أَكْبَرُ","source":"رواه البخاري ومسلم، أربع وثلاثون مرة","sourceUrl":"https://sunnah.com/hisn","repeat":34},{"id":"sleep-legacy-11","title":"اللهم قني عذابك","text":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","source":"رواه أبو داود والترمذي، ثلاث مرات","sourceUrl":"https://sunnah.com/hisn","repeat":3},{"id":"hisn-99","title":"ذكر من حصن المسلم (99)","text":"يَجْمَعُ كَفَّيْهِ ثُمَّ يَنْفُثُ فِيهِمَا فَيَقْرَأُ فِيهِمَا: بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ هُوَ اللَّهُ أَحَدٌ \\* اللَّهُ الصَّمَدُ\\* لَمْ يَلِدْ وَلَمْ يُولَدْ\\* وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ}. بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ\\* مِن شَرِّ مَا خَلَقَ\\* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ\\* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ\\* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ}. بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ النَّاسِ\\* مَلِكِ النَّاسِ\\* إِلَهِ النَّاسِ\\* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ\\* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ\\* مِنَ الْجِنَّةِ وَالنَّاسِ} ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ وَمَا أَقبَلَ مِنْ جَسَدِهِ (يفعلُ ذلك ثلاثَ مرَّاتٍ)","source":"Al-Ikhlas 112:1-4. Bismillāhir-Raḥmānir-Raḥīm. Qul a`ūdhu birabbil-falaq. Min sharri mā khalaq. Wa min sharri ghāsiqin idhā waqab. Wa min sharrin-naffāthāti fil-`uqad. Wa min sharri ḥāsidin idhā ḥasad. Reference: Al-Falaq 113:1-5. Bismillāhir-Raḥmānir-Raḥīm. Qul a`ūdhu birabbin-nās. Malikin-nās. 'Ilāhin-nās. Min sharri ‘l-waswāsil-khannās. Alladhī yuwaswisu fī ṣudūrin-nās. Minal-jinnati wannās. Reference: An-Nas 114:1-6 Hold the palms together, blow (with a little spittle) into them, and recite: \"With the Name of Allah, the Most Gracious, the Most Merciful. Say: He is Allah (the) One. The Self-Sufficient Master, Whom all creatures need, He begets not nor was He begotten, and there is none equal to Him. With the Name of Allah, the Most Gracious, the Most Merciful. Say: I seek refuge with (Allah) the Lord of the daybreak, from the evil of what He has created, and from the evil of the darkening (night) as it comes with its darkness, and from the evil of those who practice witchcraft when they blow in the knots, and from the evil of the envier when he envies. With the Name of Allah, the Most Gracious, the Most Merciful. Say: I seek refuge with (Allah) the Lord of mankind, the King of mankind, the God of mankind, from the evil of the whisperer who withdraws, who whispers in the breasts of mankind, of jinns and men.\" (Then pass your hands over as much of your body as you can reach, beginning with the head and the face, then the entire front of your body. Do this three times.) Reference: Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 9/62, and Muslim 4/ 1723.","sourceUrl":"https://sunnah.com/hisn:99"},{"id":"hisn-100","title":"ذكر من حصن المسلم (100)","text":"((اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ))","source":"Al-Baqarah 2:255. Whoever reads this when he lies down to sleep will have a guardian from Allah remain with him and Satan will not be able to come near him until he rises in the morning. See Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 4/487.","sourceUrl":"https://sunnah.com/hisn:100"},{"id":"hisn-101","title":"ذكر من حصن المسلم (101)","text":"((ءامَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ ءامَنَ بِاللهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُواْ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ {285} لاَ يُكَلِّفُ اللهُ نَفْسًا إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَآ أَنتَ مَوْلاَنَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ {286}))","source":"Al-Baqarah 2:285-6. These two Verses will be sufficient for anyone who recites them at night before sleeping. Al-Bukhari, cf. Al-Asqalani, Fathul-Bari.9/94, Muslim 1/554.","sourceUrl":"https://sunnah.com/hisn:101"},{"id":"hisn-102","title":"ذكر من حصن المسلم (102)","text":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِن أَمْسَكْتَ نَفْسِي فارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ","source":"1 \"If any of you rises from his bed and later returns to it, let him dust off his bed with his waist garment three times and mention the Name of Allah, for he does not know what may have entered the bed after him, and when he lies down he should say. . . \". 2 Al-Bukhari 1 1/ 126 and Muslim 4/2084.","sourceUrl":"https://sunnah.com/hisn:102"},{"id":"hisn-103","title":"ذكر من حصن المسلم (103)","text":"اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْياهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا. اللَّهُمَّ إِنِّي أَسْأَلُكَ العَافِيَةَ","source":"Muslim 4/2083 and Ahmad 2/79.","sourceUrl":"https://sunnah.com/hisn:103"},{"id":"hisn-104","title":"ذكر من حصن المسلم (104)","text":"اللّهُـمَّ قِنـي عَذابَـكَ يَـوْمَ تَبْـعَثُ عِبـادَك .","source":"1 \"When the Prophet (ﷺ) wanted to lie down to sleep, he used to place his right hand under his cheek and say...\" 2 Abu Dawud 4/311. See also Al-Albani, Sahih At-Tirmidhi 3/143.","sourceUrl":"https://sunnah.com/hisn:104"},{"id":"hisn-105","title":"ذكر من حصن المسلم (105)","text":"بِاسْـمِكَ اللّهُـمَّ أَمـوتُ وَأَحْـيا","source":"Here, dying and living are metaphors for sleep and wakefulness. This explains why the normal order of these words has been reversed in this Hadith. In other contexts the living is mentioned before dying. See Qur'an Al-Baqarah 2:258, Aal-'Imrdn 3:156, Al-A'raf 7:158 among many other examples, (trans.). See also Al-Asqalani, Fathul-Bari 11/113, Muslim 4/ 2083.","sourceUrl":"https://sunnah.com/hisn:105"},{"id":"hisn-106","title":"ذكر من حصن المسلم (106)","text":"سُبْحَانَ اللَّهِ (ثلاثاً وثلاثين)\nوَالْحَمْدُ لِلَّهِ (ثلاثاً وثلاثين)\nوَاللَّهُ أَكْبَرُ (أربعاً وثلاثينَ)","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 7/71, Muslim 4/2091.","sourceUrl":"https://sunnah.com/hisn:106"},{"id":"hisn-107","title":"ذكر من حصن المسلم (107)","text":"اللّهُـمَّ رَبَّ السّمـواتِ السَّبْـعِ وَرَبَّ العَـرْشِ العَظـيم رَبَّنـا وَرَبَّ كُـلِّ شَـيء فالِـقَ الحَـبِّ وَالنَّـوى وَمُـنَزِّلَ التَّـوْراةِ وَالإنْجـيل والفُـرْقان أَعـوذُ بِـكَ مِن شَـرِّ كُـلِّ شَـيءٍ أَنْـتَ آخِـذٌ بِنـاصِـيَتِه اللّهُـمَّ أَنْـتَ الأوَّلُ فَلَـيسَ قَبْـلَكَ شَيء وَأَنْـتَ الآخِـرُ فَلَـيسَ بَعْـدَكَ شَيء وَأَنْـتَ الظّـاهِـرُ فَلَـيْسَ فَـوْقَـكَ شَيء وَأَنْـتَ الْبـاطِـنُ فَلَـيْسَ دونَـكَ شَيء اقـْضِ عَنّـا الـدَّيْـنَ وَأَغْـنِنـا مِنَ الفَـقْر","source":"1 The Scripture that was revealed to 'Isa (Jesus). 2 See Qur'an Al-'Alaq 96:15, where seizure by the forelock preceeds being cast into Hell. (Translator) 3 Muslim 4/2084.","sourceUrl":"https://sunnah.com/hisn:107"},{"id":"hisn-108","title":"ذكر من حصن المسلم (108)","text":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا، وَكَفَانَا، وَآوَانَا، فَكَمْ مِمَّنْ لاَ كَافِيَ لَهُ وَلاَ مُؤْوِيَ","source":"Muslim 4/2085.","sourceUrl":"https://sunnah.com/hisn:108"},{"id":"hisn-109","title":"ذكر من حصن المسلم (109)","text":"اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كـلِّ شَـيءٍ وَمَليـكَه أَشْهَـدُ أَنْ لا إِلـهَ إِلاّ أَنْت أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي وَمِن شَـرِّ الشَّيْـطانِ وَشِـرْكِه وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم","source":"Abu Dawud 4/317. See also Al-Albani, SahihAt-Tirmidhi 3/142.","sourceUrl":"https://sunnah.com/hisn:109"},{"id":"hisn-110","title":"ذكر من حصن المسلم (110)","text":"يقرأ ((ألم \\* تنزيل)) السجدة، و((تبارك الذي بيده الملك))","source":"At-Tirmidhi, An-Nasa'i. See also Al-Albani, Sahihul-Jami ' As-Saghir 4/255","sourceUrl":"https://sunnah.com/hisn:110"},{"id":"hisn-111","title":"ذكر من حصن المسلم (111)","text":"اللّهُـمَّ أَسْـلَمْتُ نَفْـسي إِلَـيْكَ، وَفَوَّضْـتُ أَمْـري إِلَـيْكَ، وَوَجَّـهْتُ وَجْـهي إِلَـيْكَ، وَأَلْـجَـاْتُ ظَهـري إِلَـيْكَ، رَغْبَـةً وَرَهْـبَةً إِلَـيْكَ، لا مَلْجَـأَ وَلا مَنْـجـا مِنْـكَ إِلاّ إِلَـيْكَ، آمَنْـتُ بِكِتـابِكَ الّـذي أَنْزَلْـتَ وَبِنَبِـيِّـكَ الّـذي أَرْسَلْـت","source":"1 \"Before you go to bed perform ablutions as you would for prayer, then lie down on your right side and say. . . \" The Prophet (ﷺ) said: \"Whoever says this and dies in his sleep, has died in a state of the natural monotheism (Fitrah).\" Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 11/113, Muslim 4/2081.","sourceUrl":"https://sunnah.com/hisn:111"},{"id":"hisn-112","title":"ذكر من حصن المسلم (112)","text":"لا إِلـهَ إِلاّ اللهُ الـواحِدُ القَهّـار رَبُّ السَّـمواتِ وَالأرْضِ وَما بَيْـنَهـما العَزيـزُ الغَـفّار\nدعاء القلق والفزع في النوم ومن بلي بالوحشة","source":"This is to be said if you turn over in bed during the night. Al-Hakim graded it authentic and Ath-Thahabi agreed 1/540. Also see An-Nasa'i, 'Amalul-Yawm wal-Laylah, and Ibn As-Sunni. See also Al-Albani, Sahihul-Jami' As-Saghir 4/ 213.","sourceUrl":"https://sunnah.com/hisn:112"},{"id":"hisn-113","title":"ذكر من حصن المسلم (113)","text":"أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِن غَضَـبِهِ وَعِـقابِهِ وَشَـرِّ عِبـادِهِ وَمِنْ هَمَـزاتِ الشَّـياطينِ وَأَنْ يَحْضـرون\nما يفعل من رأى الرؤيا أو الحلم","source":"Abu Dawud 4/12. See also Al-Albani, Sahih At- Tirmidhi 3/171","sourceUrl":"https://sunnah.com/hisn:113"},{"id":"hisn-114","title":"ذكر من حصن المسلم (114)","text":"يَنْفُثُ عَنْ يَسَارِهِ (ثلاثاً). يَسْتَعِيذُ بِاللَّهِ مِنَ الشَّيطَانِ وَمِنْ شَرِّ مَا رَأَى (ثَلاَثَ مَرَّاتٍ). لاَ يُحَدِّثْ بِهَا أَحَداً. يَــتَحَوَّلُ عَنْ جَنْبِهِ الَّذِي كَانَ عَلَيْهِ.","source":"1\\. Muslim 4/1 772. 2. Muslim 4/1 772, 3. 3. Muslim 4/1772. 4. Muslim 4/1773.","sourceUrl":"https://sunnah.com/hisn:114"},{"id":"hisn-115","title":"ذكر من حصن المسلم (115)","text":"يقوم يصلي إن أراد ذلك.ويَقُومُ يُصَلِّي إِنْ أَرَادَ ذَلِكَ.","source":"Muslim 4/1773.","sourceUrl":"https://sunnah.com/hisn:115"}]},{"id":"wake","title":"الاستيقاظ","description":"أذكار الاستيقاظ من النوم","items":[{"id":"hisn-1","title":"ذكر من حصن المسلم (1)","text":"الحَمْـدُ لِلّهِ الّذي أَحْـيانا بَعْـدَ ما أَماتَـنا وَإليه النُّـشور","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 11/113; Muslim 4/2083","sourceUrl":"https://sunnah.com/hisn:1"},{"id":"hisn-2","title":"ذكر من حصن المسلم (2)","text":"لا إلهَ إلاّ اللّهُ وَحْـدَهُ لا شَـريكَ له، لهُ المُلـكُ ولهُ الحَمـد، وهوَ على كلّ شيءٍ قدير، سُـبْحانَ اللهِ، والحمْـدُ لله، ولا إلهَ إلاّ اللهُ واللهُ أكبَر، وَلا حَولَ وَلا قوّة إلاّ باللّهِ العليّ العظيم، رَبِّ اغْفرْ لي","source":"Whoever says this will be forgiven, and if he supplicates Allah, his prayer will be answered; if he performs ablution and prays, his prayer will be accepted. Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 3/39, among others. The wording here is from Ibn Majah 2/335.","sourceUrl":"https://sunnah.com/hisn:2"},{"id":"hisn-3","title":"ذكر من حصن المسلم (3)","text":"الحمدُ للهِ الذي عافاني في جَسَدي وَرَدّ عَليّ روحي وَأَذِنَ لي بِذِكْرِه","source":"At-Tirmidhi 5/473. See Al-Albani's Sahih Tirmidhi 3/144.","sourceUrl":"https://sunnah.com/hisn:3"},{"id":"hisn-4","title":"ذكر من حصن المسلم (4)","text":"إِنَّ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ وَاخْتِلاَفِ اللَّيْلِ وَالنَّهَارِ لآيَاتٍ لأُوْلِي الألْبَابِ {190} الَّذِينَ يَذْكُرُونَ اللهَ قِيَامًا وَقُعُودًا وَعَلَىَ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ رَبَّنَا مَا خَلَقْتَ هَذا بَاطِلاً سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ {191} رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ {192} رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلإِيمَانِ أَنْ ءامِنُواْ بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الأبْرَارِ {193} رَبَّنَا وَءاتِنَا مَا وَعَدتَّنَا عَلَى رُسُلِكَ وَلاَ تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لاَ تُخْلِفُ الْمِيعَادَ {194} فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لاَ أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَى بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيَارِهِمْ وَأُوذُواْ فِي سَبِيلِي وَقَاتَلُواْ وَقُتِلُواْ لأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ ثَوَابًا مِّن عِندِ اللهِ وَاللهُ عِندَهُ حُسْنُ الثَّوَابِ {195} لاَ يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُواْ فِي الْبِلاَدِ {196} مَتَاعٌ قَلِيلٌ ثُمَّ مَأْوَاهُمْ جَهَنَّمُ وَبِئْسَ الْمِهَادُ {197} لَكِنِ الَّذِينَ اتَّقَوْاْ رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ خَالِدِينَ فِيهَا نُزُلاً مِّنْ عِندِ اللهِ وَمَا عِندَ اللهِ خَيْرٌ لِّلأَبْرَارِ {198} وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن يُؤْمِنُ بِاللهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَاشِعِينَ للهِ لاَ يَشْتَرُونَ بِآيَاتِ اللهِ ثَمَنًا قَلِيلاً أُوْلَئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ اللهَ سَرِيعُ الْحِسَابِ {199} يَا أَيُّهَا الَّذِينَ ءامَنُواْ اصْبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَاتَّقُواْ اللهَ لَعَلَّكُمْ تُفْلِحُونَ {200}","source":"Qur'an Āl-'Imran 3: 190-200; Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 8/237; Muslim 1/530.","sourceUrl":"https://sunnah.com/hisn:4"}]},{"id":"prayer","title":"بعد الصلاة","description":"الأذكار بعد السلام من الصلاة","items":[{"id":"hisn-66","title":"ذكر من حصن المسلم (66)","text":"أَسْـتَغْفِرُ الله (ثَلاثاً) اللّهُـمَّ أَنْـتَ السَّلامُ وَمِـنْكَ السَّلام تَبارَكْتَ يا ذا الجَـلالِ وَالإِكْـرام","source":"Muslim 1/414.","sourceUrl":"https://sunnah.com/hisn:66"},{"id":"hisn-67","title":"ذكر من حصن المسلم (67)","text":"لا إلهَ إلاّ اللّهُ وحدَهُ لا شريكَ لهُ لهُ المُـلْكُ ولهُ الحَمْد وهوَ على كلّ شَيءٍ قَدير اللّهُـمَّ لا مانِعَ لِما أَعْطَـيْت وَلا مُعْطِـيَ لِما مَنَـعْت وَلا يَنْفَـعُ ذا الجَـدِّ مِنْـكَ الجَـد","source":"Al-Bukhari 1/255, Muslim 1/414.","sourceUrl":"https://sunnah.com/hisn:67"},{"id":"hisn-68","title":"ذكر من حصن المسلم (68)","text":"لا إلهَ إلاّ اللّه وحدَهُ لا شريكَ لهُ لهُ الملكُ ولهُ الحَمد وهوَ على كلّ شيءٍ قدير لا حَـوْلَ وَلا قـوَّةَ إِلاّ بِاللهِ لا إلهَ إلاّ اللّـه وَلا نَعْـبُـدُ إِلاّ إيّـاه لَهُ النِّعْـمَةُ وَلَهُ الفَضْل وَلَهُ الثَّـناءُ الحَـسَن لا إلهَ إلاّ اللّهُ مخْلِصـينَ لَـهُ الدِّينَ وَلَوْ كَـرِهَ الكـافِرون","source":"Muslim 1/415.","sourceUrl":"https://sunnah.com/hisn:68"},{"id":"hisn-69","title":"ذكر من حصن المسلم (69)","text":"سُـبْحانَ اللهِ والحَمْـدُ لله واللهُ أكْـبَر (ثلاثاً وثلاثين) لا إلهَ إلاّ اللّهُ وَحْـدَهُ لا شريكَ لهُ لهُ الملكُ ولهُ الحَمْد وهُوَ على كُلّ شَيءٍ قَـدير","source":"Muslim 1/418, Whoever says this after every prayer will be forgiven his sins even though they be as the foam of the sea.","sourceUrl":"https://sunnah.com/hisn:69"},{"id":"hisn-70","title":"ذكر من حصن المسلم (70)","text":"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ هُوَ اللَّهُ أَحَدٌ\\* اللَّهُ الصَّمَدُ\\* لَمْ يَلِدْ وَلَمْ يُولَدْ\\* وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ} بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ\\* مِن شَرِّ مَا خَلَقَ\\* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ\\* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ\\* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ} بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ {قُلْ أَعُوذُ بِرَبِّ النَّاسِ\\* مَلِكِ النَّاسِ\\* إِلَهِ النَّاسِ\\* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ\\* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ\\* مِنَ الْجِنَّةِ وَالنَّاسِ} بَعْدَ كُلِّ صَلاَةٍ.","source":"Abu Dawud 2/86, An-Nasa'i 3/68. See also Al-Albani, Sahih At-Tirmidhi 2/8.","sourceUrl":"https://sunnah.com/hisn:70"},{"id":"hisn-71","title":"ذكر من حصن المسلم (71)","text":"﴿اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾ عقب كل صلاة","source":"An-Nasa'i, 'Amalul-Yawm wal-Laylah (Hadith no. 100), also Ibn As-Sunni (no. 121). See also Al-Albani, Sahihul-Jami' As-Saghir 5/339 and Silsilatul-Ahadith As-Sahihah 2/697 (no. 972).","sourceUrl":"https://sunnah.com/hisn:71"},{"id":"hisn-72","title":"ذكر من حصن المسلم (72)","text":"لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ (عَشْرَ مَرّاتٍ بَعْدَ صَلاةِ الْمَغْرِبِ وَالصُّبْحِ)","source":"At-Tirmidhi 5/515, Ahmad 4/227. See its checking in Ibn Al-Qayyim Al-Jawziyyah's Zddul-Ma'ad 1/300.","sourceUrl":"https://sunnah.com/hisn:72"},{"id":"hisn-73","title":"ذكر من حصن المسلم (73)","text":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نافِعاً وَرِزْقاً طَيِّباً وَعَمَلاً مُتَقَبَّلاً (بَعْدَ السّلامِ مِنْ صَلاَةِ الفَجْرِ)","source":"Ibn Majah and others. See Sahih Ibn Majah 1/152 and Majma' Az-Zawa'id 10/111","sourceUrl":"https://sunnah.com/hisn:73"},{"id":"hisn-119","title":"ذكر من حصن المسلم (119)","text":"\"سبحان الملك القدوس\" ثلاث مرات والثالثة يجهر بها ويمد بها صوته \"ربِّ الملائكةِ والرّوح\"","source":"An-Nasa'i 3/244, Ad-Daraqutni and others. The final addition is from Ad-Daraqutni's version 2/ 31 and its chain of narration is authentic. See the checking of Zadul-Ma'ad by Shu'aib Al-Arna'ut and 'Abdul-Qadir Al-Arna'ut 1/337.","sourceUrl":"https://sunnah.com/hisn:119"}]},{"id":"mosque","title":"المسجد","description":"أذكار الذهاب إلى المسجد ودخوله والخروج منه","items":[{"id":"hisn-19","title":"ذكر من حصن المسلم (19)","text":"اللّهُـمَّ اجْعَـلْ فِي قَلْبـي نُوراً ، وَفي لِسَـانِي نُوراً، وَفِي سَمْعِي نُوراً, وَفِي بَصَرِيِ نُوراً, وَمِنْ فََوْقِي نُوراً , وَ مِنْ تَحْتِي نُوراً, وَ عَنْ يَمِينيِ نُوراَ, وعَنْ شِمَالِي نُوراً, وَمْن أَماَمِي نُوراً, وَمِنْ خَلْفيِ نُوراَ, واجْعَلْ فِي نَفْسِي نُوراً, وأَعْظِمْ لِي نُوراً, وَعظِّمْ لِي نُوراً, وَاجْعَلْ لِي نُوراً, واجْعَلنِي نُوراً, أللَّهُمَّ أَعْطِنِي نُوراً, واجْعَلْ فِي عَصَبِي نُوراً, وَفِي لَحْمِي نُوراً, وَفِي دَمِي نُوراً وَفِي شَعْرِي نُوراً, وفِي بَشَرِي نُوراً (أَللَّهُمَّ اجِعَلْ لِي نُوراً فِي قّبْرِي وَ نُوراَ فِي عِظاَمِي) (وَزِدْنِي نُوراً, وَزِدْنِي نُوراَ , وَزِدْنِي نُوراً) (وَهَبْ لِي نُوراً عَلَى نُوراً )","source":"1 Up to this point was reported by Al-Bukhari 11 / 116 (Hadith no. 6316) and by Muslim 1/526, 529-530 (Hadithno. 763).","sourceUrl":"https://sunnah.com/hisn:19"},{"id":"hisn-20","title":"ذكر من حصن المسلم (20)","text":"وَبِوَجْهِـهِ الكَرِيـم\nمِنَ الشّيْـطانِ الرَّجـيم،\n[ بِسْـمِ الله، وَالصَّلاةُ وَالسَّلامُ عَلى رَسولِ الله]،\nاللّهُـمَّ افْتَـحْ لي أَبْوابَ رَحْمَتـِك","source":"1\\. Abu Dawud and Al-Albani, Sahihul-Jdmi' As-Saghir (Hadithno. 4591). 2. Ibn As-Sunni (Hadith no. 88), graded good by Al-Albani. 3. Abu Dawud 1/126, see also Al-Albani, Sahihul-Jami'As-Saghir 1/528. 4. Muslim 1/494. There is also a report in Sunan Ibn Majah on the authority of Fatimah (RA), : \"O Allah, forgive me my sins and open for me the doors of Your mercy.\" It was graded authentic by Al-Albani due to supporting Ahadith. See Sahih Ibn Majah 1/128-9.","sourceUrl":"https://sunnah.com/hisn:20"},{"id":"hisn-21","title":"ذكر من حصن المسلم (21)","text":"بِسمِ الله وَالصّلاةُ وَالسّلامُ عَلى رَسولِ الله، اللّهُـمَّ إِنّـي أَسْأَلُكَ مِـنْ فَضْـلِك، اللّهُـمَّ اعصِمْنـي مِنَ الشَّيْـطانِ الرَّجـيم","source":"ibid.","sourceUrl":"https://sunnah.com/hisn:21"}]},{"id":"home","title":"المنزل","description":"الذكر عند دخول المنزل والخروج منه","items":[{"id":"hisn-16","title":"ذكر من حصن المسلم (16)","text":"بِسْمِ اللهِ ، تَوَكَّلْـتُ عَلى اللهِ وَلا حَوْلَ وَلا قُـوَّةَ إِلاّ بِالله","source":"Abu Dawud 4/325, At-Tirmidhi 5/490. See also Al-Albani, Sahih At-Tirmidhi 3/151","sourceUrl":"https://sunnah.com/hisn:16"},{"id":"hisn-17","title":"ذكر من حصن المسلم (17)","text":"اللّهُـمَّ إِنِّـي أَعـوذُ بِكَ أَنْ أَضِـلَّ أَوْ أُضَـل ، أَوْ أَزِلَّ أَوْ أُزَل ، أَوْ أَظْلِـمَ أَوْ أَُظْلَـم ، أَوْ أَجْهَلَ أَوْ يُـجْهَلَ عَلَـيّ","source":"Abu Dawud, Ibn Majah, An-Nasa'i, At-Tirmidhi. See also Al-Albani, Sahih At-Tirmidhi 3/152 and Sahih Ibn Majah 2/336","sourceUrl":"https://sunnah.com/hisn:17"},{"id":"hisn-18","title":"ذكر من حصن المسلم (18)","text":"بِسْـمِ اللهِ وَلَجْنـا، وَبِسْـمِ اللهِ خَـرَجْنـا، وَعَلـى رَبِّنـا تَوَكّلْـن (ثم ليسلم على أهله.)","source":"Abu Dawud 4/325. Muslim {Hadith no. 2018) says that one should mention the Name of Allah when entering the home and when beginning to eat; and that the devil, hearing this, says: \"There is no shelter for us here tonight and no food.\"","sourceUrl":"https://sunnah.com/hisn:18"}]},{"id":"food","title":"الطعام","description":"أذكار الطعام وعقب الفراغ منه","items":[{"id":"hisn-178","title":"ذكر من حصن المسلم (178)","text":"إِذَا أَكَلَ أَحَدُكُمْ طَعَاماً فَلْيَقُلْ بِسْمِ اللَّهِ، فَإِنْ نَسِيَ فِي أَوَّلِهِ فَلْيَقُلْ بسمِ اللَّهِ فِي أَوَّلِهِ وَآخِرِهِ","source":"Abu Dawud 3/347, At-Tirmidhi 4/288. See Al- Albani's Sahih At-Tirmidhi 2/167.","sourceUrl":"https://sunnah.com/hisn:178"},{"id":"hisn-179","title":"ذكر من حصن المسلم (179)","text":"مَنْ أَطْعَمَهُ اللَّهُ الطَّعَامَ فَلْيَقُلْ: \"اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَأَطْعِمْنَا خَيْراً مِنْهُ\"،\nوَمَنْ سَقَاهُ اللَّهُ لَبَناً فَلْيَقُلْ \"اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَزِدْنَا مِنْهُ\"\nالدعاء عند الفراغ من الطعام","source":"At-Tirmidhi 5/506. See also Al-Albani, Sahih At-Tirmidhi 3/158.","sourceUrl":"https://sunnah.com/hisn:179"},{"id":"hisn-180","title":"ذكر من حصن المسلم (180)","text":"الْحَمْـدُ للهِ الَّذي أَطْعَمَنـي هـذا وَرَزَقَنـيهِ مِنْ غَـيْرِ حَوْلٍ مِنِّي وَلا قُوَّة","source":"At-Tirmidhi, Abu Dawud, and Ibn Majah. See also Al-Albani, Sahih At-Tirmidhi 3/159.","sourceUrl":"https://sunnah.com/hisn:180"},{"id":"hisn-181","title":"ذكر من حصن المسلم (181)","text":"الْحَمْـدُ للهِ حَمْـداً كَثـيراً طَيِّـباً مُبـارَكاً فيه، غَيْرَ مَكْفِيٍّ وَلا مُوَدَّعٍ وَلا مُسْتَغْـنىً عَنْـهُ رَبَّـنا","source":"Al-Bukhari 6/214, At-Tirmidhi 5/507.","sourceUrl":"https://sunnah.com/hisn:181"},{"id":"hisn-182","title":"ذكر من حصن المسلم (182)","text":"اللّهُـمَّ بارِكْ لَهُمْ فيما رَزَقْـتَهُم، وَاغْفِـرْ لَهُـمْ وَارْحَمْهُمْ\nالدعاء إذا أراد الطعام أو الشراب","source":"Muslim 3/1615.","sourceUrl":"https://sunnah.com/hisn:182"},{"id":"hisn-183","title":"ذكر من حصن المسلم (183)","text":"اللّهُـمَّ أَطْعِمْ مَن أَطْعَمَني، وَاسْقِ مَن سقاني\nالدعاء إذا أفطر عند أهل بيت","source":"Muslim 3/126.","sourceUrl":"https://sunnah.com/hisn:183"},{"id":"hisn-184","title":"ذكر من حصن المسلم (184)","text":"أَفْطَـرَ عِنْدَكُم الصّـائِمونَ وَأَكَلَ طَعامَـكُمُ الأبْـرار، وَصَلَّـتْ عَلَـيْكُمُ الملائِكَـة\nدعاء الصائم إذا حضر الطعام ولم يفطر","source":"Abu Dawud 3/367, Ibn Majah 1/556, An-Nasa'i, 'Amalul-Yawm wal-Laylah 296-8. Al-Albani graded it authentic in Sahih Abu Dawud 2/730.","sourceUrl":"https://sunnah.com/hisn:184"},{"id":"hisn-185","title":"ذكر من حصن المسلم (185)","text":"(إِذَا دُعِيَ أَحَدُكُمْ فَلْيُجِبْ، فَإِنْ كَانَ صَائِماً فَلْيُصَلِّ، وَإِنْ كَانَ مُفْطِراً فَلْيَطْعَمْ) ، وَمَعْنَى فَلْيُصَلِّ أَيْ فَلْيَدْعُ.\nما يقول الصائم إذا سابه أحد","source":"Muslim 2/1054.","sourceUrl":"https://sunnah.com/hisn:185"}]},{"id":"travel","title":"السفر","description":"أدعية السفر ودخول البلد والعودة","items":[{"id":"hisn-207","title":"ذكر من حصن المسلم (207)","text":"\"اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ \\* وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ﴾ اللَّهُمَّ إِنّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا البِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَليفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ\"،\nوإذا رَجَعَ قَالَهُنَّ وَزَادَ فِيهِنَّ: \"آيِبُونَ، تائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ\".\nدعاء دخول القرية أو البلدة","source":"Muslim 2/978.","sourceUrl":"https://sunnah.com/hisn:207"},{"id":"hisn-208","title":"ذكر من حصن المسلم (208)","text":"أللّـهُمَّ رَبَّ السَّـمواتِ السّـبْعِ وَما أَظْلَلَـن، وَرَبَّ الأَراضيـنَ السّـبْعِ وَما أقْلَلْـن، وَرَبَّ الشَّيـاطينِ وَما أَضْلَلْـن، وَرَبَّ الرِّياحِ وَما ذَرَيْـن، أَسْـأَلُـكَ خَيْـرَ هذهِ الْقَـرْيَةِ وَخَيْـرَ أَهْلِـها، وَخَيْـرَ ما فيها، وَأَعـوذُ بِكَ مِنْ شَـرِّها وَشَـرِّ أَهْلِـها، وَشَـرِّ ما فيها","source":"Al-Hakim who graded it authentic and Ath-Tfaahabi agreed 2/100, and Ibn As-Sunni (no. 524). Al-Hafidh graded it good in his checking of Al-'Athkdr 5/154. Ibn Baz said in Tuhfatul-'Akhydr p. 37, that An-Nasa'i recorded it with a good chain of narration.","sourceUrl":"https://sunnah.com/hisn:208"},{"id":"hisn-211","title":"ذكر من حصن المسلم (211)","text":"أَسْتَـوْدِعُكُـمُ اللَّهَ الَّذي لا تَضـيعُ وَدائِعُـه","source":"Ahmad 2/403, Ibn Majah 2/943. See also Al-Albani, Sahih Ibn Majah 2/133.","sourceUrl":"https://sunnah.com/hisn:211"},{"id":"hisn-212","title":"ذكر من حصن المسلم (212)","text":"أَسْتَـوْدِعُ اللَّهَ ديـنَكَ وَأَمانَتَـكَ، وَخَـواتيـمَ عَمَـلِك","source":"Ahmad 2/7, At-Tirmidhi 5/499. See also Al-Albani, Sahih At-Tirmidhi 2/155.","sourceUrl":"https://sunnah.com/hisn:212"},{"id":"hisn-213","title":"ذكر من حصن المسلم (213)","text":"زَوَّدَكَ اللَّهُ التقْوى، وَغَفَـرَذَنْـبَكَ، وَيَسَّـرَ لَكَ الخَـيْرَ حَيْـثُما كُنْـت\nالتكبير والتسبيح في سير السفر","source":"At-Tirmidhi. See Al-Albani, Sahih At-Tirmidhi, 3/155.","sourceUrl":"https://sunnah.com/hisn:213"},{"id":"hisn-214","title":"ذكر من حصن المسلم (214)","text":"قَالَ جَابِرٌ رضي الله عنه: (كُنَّا إِذَا صَعَدْنَا كَبَّرْنَا، وَإِذَا نَزَلْنَا سَبَّحْنَا)","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 6/135.","sourceUrl":"https://sunnah.com/hisn:214"},{"id":"hisn-215","title":"ذكر من حصن المسلم (215)","text":"سَمِـعَ سـامِعٌ بِحَمْـدِ اللهِ وَحُسْـنِ بَلائِـهِ عَلَيْـنا. رَبَّنـا صـاحِبْـنا وَأَفْـضِل عَلَيْـنا عائِذاً باللهِ مِنَ النّـار\nالدعاء إذا نزل منزلا في سفر أو غيره","source":"Muslim 4/2086, the meaning of sami`a sāmi`un (who listens has heard) is that 'a witness has witnessed our praise of Allah due to His blessings and favor upon us.' It could also be read samma`a sāmi`un, in which case it means 'one who has heard this statement of mine will convey it to another and he will say it as well.' This is due to the attention given to the Thikr (remembrance of Allah) and supplications made during the early morning hours. The meaning of his saying 'Our Lord, be with us and bestow Your favor upon us' is: 'Our Lord, protect us and guard us. Bless us with Your numerous bounties, and avert from us every evil.' See An-Nawawi, Sharh Sahih Muslim 17/39.","sourceUrl":"https://sunnah.com/hisn:215"},{"id":"hisn-216","title":"ذكر من حصن المسلم (216)","text":"أَعـوذُ بِكَلِـماتِ اللّهِ التّـامّاتِ مِنْ شَـرِّ ما خَلَـق","source":"Muslim 4/2080.","sourceUrl":"https://sunnah.com/hisn:216"},{"id":"hisn-217","title":"ذكر من حصن المسلم (217)","text":"يُكَبِّرُ عَلَى كُلِّ شَرَفٍ ثَلاَثَ تَكْبِيرَاتٍ ثُمَّ يَقُولُ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنا حَامِدُونَ، صَدَقَ اللَّهُ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزابَ وَحْدَهُ\nما يقول من أتاه أمر يسره أو يكرهه","source":"Bukhari 7/163, Muslim 2/980. The Prophet (ﷺ) used to say this when returning from a campaign or from Hajj.","sourceUrl":"https://sunnah.com/hisn:217"}]},{"id":"riding","title":"الركوب","description":"دعاء ركوب وسيلة النقل","items":[{"id":"hisn-206","title":"ذكر من حصن المسلم (206)","text":"بِسْـمِ اللهِ وَالْحَمْـدُ لله، ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ \\* وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ﴾ الحَمْـدُ لله، الحَمْـدُ لله، الحَمْـدُ لله، اللهُ أكْـبَر، اللهُ أكْـبَر، اللهُ أكْـبَر، سُـبْحانَكَ اللّهُـمَّ إِنّي ظَلَـمْتُ نَفْسي فَاغْـفِرْ لي، فَإِنَّهُ لا يَغْفِـرُ الذُّنوبَ إِلاّ أَنْـت","source":"Abu Dawud 3/34, At-Tirmidhi 5/501. See also Al-Albani, Sahih At-Tirmidhi3/156.","sourceUrl":"https://sunnah.com/hisn:206"}]},{"id":"wudu","title":"الوضوء","description":"الذكر قبل الوضوء وبعده","items":[{"id":"hisn-12","title":"ذكر من حصن المسلم (12)","text":"الذكر بعد الفراغ من الوضوء","source":"Abu Dawud, Ibn Majah, and Ahmad. See also Al-Albani, 'Irwa'ul-Ghain 1/122.","sourceUrl":"https://sunnah.com/hisn:12"},{"id":"hisn-13","title":"ذكر من حصن المسلم (13)","text":"أَشْهَدُ أَنْ لا إِلَـهَ إِلاّ اللهُ وَحْدَهُ لا شَريـكَ لَـهُ وَأَشْهَدُأَنَّ مُحَمّـداً عَبْـدُهُ وَرَسـولُـه","source":"Muslim 1/209.","sourceUrl":"https://sunnah.com/hisn:13"},{"id":"hisn-14","title":"ذكر من حصن المسلم (14)","text":"اللّهُـمَّ اجْعَلنـي مِنَ التَّـوّابينَ وَاجْعَـلْني مِنَ المتَطَهّـرين.","source":"At-Tirmidhi 1/78. See also Al-Albani, Sahih At- Tirmidhi 1/18","sourceUrl":"https://sunnah.com/hisn:14"},{"id":"hisn-15","title":"ذكر من حصن المسلم (15)","text":"سُبْحـانَكَ اللّهُـمَّ وَبِحَمدِك أَشْهَـدُ أَنْ لا إِلهَ إِلاّ أَنْتَ أَسْتَغْفِرُكَ وَأَتوبُ إِلَـيْك\nالذكر عند الخروج من المنزل","source":"An-Nasa'i, 'Amalul-Yawm wal-Laylah, p. 173. See also Al-Albani, 'Irwa'ul-Ghalil 1/135 and 2/94.","sourceUrl":"https://sunnah.com/hisn:15"}]},{"id":"distress","title":"الكرب والهم","description":"أدعية الهم والكرب وتيسير الأمر","items":[{"id":"hisn-120","title":"ذكر من حصن المسلم (120)","text":"اللّهُـمَّ إِنِّي عَبْـدُكَ ابْنُ عَبْـدِكَ ابْنُ أَمَتِـكَ نَاصِيَتِي بِيَـدِكَ مَاضٍ فِيَّ حُكْمُكَ عَدْلٌ فِيَّ قَضَاؤكَ أَسْأَلُـكَ بِكُلِّ اسْمٍ هُوَ لَكَ سَمَّـيْتَ بِهِ نَفْسَكَ أِوْ أَنْزَلْتَـهُ فِي كِتَابِكَ أَوْ عَلَّمْـتَهُ أَحَداً مِنْ خَلْقِـكَ أَوِ اسْتَـأْثَرْتَ بِهِ فِي عِلْمِ الغَيْـبِ عِنْـدَكَ أَنْ تَجْـعَلَ القُرْآنَ رَبِيـعَ قَلْبِـي وَنورَ صَـدْرِي وجَلَاءَ حُـزْنِي وذَهَابَ هَمِّـي","source":"Ahmad 1/391, and Al-Albani graded it authentic.","sourceUrl":"https://sunnah.com/hisn:120"},{"id":"hisn-121","title":"ذكر من حصن المسلم (121)","text":"اللّهُـمَّ إِنِّي أَعْوذُ بِكَ مِنَ الهَـمِّ وَ الْحُـزْنِ، والعًجْـزِ والكَسَلِ والبُخْـلِ والجُـبْنِ، وضَلْـعِ الـدَّيْنِ وغَلَبَـةِ الرِّجال","source":"Al-Bukhari 7/158. See also Al-Asqalani, Fathul-Bari 11/173.","sourceUrl":"https://sunnah.com/hisn:121"},{"id":"hisn-122","title":"ذكر من حصن المسلم (122)","text":"لَا إلَهَ إِلَّا اللَّهُ الْعَظـيمُ الْحَلِـيمْ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ العَـرْشِ العَظِيـمِ، لَا إِلَـهَ إِلَّا اللَّهْ رَبُّ السَّمَـوّاتِ ورّبُّ الأَرْضِ ورَبُّ العَرْشِ الكَـريم","source":"Al-Bukhari 8/154, Muslim 4/2092","sourceUrl":"https://sunnah.com/hisn:122"},{"id":"hisn-123","title":"ذكر من حصن المسلم (123)","text":"اللّهُـمَّ رَحْمَتَـكَ أَرْجـو فَلا تَكِلـني إِلى نَفْـسي طَـرْفَةَ عَـيْن، وَأَصْلِـحْ لي شَأْنـي كُلَّـه لَا إِلَهَ إِلَّا أنْـت","source":"Abu Dawud 4/324, Ahmad 5/42. Al-Albani graded it as good in Sahih Abu Dawud 3/959.","sourceUrl":"https://sunnah.com/hisn:123"},{"id":"hisn-124","title":"ذكر من حصن المسلم (124)","text":"لَا إِلَهَ إِلَّا أنْـت سُـبْحانَكَ إِنِّي كُنْـتُ مِنَ الظّـالِميـن","source":"At-Tirmidhi 5/529. Al-Hakim declared it authentic and Ath-Thahabi agreed with him 1/ 505. See also Al-Albani, Sahih At-Tirmidhi 3/168.","sourceUrl":"https://sunnah.com/hisn:124"},{"id":"hisn-125","title":"ذكر من حصن المسلم (125)","text":"اللهُ اللهُ رَبِّي لا أُشْـرِكُ بِهِ شَيْـئاً\nدعاء لقاء العدو وذي السلطان","source":"Abu Dawud 2/87. See also Al-Albani, Sahih Ibn Mdjah 2/335.","sourceUrl":"https://sunnah.com/hisn:125"},{"id":"hisn-136","title":"ذكر من حصن المسلم (136)","text":"اللّهُـمَّ اكْفِـني بِحَلالِـكَ عَنْ حَـرامِـك، وَأَغْنِـني بِفَضْـلِكَ عَمَّـنْ سِـواك","source":"At-Tirmidhi 5/560. See also Al-Albani, Sahih At-Tirmidhi 3/180.","sourceUrl":"https://sunnah.com/hisn:136"},{"id":"hisn-137","title":"ذكر من حصن المسلم (137)","text":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ\nدعاء الوسوسة في الصلاة والقراءة","source":"Al-Bukhari 7/158.","sourceUrl":"https://sunnah.com/hisn:137"},{"id":"hisn-139","title":"ذكر من حصن المسلم (139)","text":"اللَّهُمَّ لاَ سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلاً\nما يقول ويفعل من أذنب ذنباً","source":"Ibn Hibban in his Sahih (no. 2427), and Ibn As- Sunni (no. 351). Al-Hafidh (Ibn Hajar) said that this Hadith is authentic. It was also declared authentic by 'Abdul-Qadir Al-Arna'ut in his checking of An-Nawawi's Kitabul-Athkarp. 106.","sourceUrl":"https://sunnah.com/hisn:139"},{"id":"hisn-144","title":"ذكر من حصن المسلم (144)","text":"قَدَّرَ اللهُ وَما شـاءَ فَعَـل\nتهنئة المولود له وجوابه","source":"\"The strong believer is better and more dear to Allah than the weak believer, and in each of them there is good. Be vigilant for what is to your benefit and seek the help of Allah and do not falter. But when you are striken by some setback, do not say: 'If only I had done such and such,' rather say: 'It is the Decree of Allah and He does whatever He wills.' For verily the saying 'if (i.e. if only I had) begins the work of the Devil.\" Muslim 4/2052.","sourceUrl":"https://sunnah.com/hisn:144"}]},{"id":"istighfar","title":"الاستغفار والتوبة","description":"أذكار الاستغفار والتوبة","items":[{"id":"hisn-140","title":"ذكر من حصن المسلم (140)","text":"مَا مِنْ عَبْدٍ يُذنِبُ ذَنْباً فَيُحْسِنُ الطُّهُورَ، ثُمَّ يَقُومُ فَيُصَلِّي رَكْعَتَيْنِ، ثُمَّ يَسْتَغْفِرُ اللَّهَ إِلاَّ غَفَرَ اللَّهُ لَهُ\nدعاء طرد الشيطان ووساوسه","source":"Abu Dawud 2/86, At-Tirmidhi 2/257. Al-Albani graded it authentic in Sahih Abu Dawud 1/283.","sourceUrl":"https://sunnah.com/hisn:140"},{"id":"hisn-248","title":"ذكر من حصن المسلم (248)","text":"قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: \"وَاللَّهِ إِنِّي لأَسْتَغفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةٍ\"","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 11/101.","sourceUrl":"https://sunnah.com/hisn:248"},{"id":"hisn-249","title":"ذكر من حصن المسلم (249)","text":"وَقَالَ صلى الله عليه وسلم: (يَا أَيُّهَا النَّاسُ تُوبُوا إِلَى اللَّهِ فَإِنِّي أَتُوبُ فِي الْيَوْمِ إِلَيْهِ مِائَةَ مَرَّةٍ)","source":"Muslim 4/2076.","sourceUrl":"https://sunnah.com/hisn:249"},{"id":"hisn-250","title":"ذكر من حصن المسلم (250)","text":"وَقَالَ صلى الله عليه وسلم: مَنْ قَالَ (أَسْتَغْفِرُ اللَّهَ الْعَظيمَ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ القَيّوُمُ وَأَتُوبُ إِلَيهِ)، غَفَرَ اللَّهُ لَهُ وَإِنْ كَانَ فَرَّ مِنَ الزَّحْفِ.","source":"Abu Dawud 2/85, At-Tirmidhi 5/569, and Al-Hakim who declared it authentic and Ath-Thahabi agreed with him 1/511. Al-Albani graded it authentic in Sahih At-Tirmidhi 3/182. See also Jami'ul-'Usool li-'Ahdaith Ar-Rasool 4/ 389-90 checked by Al-Arna'ut.","sourceUrl":"https://sunnah.com/hisn:250"},{"id":"hisn-251","title":"ذكر من حصن المسلم (251)","text":"وَقَالَ صلى الله عليه وسلم: أَقْرَبُ مَا يَكُونُ الرَّبُّ مِنَ الْعَبْدِ فِي جَوْفِ اللَّيْلِ الآخِرِ فَإِنِ اسْتَطَعْتَ أَنْ تَكُونَ مِمَّنْ يَذْكُرُ اللَّهَ فِي تِلْكَ السَّاعَةِ فَكُنْ","source":"At-Tirmidhi, An-Nasa'i 1/279 and Al-Hakim. See also Al-Albani, Sahih At-Tirmidhi 3/183, and Jdmi'ul-'Usool with Al-Arna'ut's checking 4/144.","sourceUrl":"https://sunnah.com/hisn:251"},{"id":"hisn-252","title":"ذكر من حصن المسلم (252)","text":".وَقَالَ صلى الله عليه وسلم: أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ فَأَكثِرُوا الدُّعَاءَ.","source":"Muslim 1/350.","sourceUrl":"https://sunnah.com/hisn:252"},{"id":"hisn-253","title":"ذكر من حصن المسلم (253)","text":".وَقَالَ صلى الله عليه وسلم: إِنَّهُ لَيُغَانُ عَلَى قَلْبِي وَإِنِّي لأَسْتَغْفِرُ اللَّهَ فِي الْيَوْمِ مِائَةَ مَرَّةٍ.\nمن فضل التسبيح والتحميد ، والتهليل ، والتكبير","source":"Muslim 4/2075. Ibn 'Athir explains that the Prophet (ﷺ) was always vigilant in his remembrance and drawing near to Allah, and if he forgot to do any of what he normally did from time to time, or it slipped his mind, he felt as if he had wronged himself and so he would begin to seek the forgiveness of Allah. See Jami'ul-'Usool 4/386.","sourceUrl":"https://sunnah.com/hisn:253"}]},{"id":"illness","title":"المرض والعافية","description":"أدعية زيارة المريض والوجع","items":[{"id":"hisn-147","title":"ذكر من حصن المسلم (147)","text":"لا بأْسَ طَهـورٌ إِنْ شـاءَ الله","source":"Al-Bukhari, cf. Al-Asqalani Fathul-Bari 10/118.","sourceUrl":"https://sunnah.com/hisn:147"},{"id":"hisn-148","title":"ذكر من حصن المسلم (148)","text":"أَسْـأَلُ اللهَ العَـظيـم، رَبَّ العَـرْشِ العَـظيـم أَنْ يَشْفـيك . (سبع مرات)","source":"At-Tirmidhi, Abu Dawud. See also Al-Albani, Sahih At-Tirmidhi 2/210 and Sahihul-Jami' As-Saghir 5/180.","sourceUrl":"https://sunnah.com/hisn:148"},{"id":"hisn-149","title":"ذكر من حصن المسلم (149)","text":"قَالَ صلى الله عليه وسلم: (إِذَا عَادَ الرَّجُلُ أَخَاهُ الْمُسْلِمَ مَشَى فِي خِرَافَةِ الْجَنَّةِ حَتَّى يَجْلِسَ، فَإِذَا جَلَسَ غَمَرَتْهُ الرَّحْمَةُ، فَإِنْ كَانَ غُدْوَةً صَلَّى عَلَيْهِ سَبْعُونَ أَلْفَ مَلَكٍ حَتَّى يُمْسِيَ، وَإِنْ كَانَ مَسَاءً صَلَّى عَلَيْهِ سَبْعُونَ أَلْفَ مَلَكٍ حَتَّى يُصْبِحَ)\nدعاء المريض الذي يئس من حياته","source":"حصن المسلم، الذكر رقم 149","sourceUrl":"https://sunnah.com/hisn:149"},{"id":"hisn-150","title":"ذكر من حصن المسلم (150)","text":"أللّهُـمَّ اغْفِـرْ لي وَارْحَمْـني وَأَلْحِقْـني بِالرَّفـيقِ الأّعْلـى","source":"Al-Bukhari7/10, Muslim 4/1893.","sourceUrl":"https://sunnah.com/hisn:150"},{"id":"hisn-151","title":"ذكر من حصن المسلم (151)","text":"جعل النبي صلى الله عليه وسلم عند موته يدخل يديه في الماء فيمسح بهما وجههُ ويقول : لا إله إلا الله إن للموت لسكرات","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 8/144. The Hadith also mention him using the Siivak (tooth stick).","sourceUrl":"https://sunnah.com/hisn:151"},{"id":"hisn-152","title":"ذكر من حصن المسلم (152)","text":"لا إلهَ إلاّ اللّهُ وَاللّهُ أَكْبَـر، لا إلهَ إلاّ اللّهُ وحْـدَهُ، لا إلهَ إلاّ اللّهُ وحْـدَهُ لا شَريكَ لهُ، لا إلهَ إلاّ اللّهُ لهُ المُلكُ ولهُ الحَمْد، لا إلهَ إلاّ اللّهُ وَلا حَـوْلَ وَلا قُـوَّةَ إِلاّ بِالله\nتلقين المحتضر لا إله إلا الله","source":"At-Tirmidhi and Ibn Majah. See also Al-Albani, Sahih At-Tirmidhi 3/152 and Sahih Ibn Majah 2/317.","sourceUrl":"https://sunnah.com/hisn:152"},{"id":"hisn-153","title":"ذكر من حصن المسلم (153)","text":"من كان آخر كلامه \"لا إله إلا الله\" دخل الجنة","source":"Abu Dawud 3/190. See also Al-Albani, Sahihul-Jami' As-Saghir 5/432.","sourceUrl":"https://sunnah.com/hisn:153"},{"id":"hisn-243","title":"ذكر من حصن المسلم (243)","text":"ضَعْ يَدَكَ عَلَى الَّذِي تَألَّمَ مِنْ جَسَدِكَ وَقُلْ: \"بِسْمِ اللَّهِ\" ثَلاَثاً، وَقُلْ سَبْعَ مَرَّاتٍ: \"أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ\"\nما يقول من خشي أن يصيب شيئاً بعينه","source":"Muslim 4/1728.","sourceUrl":"https://sunnah.com/hisn:243"}]},{"id":"weather","title":"المطر والطقس","description":"أدعية الريح والرعد والمطر","items":[{"id":"hisn-166","title":"ذكر من حصن المسلم (166)","text":"اللّهُـمَّ إِنَّـي أَسْـأَلُـكَ خَيْـرَها، وَأَعـوذُ بِكَ مِنْ شَـرِّها","source":"Abu Dawud 4/326, Ibn Majah 2/1228. See also Al-Albani, Sahih Ibn Majah 2/305.","sourceUrl":"https://sunnah.com/hisn:166"},{"id":"hisn-167","title":"ذكر من حصن المسلم (167)","text":"اللّهُـمَّ إِنَّـي أَسْـأَلُـكَ خَيْـرَها، وَخَيْـرَ ما فيهـا، وَخَيْـرَ ما اُرْسِلَـتْ بِه، وَأَعـوذُ بِكَ مِنْ شَـرِّها، وَشَـرِّ ما فيهـا، وَشَـرِّ ما اُرْسِلَـتْ بِه","source":"Muslim 2/616, Al-Bukhari 4/76.","sourceUrl":"https://sunnah.com/hisn:167"},{"id":"hisn-168","title":"ذكر من حصن المسلم (168)","text":"سُبْـحانَ الّذي يُسَبِّـحُ الـرَّعْدُ بِحَمْـدِهِ، وَالملائِكـةُ مِنْ خيـفَته","source":"Whenever Abdullah bin Zubair (RA) would hear thunder, he would abandon all conversation and say this supplication. See Al-Muwatta' 2/992. It was graded authentic by Al-Albani as a statement of Abdullah bin Zubayr only.","sourceUrl":"https://sunnah.com/hisn:168"},{"id":"hisn-169","title":"ذكر من حصن المسلم (169)","text":"اللّهُمَّ اسْقِـنا غَيْـثاً مُغيـثاً مَريئاً مُريـعاً، نافِعـاً غَيْـرَ ضار، عاجِـلاً غَـيْرَ آجِل","source":"Abu Dawud 1/303. See also Al-Albani SahihAbu Dawud 1/216.","sourceUrl":"https://sunnah.com/hisn:169"},{"id":"hisn-170","title":"ذكر من حصن المسلم (170)","text":"اللّهُمَّ أغِثْنـا، اللّهُمَّ أغِثْنـا، اللّهُمَّ أغِثْنـا","source":"Al-Bukhari 1/224, Muslim 2/613.","sourceUrl":"https://sunnah.com/hisn:170"},{"id":"hisn-171","title":"ذكر من حصن المسلم (171)","text":"اللّهُمَّ اسْقِ عِبادَكَ وَبَهـائِمَك، وَانْشُـرْ رَحْمَـتَكَ وَأَحْيِي بَلَـدَكَ المَيِّـت","source":"Abu Dawud 1/305. Al-Albani graded it good in Sahih Abu Dawud 1/218.","sourceUrl":"https://sunnah.com/hisn:171"},{"id":"hisn-172","title":"ذكر من حصن المسلم (172)","text":"اللّهُمَّ صَيِّـباً نافِـعاً","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 2/518.","sourceUrl":"https://sunnah.com/hisn:172"},{"id":"hisn-173","title":"ذكر من حصن المسلم (173)","text":"مُطِـرْنا بِفَضْـلِ اللهِ وَرَحْمَـتِه","source":"Al-Bukhari 1/205, Muslim 1/83.","sourceUrl":"https://sunnah.com/hisn:173"},{"id":"hisn-174","title":"ذكر من حصن المسلم (174)","text":"اللّهُمَّ حَوالَيْنا وَلا عَلَيْـنا، اللّهُمَّ عَلى الآكـامِ وَالظِّـراب، وَبُطـونِ الأوْدِية، وَمَنـابِتِ الشَّجـر","source":"Al-Bukhari 1/224, Muslim 1/614","sourceUrl":"https://sunnah.com/hisn:174"}]},{"id":"protection","title":"الحفظ والحماية","description":"أدعية الاستعاذة ودفع الوسوسة والخوف","items":[{"id":"hisn-10","title":"ذكر من حصن المسلم (10)","text":"(بِسْمِ الله) اللّهُـمَّ إِنِّـي أَعـوذُ بِـكَ مِـنَ الْخُـبْثِ وَالْخَبائِث","source":"Al-Bukhari 1/45, Muslim 1/283. The addition of Bismillah at its beginning was reported by Said bin Mansur. See Fathul-Bari 1/244","sourceUrl":"https://sunnah.com/hisn:10"},{"id":"hisn-126","title":"ذكر من حصن المسلم (126)","text":"اللّهُـمَّ إِنا نَجْـعَلُكَ في نُحـورِهِـم، وَنَعـوذُ بِكَ مِنْ شُرورِهـمْ","source":"Abu Dawud 2/89, and Al-Hakim graded it authentic and Ath-Thahabi agreed 2/142.","sourceUrl":"https://sunnah.com/hisn:126"},{"id":"hisn-127","title":"ذكر من حصن المسلم (127)","text":"اللّهُـمَّ أَنْتَ عَضُـدي، وَأَنْتَ نَصـيري، بِكَ أَجـولُ وَبِكَ أَصـولُ وَبِكَ أُقـاتِل","source":"Abu Dawud 3/42, At-Tirmidhi 5/572. See also Al-Albani, Sahih At-Tirmidhi 3/183.","sourceUrl":"https://sunnah.com/hisn:127"},{"id":"hisn-128","title":"ذكر من حصن المسلم (128)","text":"حَسْبُـنا اللهُ وَنِعْـمَ الوَكـيل","source":"Al-Bukhari, 5/172.","sourceUrl":"https://sunnah.com/hisn:128"},{"id":"hisn-129","title":"ذكر من حصن المسلم (129)","text":"اللَّهُمَّ ربَّ السَّمَوَاتِ السَّبْعِ، وَرَبَّ الْعَرْشِ الْعَظِيمِ، كُنْ لِي جَاراً مِنْ فُلاَنِ بْنِ فُلاَنٍ، وَأَحْزَابِهِ مِنْ خَلاَئِقِكَ، أَنْ يَفْرُطَ عَلَيَّ أَحَدٌ مِنْهُمْ أَوْ يَطْغَى، عَزَّ جَارُكَ، وَجَلَّ ثَنَاؤُكَ، وَلاَ إِلَهَ إِلاَّ أَنْتَ","source":"Al-Bukhari, Al-'Adab Al-Mufrad (no. 707). Al-Albani graded it authentic in Sahih Al-'Adab Al-Mufrad (no. 545).","sourceUrl":"https://sunnah.com/hisn:129"},{"id":"hisn-130","title":"ذكر من حصن المسلم (130)","text":"الله أكبر، الله أعز من خلقه جميعاً ، الله أعز مما أخاف وأحذر ، أعوذ بالله الذي لا إله إلا هو ، الممسك السموات السبع أن يقعن على الأرض إلا بإذنه ، من شر عبدك فلان ، وجنوده وأتباعه وأشياعه ، من الجن والأنس ، اللهم كن لي جاراً من شرهم ، جل ثناؤك وعز جارك ، وتبارك اسمك ، ولا إله غيرك (ثلاث مرات)","source":"Al-Bukhari, 5/172.","sourceUrl":"https://sunnah.com/hisn:130"},{"id":"hisn-131","title":"ذكر من حصن المسلم (131)","text":"اللَّهُمَّ مُنْزِلَ الْكِتَاب سَرِيعَ الْحِسَاب اهْزِم الأَحْزَاب اللَّهُمَّ اهْزِمْهُمْ وَ زَلْزِلْهُم","source":"Muslim 3/1362.","sourceUrl":"https://sunnah.com/hisn:131"},{"id":"hisn-132","title":"ذكر من حصن المسلم (132)","text":"اللَّهُمَّ اكْفِنِيهِم بمَا شِئْت\nدعاء من أصابه شك في الإيمان","source":"Muslim 4/2300.","sourceUrl":"https://sunnah.com/hisn:132"},{"id":"hisn-133","title":"ذكر من حصن المسلم (133)","text":"يَنْتَهِي عَمَّا شك فِيهِ.","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 6/336, Muslim 1/120.","sourceUrl":"https://sunnah.com/hisn:133"},{"id":"hisn-135","title":"ذكر من حصن المسلم (135)","text":"يقرأ قوله تعالى ((هُوَ الأوَّلُ، وَالآخِـرُ، وَالظّـاهِـرُ، وَالْبـاطِـنُ، وَهُوَ بِكُلِّ شَيءٍ عَلـيم))","source":"Al-Hadid 57:3, Abu Dawud 4/329. Al-Albani graded it good in SahihAbu Dawud, 3/962.","sourceUrl":"https://sunnah.com/hisn:135"},{"id":"hisn-143","title":"ذكر من حصن المسلم (143)","text":"الْأَذْكَارُ وَقِرَاءَةُ الْقُرْآنِ\nالدعاء حينما يقع مالا يرضاه أو غلب على أمره","source":"\"Do not turn your homes into graveyards, surely the Devil flees from the house in which Surat Al-Baqarah is read,\" Muslim 1/539. The Devil is also driven out by the invocations for morning and evening, those that are said before sleeping and upon waking up, those for entering and leaving the house, including those for entering and leaving the mosque, and by many other authentic invocations taught to us by the Prophet (ﷺ) such as the reading of 'Ayatul-Kursi, (Al-Baqarah 2:255), and the last two 'Ayat of Surat Al-Baqarah before going to sleep. Whoever says: \"There is none worthy of worship but Allah alone, Who has no partner, His is the dominion and His is the praise, and he is Able to do all things,\" one hundred times, it will be a protection for him from the Devil throughout the day.'","sourceUrl":"https://sunnah.com/hisn:143"},{"id":"hisn-146","title":"ذكر من حصن المسلم (146)","text":"كان رسول الله صلى الله عليه وسلم يعوذ الحسن والحسين \" أعيذكما بكلمات الله التامة ، من كل شيطان وهامة ، ومن كل عينِ لامة \"","source":"Al-Bukhari4/119.","sourceUrl":"https://sunnah.com/hisn:146"}]},{"id":"misc","title":"أذكار متنوعة","description":"التسبيح والتحميد والتهليل والتكبير","items":[{"id":"hisn-254","title":"ذكر من حصن المسلم (254)","text":"قَالَ صلى الله عليه وسلم: مَنْ قَالَ (سُبْحَانَ اللَّهِ وَبِحَمْدِهِ) فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَلَوْ كَانَتْ مِثْلَ زَبَدِ الْبَحْر.","source":"Al-Bukhari 7/168, Muslim 4/2071, see also invocation no. 91 of this book.","sourceUrl":"https://sunnah.com/hisn:254"},{"id":"hisn-255","title":"ذكر من حصن المسلم (255)","text":"وَقَالَ صلى الله عليه وسلم: مَنْ قَالَ (لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ) عَشْرَ مِرَارٍ، كَانَ كَمَنْ أَعْتَقَ أَرْبَعَةَ أَنْفُسٍ مِنْ وَلَدِ إِسْمَاعِيلَ","source":"Al-Bukhari 7/67, Muslim 4/2071, see also invocation no. 93 of this book.","sourceUrl":"https://sunnah.com/hisn:255"},{"id":"hisn-256","title":"ذكر من حصن المسلم (256)","text":"وَقَالَ صلى الله عليه وسلم: كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: (سُبْحَانَ اللَّهِ وَبِحَمْدِهِ)، (سُبْحانَ اللَّهِ الْعَظِيمِ)","source":"Al-Bukhari 7/168, Muslim 4/2072.","sourceUrl":"https://sunnah.com/hisn:256"},{"id":"hisn-257","title":"ذكر من حصن المسلم (257)","text":"وَقَالَ صلى الله عليه وسلم: لَأَنْ أَقُولَ (سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ)، أَحَبُّ إِلَيَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمسُ.","source":"Muslim 4/2072.","sourceUrl":"https://sunnah.com/hisn:257"},{"id":"hisn-258","title":"ذكر من حصن المسلم (258)","text":"وَقَالَ صلى الله عليه وسلم: أَيَعْجِزُ أَحَدُكُم أَنْ يَكْسِبَ كُلَّ يَوْمٍ أَلْفَ حَسَنَةٍ؟ فَسَأَلَهُ سَائِلٌ مِنْ جُلَسَائِهِ كَيْفَ يَكْسِبُ أَحَدُنَا أَلْفَ حَسَنَةٍ؟ قَالَ: يُسَبِّحُ مِائَةَ تَسْبِيحَةٍ، فَيُكتَبُ لَهُ أَلْفُ حَسَنَةٍ أَوْ يُحَطُّ عَنْهُ أَلْفُ خَطِيئَةٍ.","source":"Muslim 4/2073.","sourceUrl":"https://sunnah.com/hisn:258"},{"id":"hisn-259","title":"ذكر من حصن المسلم (259)","text":"مَنْ قَالَ (سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ) غُرِسَتْ لَهُ نَخْلَةٌ فِي الْجَنَّةِ","source":"At-Tirmidhi 5/511, and Al-Hakim who graded it authentic and Ath-Thahabi agreed 1/501. See also Al-Albani, Sahihul-Jami' As-Saghir 5/531 and Sahih At-Tirmidhi3/160.","sourceUrl":"https://sunnah.com/hisn:259"},{"id":"hisn-260","title":"ذكر من حصن المسلم (260)","text":"وَقَالَ صلى الله عليه وسلم: يَا عَبْدَ اللَّهِ بْنَ قَيْسٍ أَلاَ أَدُلُّكَ عَلَى كَنْزٍ مِنْ كُنُوزِ الْجَنَّةِ؟ فَقُلْتُ: بَلَى يَا رَسُولَ اللَّهِ، قَالَ: قُلْ (لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ).","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 11/213, Muslim 4/2076.","sourceUrl":"https://sunnah.com/hisn:260"},{"id":"hisn-261","title":"ذكر من حصن المسلم (261)","text":"وَقَالَ صلى الله عليه وسلم: أَحَبُّ الْكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ: (سُبْحَانَ اللَّهِ)، وَ(الْحَمْدُ لِلَّهِ)، وَ(لاَ إِلَهَ إِلاَّ اللَّهُ)، وَ(اللَّهُ أَكْبَرُ)، لاَ يَضُرُّكَ بِأَيِّهِنَّ بَدَأتَ","source":"Muslim 3/1685.","sourceUrl":"https://sunnah.com/hisn:261"},{"id":"hisn-262","title":"ذكر من حصن المسلم (262)","text":"جَاءَ أَعْرَابِيٌّ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ: عَلِّمْنِي كَلاماً أَقُولُهُ: قَالَ: قُلْ (لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثِيراً، سُبْحَانَ اللَّهِ رَبِّ العَالَمِينَ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَزِيزِ الْحَكِيمِ). قَالَ: فَهَؤُلاَءِ لِرَبِّي، فَمَا لِي؟ قَالَ: قُلْ (اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَارْزُقْنِي).","source":"Muslim 4/2072, Abu Dawud reports the same Hadith with the addition: and when the Arab left, the Prophet (ﷺ) said: \"He has filled his hands with goodness.\" 1/220.","sourceUrl":"https://sunnah.com/hisn:262"},{"id":"hisn-263","title":"ذكر من حصن المسلم (263)","text":"كَانَ الرَّجُلُ إِذَا أَسْلَمَ عَلَّمَهُ النَّبيُّ صلى الله عليه وسلم الصَّلاَةَ ثُمَّ أَمَرَهُ أَنْ يَدْعُوَ بِهَؤُلاَءِ الْكَلِمَاتِ: (اللَّهُمَّ اغْفِرِ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَعَافِنِي وَارْزُقْنِي)","source":"Muslim 4/2073, and in one of Muslim's reports there is the addition: 'For these words combine [the goodness of] this world and the next.'","sourceUrl":"https://sunnah.com/hisn:263"},{"id":"hisn-264","title":"ذكر من حصن المسلم (264)","text":"إِنَّ أَفْضَلَ الدُّعَاءِ (الْحَمْدُ لِلَّهِ)، وَأَفْضَلَ الذِّكْرِ (لاَ إِلَهَ إِلاَّ اللَّهُ)","source":"At-Tirmidhi 5/462, Ibn Majah 2/1249, and Al-Hakim who graded it authentic and Ath-Tbahabi agreed 1/503. See Al-Albani, Sahihul-Jami' As-Saghir 1/362.","sourceUrl":"https://sunnah.com/hisn:264"},{"id":"hisn-265","title":"ذكر من حصن المسلم (265)","text":"الباقيات الصالحات : (سبحان الله) و(الحمد لله )، و(لا إله إلا الله)، و(الله أكبر) ،و (لا حول ولا قوة إلا بالله).","source":"Ahmad (no. 513) (Ahmad Shakir, ed.) and its chain of narration is authentic. See Majma'uz-Zawa'id 1/297. Ibn Hajar mentions it in Bulughul-Maram saying that Ibn Hibban and Al-Hakim considered it authentic.","sourceUrl":"https://sunnah.com/hisn:265"},{"id":"hisn-266","title":"ذكر من حصن المسلم (266)","text":"عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رضي الله عنهما قَالَ: رَأَيْتُ النَّبيَّ صلى الله عليه وسلم يَعْقِدُ التَّسْبِيحَ بِيَمِينِهِ.\nمن أنواع الخير والآداب الجامعة","source":"Abu Dawud with a different wording 2/81, and At-Tirmidhi 5/521. See also Al-Albani, Sahihul-Jami'As-Saghir 4/271 (no. 4865).","sourceUrl":"https://sunnah.com/hisn:266"},{"id":"hisn-267","title":"ذكر من حصن المسلم (267)","text":"إِذَا كَانَ جُنْحُ اللَّيْلِ – أَوْ أَمْسَيْتُم – فَـكُفُّوا صِبْيانَـكُم، فَإِنَّ الشَّيَاطِينَ تَنْتَشِرُ حِينَئِذٍ، فَإِذَا ذَهَبَ سَاعَةٌ مِنَ اللَّيلِ فَخَلُّوهُمْ، وَأَغْلِقُوا الأَبْوَابَ وَاذْكُرُوا اسْمَ اللَّهِ؛ فَإِنَّ الشَّيطَانَ لاَ يَفْتَحُ بَاباً مُغلَقاً، وَأَوْكُوا قِرَبَكُمْ، وَاذْكُرُوا اسْمَ اللَّهِ، وَخَمِّرُوا آنِيَتَكُم، وَاذْكُرُوا اسْمَ اللَّهِ، وَلَوْ أَنْ تَعْرُضُوا عَلَيْهَا شَيْئاً، وَأَطْفِئُوا مَصَابِيحَكُمْ.","source":"Al-Bukhari with Al-Fath 10/88 and Muslim 3/1595.","sourceUrl":"https://sunnah.com/hisn:267"}]}];window.WARDI_DUAS=[{"id":"hisn-1","title":"ذكر من حصن المسلم (1)","category":"When waking up","categoryEnglish":"أذكار الاستيقاظ من النوم","text":"الحَمْـدُ لِلّهِ الّذي أَحْـيانا بَعْـدَ ما أَماتَـنا وَإليه النُّـشور","source":"Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 11/113; Muslim 4/2083","sourceUrl":"https://sunnah.com/hisn:1"},{"id":"hisn-2","title":"ذكر من حصن المسلم (2)","category":"When waking up","categoryEnglish":"أذكار الاستيقاظ من النوم","text":"لا إلهَ إلاّ اللّهُ وَحْـدَهُ لا شَـريكَ له، لهُ المُلـكُ ولهُ الحَمـد، وهوَ على كلّ شيءٍ قدير، سُـبْحانَ اللهِ، والحمْـدُ لله، ولا إلهَ إلاّ اللهُ واللهُ أكبَر، وَلا حَولَ وَلا قوّة إلاّ باللّهِ العليّ العظيم، رَبِّ اغْفرْ لي","source":"Whoever says this will be forgiven, and if he supplicates Allah, his prayer will be answered; if he performs ablution and prays, his prayer will be accepted. Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 3/39, among others. The wording here is from Ibn Majah 2/335.","sourceUrl":"https://sunnah.com/hisn:2"},{"id":"hisn-3","title":"ذكر من حصن المسلم (3)","category":"When waking up","categoryEnglish":"أذكار الاستيقاظ من النوم","text":"الحمدُ للهِ الذي عافاني في جَسَدي وَرَدّ عَليّ روحي وَأَذِنَ لي بِذِكْرِه","source":"At-Tirmidhi 5/473. See Al-Albani's Sahih Tirmidhi 3/144.","sourceUrl":"https://sunnah.com/hisn:3"},{"id":"hisn-4","title":"ذكر من حصن المسلم (4)","category":"When waking up","categoryEnglish":"أذكار الاستيقاظ من النوم","text":"إِنَّ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ وَاخْتِلاَفِ اللَّيْلِ وَالنَّهَارِ لآيَاتٍ لأُوْلِي الألْبَابِ {190} الَّذِينَ يَذْكُرُونَ اللهَ قِيَامًا وَقُعُودًا وَعَلَىَ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ رَبَّنَا مَا خَلَقْتَ هَذا بَاطِلاً سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ {191} رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ {192} رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلإِيمَانِ أَنْ ءامِنُواْ بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الأبْرَارِ {193} رَبَّنَا وَءاتِنَا مَا وَعَدتَّنَا عَلَى رُسُلِكَ وَلاَ تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لاَ تُخْلِفُ الْمِيعَادَ {194} فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لاَ أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَى بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيَارِهِمْ وَأُوذُواْ فِي سَبِيلِي وَقَاتَلُواْ وَقُتِلُواْ لأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ ثَوَابًا مِّن عِندِ اللهِ وَاللهُ عِندَهُ حُسْنُ الثَّوَابِ {195} لاَ يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُواْ فِي الْبِلاَدِ {196} مَتَاعٌ قَلِيلٌ ثُمَّ مَأْوَاهُمْ جَهَنَّمُ وَبِئْسَ الْمِهَادُ {197} لَكِنِ الَّذِينَ اتَّقَوْاْ رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ خَالِدِينَ فِيهَا نُزُلاً مِّنْ عِندِ اللهِ وَمَا عِندَ اللهِ خَيْرٌ لِّلأَبْرَارِ {198} وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن يُؤْمِنُ بِاللهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَاشِعِينَ للهِ لاَ يَشْتَرُونَ بِآيَاتِ اللهِ ثَمَنًا قَلِيلاً أُوْلَئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ اللهَ سَرِيعُ الْحِسَابِ {199} يَا أَيُّهَا الَّذِينَ ءامَنُواْ اصْبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَاتَّقُواْ اللهَ لَعَلَّكُمْ تُفْلِحُونَ {200}","source":"Qur'an Āl-'Imran 3: 190-200; Al-Bukhari, cf. Al-Asqalani, Fathul-Bari 8/237; Muslim 1/530.","sourceUrl":"https://sunnah.com/hisn:4"},{"id":"hisn-5","title":"ذكر من حصن المسلم (5)","category":"When wearing a garment","categoryEnglish":"دعاء لبس الثوب","text":"الحمدُ للهِ الّذي كَساني هذا (الثّوب) وَرَزَقَنيه مِنْ غَـيـْرِ حَولٍ مِنّي وَلا قـوّة","source":"Al-Bukhari, Muslim, Abu Dawud, Ibn Majah, At-Tirmidhi. See also 'Irwa'ul-Ghalil 7/47.","sourceUrl":"https://sunnah.com/hisn:5"},{"id":"hisn-6","title":"ذكر من حصن المسلم (6)","category":"When wearing a new garment","categoryEnglish":"دعاء لبس الثوب الجديد","text":"اللّهُـمَّ لَـكَ الحَـمْـدُ أنْـتَ كَسَـوْتَنيهِ، أََسْأََلُـكَ مِـنْ خَـيرِهِ وَخَـيْرِ مَا صُنِعَ لَـه، وَأَعوذُ بِكَ مِـنْ شَـرِّهِ وَشَـرِّ مـا صُنِعَ لَـهُ\nالدعاء لمن لبس ثوباً جديداً","source":"Abu Dawud and At-Tirmidhi. See also Al-Albani, Mukhtasar Shama'il At-Tirmidhi, p. 47.","sourceUrl":"https://sunnah.com/hisn:6"},{"id":"hisn-7","title":"ذكر من حصن المسلم (7)","category":"To someone wearing a new garment","categoryEnglish":"الدعاء لمن لبس ثوباً جديداً","text":"تُبْـلي وَيُـخْلِفُ اللهُ تَعَالى","source":"Abu Dawud 4/41. See also Al-Albani Sahih Abu Dawud 2/760.","sourceUrl":"https://sunnah.com/hisn:7"},{"id":"hisn-8","title":"ذكر من حصن المسلم (8)","category":"To someone wearing a new garment","categoryEnglish":"الدعاء لمن لبس ثوباً جديداً","text":"اِلبَـس جَديـداً وَعِـشْ حَمـيداً وَمُـتْ شهيداً","source":"Ibn Majah 2/1178, Al-Baghawi 12/41. See also Al-Albani, Sahih Ibn Majah 2/275","sourceUrl":"https://sunnah.com/hisn:8"},{"id":"hisn-10","title":"ذكر من حصن المسلم (10)","category":"Before entering the bathroom","categoryEnglish":"دعاء دخول الخلاء","text":"(بِسْمِ الله) اللّهُـمَّ إِنِّـي أَعـوذُ بِـكَ مِـنَ الْخُـبْثِ وَالْخَبائِث","source":"Al-Bukhari 1/45, Muslim 1/283. The addition of Bismillah at its beginning was reported by Said bin Mansur. See Fathul-Bari 1/244","sourceUrl":"https://sunnah.com/hisn:10"},{"id":"hisn-12","title":"ذكر من حصن المسلم (12)","category":"Before ablution","categoryEnglish":"الذكر قبل الوضوء","text":"الذكر بعد الفراغ من الوضوء","source":"Abu Dawud, Ibn Majah, and Ahmad. See also Al-Albani, 'Irwa'ul-Ghain 1/122.","sourceUrl":"https://sunnah.com/hisn:12"},{"id":"hisn-13","title":"ذكر من حصن المسلم (13)","category":"Upon completing the ablution","categoryEnglish":"الذكر بعد الفراغ من الوضوء","text":"أَشْهَدُ أَنْ لا إِلَـهَ إِلاّ اللهُ وَحْدَهُ لا شَريـكَ لَـهُ وَأَشْهَدُأَنَّ مُحَمّـداً عَبْـدُهُ وَرَسـولُـه","source":"Muslim 1/209.","sourceUrl":"https://sunnah.com/hisn:13"},{"id":"hisn-14","title":"ذكر من حصن المسلم (14)","category":"Upon completing the ablution","categoryEnglish":"الذكر بعد الفراغ من الوضوء","text":"اللّهُـمَّ اجْعَلنـي مِنَ التَّـوّابينَ وَاجْعَـلْني مِنَ المتَطَهّـرين.","source":"At-Tirmidhi 1/78. See also Al-Albani, Sahih At- Tirmidhi 1/18","sourceUrl":"https://sunnah.com/hisn:14"},{"id":"hisn-15","title":"ذكر من حصن المسلم (15)","category":"Upon completing the ablution","categoryEnglish":"الذكر بعد الفراغ من الوضوء","text":"سُبْحـانَكَ اللّهُـمَّ وَبِحَمدِك أَشْهَـدُ أَنْ لا إِلهَ إِلاّ أَنْتَ أَسْتَغْفِرُكَ وَأَتوبُ إِلَـيْك\nالذكر عند الخروج من المنزل","source":"An-Nasa'i, 'Amalul-Yawm wal-Laylah, p. 173. See also Al-Albani, 'Irwa'ul-Ghalil 1/135 and 2/94.","sourceUrl":"https://sunnah.com/hisn:15"},{"id":"hisn-16","title":"ذكر من حصن المسلم (16)","category":"Remembrance when leaving the home","categoryEnglish":"الذكر عند الخروج من المنزل","text":"بِسْمِ اللهِ ، تَوَكَّلْـتُ عَلى اللهِ وَلا حَوْلَ وَلا قُـوَّةَ إِلاّ بِالله","source":"Abu Dawud 4/325, At-Tirmidhi 5/490. See also Al-Albani, Sahih At-Tirmidhi 3/151","sourceUrl":"https://sunnah.com/hisn:16"},{"id":"hisn-17","title":"ذكر من حصن المسلم (17)","category":"Remembrance when leaving the home","categoryEnglish":"الذكر عند الخروج من المنزل","text":"اللّهُـمَّ إِنِّـي أَعـوذُ بِكَ أَنْ أَضِـلَّ أَوْ أُضَـل ، أَوْ أَزِلَّ أَوْ أُزَل ، أَوْ أَظْلِـمَ أَوْ أَُظْلَـم ، أَوْ أَجْهَلَ أَوْ يُـجْهَلَ عَلَـيّ","source":"Abu Dawud, Ibn Majah, An-Nasa'i, At-Tirmidhi. See also Al-Albani, Sahih At-Tirmidhi 3/152 and Sahih Ibn Majah 2/336","sourceUrl":"https://sunnah.com/hisn:17"},{"id":"hisn-18","title":"ذكر من حصن المسلم (18)","category":"Remembrance upon entering the home","categoryEnglish":"الذكر عند الدخول المنزل","text":"بِسْـمِ اللهِ وَلَجْنـا، وَبِسْـمِ اللهِ خَـرَجْنـا، وَعَلـى رَبِّنـا تَوَكّلْـن (ثم ليسلم على أهله.)","source":"Abu Dawud 4/325. Muslim {Hadith no. 2018) says that one should mention the Name of Allah when entering the home and when beginning to eat; and that the devil, hearing this, says: \"There is no shelter for us here tonight and no food.\"","sourceUrl":"https://sunnah.com/hisn:18"},{"id":"hisn-19","title":"ذكر من حصن المسلم (19)","category":"When going to the mosque","categoryEnglish":"دعاء الذهاب إلى المسجد","text":"اللّهُـمَّ اجْعَـلْ فِي قَلْبـي نُوراً ، وَفي لِسَـانِي نُوراً، وَفِي سَمْعِي نُوراً, وَفِي بَصَرِيِ نُوراً, وَمِنْ فََوْقِي نُوراً , وَ مِنْ تَحْتِي نُوراً, وَ عَنْ يَمِينيِ نُوراَ, وعَنْ شِمَالِي نُوراً, وَمْن أَماَمِي نُوراً, وَمِنْ خَلْفيِ نُوراَ, واجْعَلْ فِي نَفْسِي نُوراً, وأَعْظِمْ لِي نُوراً, وَعظِّمْ لِي نُوراً, وَاجْعَلْ لِي نُوراً, واجْعَلنِي نُوراً, أللَّهُمَّ أَعْطِنِي نُوراً, واجْعَلْ فِي عَصَبِي نُوراً, وَفِي لَحْمِي نُوراً, وَفِي دَمِي نُوراً وَفِي شَعْرِي نُوراً, وفِي بَشَرِي نُوراً (أَللَّهُمَّ اجِعَلْ لِي نُوراً فِي قّبْرِي وَ نُوراَ فِي عِظاَمِي) (وَزِدْنِي نُوراً, وَزِدْنِي نُوراَ , وَزِدْنِي نُوراً) (وَهَبْ لِي نُوراً عَلَى نُوراً )","source":"1 Up to this point was reported by Al-Bukhari 11 / 116 (Hadith no. 6316) and by Muslim 1/526, 529-530 (Hadithno. 763).","sourceUrl":"https://sunnah.com/hisn:19"},{"id":"hisn-20","title":"ذكر من حصن المسلم (20)","category":"Upon entering the mosque","categoryEnglish":"دعاء دخول المسجد","text":"وَبِوَجْهِـهِ الكَرِيـم\nمِنَ الشّيْـطانِ الرَّجـيم،\n[ بِسْـمِ الله، وَالصَّلاةُ وَالسَّلامُ عَلى رَسولِ الله]،\nاللّهُـمَّ افْتَـحْ لي أَبْوابَ رَحْمَتـِك","source":"1\\. Abu Dawud and Al-Albani, Sahihul-Jdmi' As-Saghir (Hadithno. 4591). 2. Ibn As-Sunni (Hadith no. 88), graded good by Al-Albani. 3. Abu Dawud 1/126, see also Al-Albani, Sahihul-Jami'As-Saghir 1/528. 4. Muslim 1/494. There is also a report in Sunan Ibn Majah on the authority of Fatimah (RA), : \"O Allah, forgive me my sins and open for me the doors of Your mercy.\" It was graded authentic by Al-Albani due to supporting Ahadith. See Sahih Ibn Majah 1/128-9.","sourceUrl":"https://sunnah.com/hisn:20"},{"id":"hisn-21","title":"ذكر من حصن المسلم (21)","category":"Upon leaving the mosque","categoryEnglish":"دعاء الخروج من المسجد","text":"بِسمِ الله وَالصّلاةُ وَالسّلامُ عَلى رَسولِ الله، اللّهُـمَّ إِنّـي أَسْأَلُكَ مِـنْ فَضْـلِك، اللّهُـمَّ اعصِمْنـي مِنَ الشَّيْـطانِ الرَّجـيم","source":"ibid.","sourceUrl":"https://sunnah.com/hisn:21"},{"id":"hisn-22","title":"ذكر من حصن المسلم (22)","category":"Concerning the athan (the call to prayer)","categoryEnglish":"أذكار الأذان","text":"يقول مثل ما يقول المؤذن إلا في (حي على الصلاة ، وحي على الفلاح) فيقول","source":"Al-Bukhari 1/152, Muslim 1/288.","sourceUrl":"https://sunnah.com/hisn:22"},{"id":"hisn-23","title":"ذكر من حصن المسلم (23)","category":"Concerning the athan (the call to prayer)","categoryEnglish":"أذكار الأذان","text":"وَأَنا أَشْـهَدُ أَنْ لا إِلـهَ إِلاّ اللهُ وَحْـدَهُ لا شَـريكَ لَـه ، وَأَنَّ محَمّـداً عَبْـدُهُ وَرَسـولُه، رَضيـتُ بِاللهِ رَبَّاً ، وَبِمُحَمَّـدٍ رَسـولاً وَبِالإِسْلامِ دينَـاً","source":"1\\. Muslim 1/290. 2. Ibn Khuzaymah 1/220.","sourceUrl":"https://sunnah.com/hisn:23"},{"id":"hisn-24","title":"ذكر من حصن المسلم (24)","category":"Concerning the athan (the call to prayer)","categoryEnglish":"أذكار الأذان","text":"يُصَلِّي عَلَى النَّبِيِّ صلى الله عليه وسلم بَعْدَ فَرَاغِهِ مِنْ إِجَابَةِ الْمُؤَذِّنِ","source":"Muslim 1/288","sourceUrl":"https://sunnah.com/hisn:24"},{"id":"hisn-25","title":"ذكر من حصن المسلم (25)","category":"Concerning the athan (the call to prayer)","categoryEnglish":"أذكار الأذان","text":"اللّهُـمَّ رَبَّ هَذِهِ الدّعْـوَةِ التّـامَّة\nوَالصّلاةِ القَـائِمَة\nآتِ محَـمَّداً الوَسيـلةَ وَالْفَضـيلَة\nوَابْعَـثْه مَقـامـاً مَحـموداً الَّذي وَعَـدْتَه\n[إِنَّـكَ لا تُـخْلِفُ الميـعاد]","source":"Al-Bukhari 1/152, and the addition between brackets is from Al-Bayhaqi 1/410 with a good (Hasan) chain of narration. See 'Abdul-Azlz bin Baz's Tuhfatul-'Akhyar, pg. 38.","sourceUrl":"https://sunnah.com/hisn:25"},{"id":"hisn-26","title":"ذكر من حصن المسلم (26)","category":"Concerning the athan (the call to prayer)","categoryEnglish":"أذكار الأذان","text":"يَدْعُو لِنَفسِهِ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ فَإِنَّ الدّ
